<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#1e2d3d">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="TrackFit">
<link rel="apple-touch-icon" href="icon-192.png">
<title>TrackFit</title>
<!-- Identity: TrackFit -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* ── V2 Slate: Azul pizarra medio + Cyan eléctrico ── */
  --bg:#1e2d3d; --bg2:#253545; --card:#2a3f54; --card2:#304a60;
  --border:rgba(255,255,255,.07); --border2:rgba(255,255,255,.12);
  --text:#e8f4fa; --text2:rgba(232,244,250,.6); --text3:rgba(232,244,250,.35);
  --accent:#00d4ff; --accentL:rgba(0,212,255,.12); --accentM:rgba(0,212,255,.22);
  --green:#00e5a0; --greenL:rgba(0,229,160,.1);
  --orange:#ffa63c; --orangeL:rgba(255,166,60,.1);
  --red:#ff6b6b; --redL:rgba(255,107,107,.1);
  --purple:#b39ddb; --purpleL:rgba(179,157,219,.1);
  --gold:#ffd166; --goldL:rgba(255,209,102,.12);
  --r:18px; --rsm:12px;
  /* Elevation shadows */
  --shadow-sm:0 2px 12px rgba(0,0,0,.3);
  --shadow-md:0 4px 22px rgba(0,0,0,.38);
  --shadow-lg:0 8px 36px rgba(0,0,0,.5);
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;-webkit-font-smoothing:antialiased;}
::-webkit-scrollbar{width:0;height:0;}
.app{max-width:560px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;}
.hidden{display:none!important;}

/* TOP BAR */
.topbar{padding:8px 16px;display:flex;justify-content:space-between;align-items:center;background:var(--card);box-shadow:var(--shadow-sm);position:relative;z-index:10;}
.logo{font-family:'Instrument Serif',serif;font-size:19px;color:var(--text);letter-spacing:-.3px;}
.logo em{color:var(--accent);font-style:normal;}
.streak-pill{display:flex;align-items:center;gap:5px;background:var(--orangeL);border:1px solid rgba(255,154,60,.2);border-radius:20px;padding:4px 10px 4px 7px;font-size:11px;font-weight:600;color:var(--orange);}

/* NAV — Material 3 pill indicator */
.nav{display:flex;justify-content:space-around;background:var(--card);border-top:1px solid var(--border);padding:5px 4px 18px;position:sticky;bottom:0;z-index:100;box-shadow:0 -4px 24px rgba(0,0,0,.5);}
.nb{display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px 10px 6px;border:none;background:transparent;color:var(--text3);cursor:pointer;font-size:10px;font-weight:600;font-family:'DM Sans',sans-serif;transition:color .18s;border-radius:14px;}
.nb svg{transition:opacity .18s;opacity:.35;}
.nb-pill{padding:2px 16px;border-radius:20px;display:flex;align-items:center;justify-content:center;margin-bottom:2px;transition:background .18s;}
.nb.on{color:var(--accent);}
.nb.on svg{opacity:1;}
.nb.on .nb-pill{background:var(--accentL);}
.nb.goals-on{color:var(--green);}
.nb.goals-on svg{opacity:1;}
.nb.goals-on .nb-pill{background:var(--greenL);}

/* PAGE TRANSITIONS */
.page{flex:1;overflow-y:auto;padding:10px 14px 6px;animation:pgIn .18s ease both;}
@keyframes pgIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}

/* CARDS — shadow-based elevation, no borders on primary cards */
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow-sm);}
.card-primary{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow-md);}
.card-border{background:var(--card);border:1px solid var(--border);border-radius:var(--r);}
.cp{padding:16px;}
.row{background:var(--card);border-radius:var(--r);margin-bottom:8px;cursor:pointer;transition:all .18s;box-shadow:var(--shadow-sm);}
.row:hover{transform:translateY(-1px);box-shadow:var(--shadow-md);}

/* EMPTY STATES */
.empty-state{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:52px 24px;text-align:center;}
.empty-state-icon{font-size:44px;margin-bottom:14px;}
.empty-state-title{font-family:'Instrument Serif',serif;font-size:20px;color:var(--text2);margin-bottom:6px;letter-spacing:-.3px;}
.empty-state-sub{font-size:12px;color:var(--text3);line-height:1.6;max-width:220px;}

/* TYPOGRAPHY */
.ptitle{font-family:'Instrument Serif',serif;font-size:26px;color:var(--text);letter-spacing:-.4px;line-height:1.1;}
.slabel{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.6px;text-transform:uppercase;margin-bottom:8px;display:block;}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;gap:6px;border:none;border-radius:10px;padding:9px 15px;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s;font-family:'DM Sans',sans-serif;}
.btn-p{background:var(--accent);color:#0a1a26;}
.btn-p:hover{filter:brightness(1.1);box-shadow:0 3px 14px rgba(61,214,232,.4);}
.btn-g{background:var(--green);color:#0a1a26;}
.btn-ghost{background:var(--card2);color:var(--text2);border:1px solid var(--border);}
.btn-ghost:hover{border-color:var(--border2);color:var(--text);}
.btn-red{background:var(--redL);color:var(--red);border:1px solid rgba(255,107,107,.15);}

/* TABS — Material underline style */
.tabs{display:flex;background:var(--card);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-sm);overflow:hidden;}
.tab{flex:1;border:none;background:transparent;color:var(--text3);padding:10px 4px 9px;font-size:9px;font-weight:600;cursor:pointer;transition:color .18s;font-family:'DM Sans',sans-serif;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;white-space:nowrap;}
.tab svg{opacity:.3;transition:opacity .18s;}
.tab.on{color:var(--accent);}
.tab.on svg{opacity:1;}
.g-dot-done{background:rgba(0,229,160,.13);border:1.5px solid rgba(0,229,160,.4);color:var(--green);}
.g-dot-pend{background:var(--card2);border:1.5px dashed rgba(255,255,255,.12);color:var(--text3);}
.sess-dot{width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;}
.sess-dot.done{background:rgba(0,229,160,.15);border:1.5px solid rgba(0,229,160,.4);color:var(--green);}
.sess-dot.pending{background:rgba(255,255,255,.05);border:1.5px dashed rgba(255,255,255,.2);color:var(--text3);}
.tab.on::after{content:'';position:absolute;bottom:-1px;left:12%;right:12%;height:2.5px;background:var(--accent);border-radius:2px 2px 0 0;}
.tab.on-green{color:var(--green);}
.tab.on-green svg{opacity:1;}
.tab.on-green::after{background:var(--green);}

/* CHIPS */
.chip{border:1px solid var(--border);background:var(--card2);color:var(--text3);padding:5px 12px;border-radius:20px;font-size:11px;font-weight:600;cursor:pointer;transition:all .14s;white-space:nowrap;font-family:'DM Sans',sans-serif;}
.chip.on{border-color:var(--accent);background:var(--accentL);color:var(--accent);}
.chips{display:flex;gap:5px;overflow-x:auto;padding-bottom:2px;touch-action:pan-x;-webkit-overflow-scrolling:touch;}

/* FORM */
.flabel{font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.5px;text-transform:uppercase;margin-bottom:5px;display:block;}
.inp{width:100%;background:var(--card2);border:1.5px solid var(--border);border-radius:10px;padding:10px 13px;font-size:13px;font-family:'DM Sans',sans-serif;color:var(--text);outline:none;transition:all .16s;appearance:none;}
.inp:focus{border-color:var(--accent);background:var(--card);box-shadow:0 0 0 3px var(--accentL);}
select.inp{cursor:pointer;}
textarea.inp{resize:vertical;min-height:64px;line-height:1.5;}
.fgroup{margin-bottom:12px;}
.frow2{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* PILL */
.pill{display:inline-flex;align-items:center;gap:3px;background:var(--card2);border:1px solid var(--border);border-radius:6px;padding:2px 8px;font-size:10px;font-weight:600;}
.badge-pr{background:var(--goldL);color:var(--gold);border:1px solid rgba(255,213,79,.2);border-radius:6px;padding:2px 7px;font-size:10px;font-weight:700;display:inline-flex;align-items:center;gap:3px;}

/* PROGRESS */
.pbar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
.pbar-fill{height:100%;border-radius:3px;transition:width .6s cubic-bezier(.34,1.56,.64,1);}
.pbar-lg{height:10px;background:var(--bg2);border-radius:5px;overflow:hidden;}

/* MINI CHART */
.minichart{display:flex;align-items:flex-end;gap:3px;height:52px;}
.mb-w{display:flex;flex-direction:column;align-items:center;gap:2px;flex:1;}
.mb{width:100%;border-radius:3px 3px 0 0;min-height:3px;}
.mb-lbl{font-size:7px;font-weight:600;color:var(--text3);}

/* SESS ROW */
.sess-row{background:var(--card);border-radius:var(--r);margin-bottom:8px;overflow:hidden;cursor:pointer;transition:box-shadow .18s;box-shadow:var(--shadow-sm);}
.sess-row:hover{box-shadow:var(--shadow-md);}
.sess-bar{width:4px;flex-shrink:0;}
.sess-inner{display:flex;align-items:stretch;}

/* OVERLAY / SHEET */
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;display:flex;align-items:flex-end;animation:ov .2s;}
.sheet{background:var(--card);border-radius:24px 24px 0 0;padding:20px 18px 34px;max-height:94vh;overflow-y:auto;width:100%;max-width:560px;margin:0 auto;animation:su .28s cubic-bezier(.34,1.4,.64,1);box-shadow:0 -8px 40px rgba(0,0,0,.4);}
.sheet-hdl{width:34px;height:4px;background:var(--border2);border-radius:2px;margin:0 auto 18px;}
.stitle{font-family:'Instrument Serif',serif;font-size:20px;margin-bottom:4px;}
.ssub{font-size:12px;color:var(--text2);margin-bottom:18px;}
@keyframes ov{from{opacity:0}to{opacity:1}}
@keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}

/* IC */
.ic{display:flex;align-items:center;justify-content:center;border-radius:14px;flex-shrink:0;}

/* SUGGEST BOX */
.sbox{background:var(--accentL);border:1px solid rgba(61,214,232,.2);border-radius:10px;padding:8px 12px;display:flex;align-items:center;gap:8px;margin-bottom:8px;}
.sbox-g{background:var(--greenL);border-color:rgba(67,224,151,.2);}

/* STAGGER ANIM */
.fade-up{animation:fadeUp .3s ease both;}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ACTIVE WORKOUT SCREEN */
.aw-screen{position:fixed;inset:0;z-index:300;background:var(--bg);overflow-y:auto;display:flex;flex-direction:column;}
.aw-header{background:var(--card);box-shadow:var(--shadow-md);position:sticky;top:0;z-index:10;}
.aw-prog-bar{height:4px;background:rgba(61,214,232,.1);}
.aw-prog-fill{height:100%;background:var(--accent);transition:width .5s ease;border-radius:0 3px 3px 0;box-shadow:0 0 8px rgba(61,214,232,.4);}
.aw-title{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;}
.aw-timer{font-size:28px;font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums;letter-spacing:-1px;font-family:'DM Sans',sans-serif;flex-shrink:0;}
.aw-ex-wrap{margin-bottom:8px;border-radius:16px;overflow:hidden;box-shadow:var(--shadow-sm);border-left:4px solid var(--accent);}
.aw-ex-card{background:var(--card);padding:16px 15px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:background .15s;}
.aw-ex-card:hover{background:var(--card2);}
.aw-set-panel{background:var(--card2);border-top:1px solid var(--border);padding:16px 15px;}
.aw-set-header{display:grid;grid-template-columns:28px 1fr 1fr 46px;gap:8px;margin-bottom:8px;}
.aw-inp{background:var(--bg);border:1.5px solid var(--border2);border-radius:10px;padding:8px 4px;font-size:18px;font-weight:800;font-family:'DM Sans',sans-serif;color:var(--text);text-align:center;width:100%;outline:none;transition:all .15s;}
.aw-inp:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(61,214,232,.15);}
.aw-inp.done{background:rgba(67,224,151,.08);border-color:rgba(67,224,151,.3);color:var(--green);}
.aw-inp::placeholder{color:var(--text3);font-size:14px;font-weight:400;}
.aw-check{width:46px;height:46px;border-radius:14px;border:2px solid var(--border2);background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .18s;flex-shrink:0;}
.aw-check:active{transform:scale(.92);}
.aw-check.done{background:var(--green);border-color:var(--green);box-shadow:0 0 12px rgba(67,224,151,.35);}
.aw-dot{width:8px;height:8px;border-radius:50%;background:var(--border2);transition:background .2s;flex-shrink:0;}
.aw-dot.done{background:var(--green);box-shadow:0 0 5px rgba(67,224,151,.5);}

/* PR FLASH */
.pr-flash{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:400;background:rgba(255,213,79,.08);border:1.5px solid rgba(255,213,79,.35);border-radius:20px;padding:18px 28px;text-align:center;box-shadow:0 8px 32px rgba(255,213,79,.3);animation:prF 2.2s ease forwards;pointer-events:none;}
@keyframes prF{0%{opacity:0;transform:translate(-50%,-50%) scale(.8)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.05)}70%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(.95)}}

/* TOAST */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--card2);color:var(--text);border:1px solid var(--border2);border-radius:12px;padding:10px 18px;font-size:13px;font-weight:600;z-index:999;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow-lg);animation:toastA .3s ease;white-space:nowrap;pointer-events:none;}
@keyframes toastA{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* SUMMARY SCREEN */
.sum-screen{position:fixed;inset:0;z-index:300;background:var(--bg);overflow-y:auto;}

/* GOAL PROGRESS */
.goal-card{background:var(--card);border-radius:var(--r);padding:16px;margin-bottom:10px;box-shadow:var(--shadow-sm);}

/* HERO CARD */
.hero-card{border-radius:22px;overflow:hidden;position:relative;min-height:160px;margin-bottom:10px;box-shadow:var(--shadow-lg);}
.hero-bg{position:absolute;inset:0;}
.hero-content{position:relative;padding:22px 20px;}
.hero-orb{position:absolute;border-radius:50%;background:rgba(255,255,255,.07);}

/* BODYWEIGHT */
.bw-chart{position:relative;height:60px;}

hr{border:none;border-top:1px solid var(--border);margin:14px 0;}

/* WEIGHT INPUT ROW */
.w-row{display:grid;grid-template-columns:22px 1fr auto 1fr auto 80px;gap:6px;align-items:center;margin-bottom:8px;}
.inp-mini{background:var(--card2);border:1.5px solid var(--border);border-radius:8px;padding:8px 6px;font-size:13px;font-family:'DM Sans',sans-serif;color:var(--text);outline:none;text-align:center;width:100%;}
.inp-mini:focus{border-color:var(--accent);}
.inp-unit{font-size:9px;color:var(--text3);font-weight:600;}
.rpe-row{display:flex;gap:3px;}
.rpe-btn{width:22px;height:22px;border:1px solid var(--border);border-radius:5px;background:transparent;cursor:pointer;font-size:9px;font-weight:700;color:var(--text3);font-family:'DM Sans',sans-serif;transition:all .1s;}
.rpe-btn.on{background:var(--accent);border-color:var(--accent);color:#0a1a26;}

/* TPL CARD */
.tpl-card{background:var(--card);border-radius:var(--r);padding:14px 15px;cursor:pointer;transition:all .18s;margin-bottom:8px;box-shadow:var(--shadow-sm);}
.tpl-card:hover{transform:translateY(-1px);box-shadow:var(--shadow-md);}

/* FAB */
.wk-fab{position:fixed;bottom:86px;right:calc(50% - 260px + 16px);z-index:150;background:var(--accent);color:#0a1a26;border:none;border-radius:50px;padding:12px 20px;font-size:13px;font-weight:800;font-family:'DM Sans',sans-serif;cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:0 4px 20px rgba(0,212,255,.4);transition:transform .14s,box-shadow .14s;}
.wk-fab:active{transform:scale(.95);}
@media(max-width:560px){.wk-fab{right:16px;}}

/* REST TIMER */
.rest-overlay{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:350;background:var(--card);border:1px solid var(--border2);border-radius:18px;padding:12px 20px;display:flex;align-items:center;gap:14px;box-shadow:var(--shadow-lg);min-width:220px;animation:slideUp .2s ease;}
@keyframes slideUp{from{opacity:0;transform:translateX(-50%) translateY(12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.rest-ring{position:relative;width:44px;height:44px;flex-shrink:0;}
.rest-ring svg{transform:rotate(-90deg);}
.rest-ring .ring-bg{fill:none;stroke:var(--border2);stroke-width:4;}
.rest-ring .ring-fill{fill:none;stroke:var(--green);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .9s linear;}
.rest-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Instrument Serif',serif;font-size:16px;color:var(--green);}

/* TOAST */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--border);color:var(--text);border:1px solid #444;border-radius:12px;padding:10px 18px;font-size:13px;font-weight:600;z-index:999;display:flex;align-items:center;gap:8px;box-shadow:0 8px 24px rgba(0,0,0,.25);animation:toastA .3s ease;white-space:nowrap;pointer-events:none;}
@keyframes toastA{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}

/* SUMMARY SCREEN */
.sum-screen{position:fixed;inset:0;z-index:300;background:var(--bg);overflow-y:auto;}

/* GOAL PROGRESS */
.goal-card{background:var(--card);border:1px solid var(--border);border-radius:var(--r);padding:16px;margin-bottom:10px;}

/* HERO CARD (overview) */
.hero-card{border-radius:22px;overflow:hidden;position:relative;min-height:160px;margin-bottom:10px;}
.hero-bg{position:absolute;inset:0;}
.hero-content{position:relative;padding:22px 20px;}
.hero-orb{position:absolute;border-radius:50%;background:rgba(255,255,255,.07);}

/* BODYWEIGHT */
.bw-chart{position:relative;height:60px;}

hr{border:none;border-top:1px solid var(--border);margin:14px 0;}

/* WEIGHT INPUT ROW */
.w-row{display:grid;grid-template-columns:22px 1fr auto 1fr auto 80px;gap:6px;align-items:center;margin-bottom:8px;}
.inp-mini{background:var(--card2);border:1.5px solid var(--border);border-radius:8px;padding:8px 6px;font-size:13px;font-family:'DM Sans',sans-serif;color:var(--text);outline:none;text-align:center;width:100%;}
.inp-mini:focus{border-color:var(--accent);}
.inp-unit{font-size:9px;color:var(--text3);font-weight:600;}
.rpe-row{display:flex;gap:3px;}
.rpe-btn{width:22px;height:22px;border:1px solid var(--border);border-radius:5px;background:transparent;cursor:pointer;font-size:9px;font-weight:700;color:var(--text3);font-family:'DM Sans',sans-serif;transition:all .1s;}
.rpe-btn.on{background:var(--accent);border-color:var(--accent);color:#fff;}

/* TPL CARD */
.tpl-card{background:var(--card);border:1.5px solid var(--border);border-radius:var(--r);padding:14px 15px;cursor:pointer;transition:all .18s;margin-bottom:8px;}
.tpl-card:hover{border-color:var(--border2);transform:translateY(-1px);box-shadow:0 3px 12px rgba(0,0,0,.06);}

/* FAB */
.wk-fab{position:fixed;bottom:86px;right:calc(50% - 260px + 16px);z-index:150;background:var(--accent);color:#0a1a26;border:none;border-radius:50px;padding:12px 20px;font-size:13px;font-weight:800;font-family:'DM Sans',sans-serif;cursor:pointer;display:flex;align-items:center;gap:8px;box-shadow:0 4px 20px rgba(0,212,255,.45);transition:transform .14s,box-shadow .14s;}
.wk-fab:active{transform:scale(.95);}
@media(max-width:560px){.wk-fab{right:16px;}}

/* REST TIMER */
.rest-overlay{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);z-index:350;background:#1a1a1a;border:1px solid #444;border-radius:16px;padding:12px 20px;display:flex;align-items:center;gap:14px;box-shadow:0 8px 28px rgba(0,0,0,.5);min-width:220px;animation:slideUp .2s ease;}
@keyframes slideUp{from{opacity:0;transform:translateX(-50%) translateY(12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
.rest-ring{position:relative;width:44px;height:44px;flex-shrink:0;}
.rest-ring svg{transform:rotate(-90deg);}
.rest-ring .ring-bg{fill:none;stroke:#333;stroke-width:4;}
.rest-ring .ring-fill{fill:none;stroke:var(--green);stroke-width:4;stroke-linecap:round;transition:stroke-dashoffset .9s linear;}
.rest-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Instrument Serif',serif;font-size:16px;color:var(--green);}
</style>

// ── MIGRATION: ensure tplGroups exists and demo variants are seeded ──
(()=>{
  let dirty = false;

  // 1. If tplGroups was never saved, seed it
  if(!DB.get("tf_grp")){
    tplGroups = DEFAULT_TPLGROUPS;
    dirty = true;
  }

  // 2. If templates exist but none have groupId, seed the variant B and group
  const hasGroup = templates.some(t=>t.groupId);
  if(!hasGroup && templates.length){
    // Find first template that looks like a push day to demo with
    const pushTpl = templates.find(t=>t.name.toLowerCase().includes("pecho")||t.name.toLowerCase().includes("push")||t.id===templates[0].id);
    if(pushTpl){
      // Assign group 101 + variant A to it
      const idx = templates.findIndex(t=>t.id===pushTpl.id);
      templates[idx] = {...templates[idx], groupId:101, variant:"A"};

      // Ensure group 101 exists
      if(!tplGroups.find(g=>g.id===101)){
        tplGroups.push({id:101, name:pushTpl.name});
      }

      // Create variant B if it doesn't exist
      if(!templates.find(t=>t.groupId===101&&t.variant==="B")){
        // Pick different exercises from the same muscles
        const musclesInA = [...new Set(pushTpl.exIds.map(id=>exercises.find(e=>e.id===id)?.muscle).filter(Boolean))];
        const altExIds = exercises
          .filter(ex=>musclesInA.includes(ex.muscle)&&!pushTpl.exIds.includes(ex.id))
          .slice(0,Math.min(6, pushTpl.exIds.length))
          .map(e=>e.id);
        const bExIds = altExIds.length>=3 ? altExIds : [...pushTpl.exIds].reverse().slice(0,5);
        templates.push({
          id: Date.now(),
          name: pushTpl.name,
          color: pushTpl.color,
          exIds: bExIds,
          groupId: 101,
          variant: "B"
        });
      }

      dirty = true;
    }
  }

  // 3. Fix Hombros/Brazos template: remove chest/core/glutes, set correct exIds and color
  const hombrosTpl = templates.find(t=>t.name==="Hombros / Brazos");
  if(hombrosTpl){
    const badMuscles = ["Pecho","Core","Glúteos"];
    const hasBad = hombrosTpl.exIds.some(id=>{
      const ex = exercises.find(e=>e.id===id);
      return ex && badMuscles.includes(ex.muscle);
    });
    if(hasBad || hombrosTpl.color==="#38bdf8"){
      const idx = templates.findIndex(t=>t.name==="Hombros / Brazos");
      templates[idx] = {...templates[idx], color:"#f472b6", exIds:[14,15,16,35,63,64,65,66,17,18,44,45,48,50,19,20,46,52,53]};
      dirty = true;
    }
  }

  // 4. Fix Full Body template: ensure all muscle groups are present
  const fullBodyTpl = templates.find(t=>t.name==="Full Body");
  if(fullBodyTpl){
    const muscles = new Set(fullBodyTpl.exIds.map(id=>exercises.find(e=>e.id===id)?.muscle).filter(Boolean));
    const required = ["Pecho","Espalda","Piernas","Hombros","Bíceps","Tríceps","Core","Glúteos"];
    const missingAny = required.some(m=>!muscles.has(m));
    if(missingAny){
      const idx = templates.findIndex(t=>t.name==="Full Body");
      templates[idx] = {...templates[idx], exIds:[1,5,9,14,17,19,21,23]};
      dirty = true;
    }
  }

  if(dirty){ DB.set("tf_tpl",templates); DB.set("tf_grp",tplGroups); DB.set("tf_ss",sessions); }
})();

// ── TOPBAR RING ──────────────────────────────────────────────
function renderTopbarRing() {
  const mon = mondayOf();
  const weekSess = sessions.filter(s => new Date(s.date + "T12:00:00") >= mon);
  const sessGoal = Math.max(goals.weeklyDays || 3, 1);
  const gymMins  = weekSess.reduce((a, s) => a + (s.duration || 0), 0);
  const weekCardio = cardioData.filter(c => new Date(c.date + "T12:00:00") >= mon);
  const cardioMins = weekCardio.reduce((a, c) => a + (c.duration || Math.round((c.km || 0) * 5)), 0);
  const totalMins  = gymMins + cardioMins;
  const timeGoal   = goals.weeklyActiveMins || 300;
  const pct        = Math.min(Math.round(totalMins / timeGoal * 100), 100);
  const h = Math.floor(totalMins / 60);
  const m = totalMins % 60;
  const timeStr = h > 0 ? (m > 0 ? `${h}h ${m}m` : `${h}h`) : `${m}m`;
  const color = pct >= 100 ? "var(--green)" : pct > 0 ? "var(--accent)" : "var(--text3)";
  const sessEl = document.getElementById("tb-sess-val");
  if (sessEl) { sessEl.textContent = weekSess.length + "/" + sessGoal; sessEl.style.color = weekSess.length >= sessGoal ? "var(--green)" : "var(--accent)"; }
  const timeEl = document.getElementById("tb-time-val");
  if (timeEl) { timeEl.textContent = totalMins > 0 ? timeStr : "0m"; timeEl.style.color = color; }
  const arc = document.getElementById("tb-ring-arc");
  const pctEl = document.getElementById("tb-ring-pct");
  if (arc) { arc.style.strokeDashoffset = 81.68 * (1 - pct / 100); arc.style.stroke = color; }
  if (pctEl) { pctEl.textContent = pct + "%"; pctEl.style.color = color; }
}

const localToday = () => new Intl.DateTimeFormat('sv-SE').format(new Date()); // 'sv-SE' gives YYYY-MM-DD in local tz

const mondayOf= (d=new Date()) => { const ds=localToday(); const base=new Date(ds+"T12:00:00"); if(d!==undefined&&isoDate(d)!==ds) { const r=new Date(d); r.setHours(12,0,0,0); r.setDate(r.getDate()-((r.getDay()+6)%7)); return r; } const r=new Date(base); r.setDate(r.getDate()-((r.getDay()+6)%7)); r.setHours(0,0,0,0); return r; };
const ha      = (h,a) => { const r=parseInt(h.slice(1,3),16),g=parseInt(h.slice(3,5),16),b=parseInt(h.slice(5,7),16); return `rgba(${r},${g},${b},${a})`; };

// Returns the next template to use for a group (based on last session)
const nextVariant = (groupId) => {
  const variants = templates.filter(t=>t.groupId===groupId);
  if(!variants.length) return null;
  if(variants.length===1) return variants[0];
  // Find the last session using any variant in this group
  const groupTplIds = new Set(variants.map(t=>t.id));
  const lastGroupSess = sessions.find(s=>groupTplIds.has(s.tplId));
  if(!lastGroupSess) return variants[0];
  // Return the next variant after the last one used
  const lastTpl = variants.find(t=>t.id===lastGroupSess.tplId);
  const lastIdx = variants.indexOf(lastTpl);
  return variants[(lastIdx+1)%variants.length];
};

const computeStreak = () => {
  const s=new Set([...sessions.map(x=>x.date),...cardioData.map(x=>x.date)]);
  let n=0, d=new Date(); d.setHours(0,0,0,0);
  const step = () => {
    const ds = isoDate(d);
    if (s.has(ds)) { n++; d.setDate(d.getDate()-1); return true; }
    if (isVacWeek(ds)) { d.setDate(d.getDate()-1); return true; } // skip vac day
    return false;
  };
  while(step()){}
  if(!n){ d=new Date(); d.setDate(d.getDate()-1); d.setHours(0,0,0,0); while(step()){} }
  return n;
};

  .map(s=>{ const ex=s.exercises.find(e=>e.exId===exId); return {date:s.date,maxW:maxWset(ex.sets),totalVol:ex.sets.reduce((a,x)=>a+(x.w||0)*x.r,0),sets:ex.sets}; })
  .sort((a,b)=>a.date>b.date?1:-1);

const lastUsed = exId => {
  const h=exHistory(exId); if(!h.length) return null;
  const last=h[h.length-1];
  const avgRpe=last.sets.reduce((a,x)=>a+(x.rpe||7),0)/last.sets.length;
  const suggest=avgRpe<=8?last.maxW+2.5:last.maxW;
  return {lastW:last.maxW,suggest,improved:suggest>last.maxW,lastDate:last.date,lastSets:last.sets};
};

function goTab(tab) {
  activeTab=tab;
  localStorage.setItem("tf_activeTab",tab);
  ["overview","workouts","cardio","planner","goals"].forEach(t=>{
    const el=document.getElementById(`pg-${t}`);
    el.classList.toggle("hidden",t!==tab);
    if(t===tab){el.style.animation="none";void el.offsetWidth;el.style.animation="";}
  });
  document.querySelectorAll(".nb").forEach((b,i)=>{
    const tabs=["overview","workouts","cardio","planner","goals","settings"];
    b.classList.remove("on","goals-on");
    if(tabs[i]===tab) b.classList.add(tab==="goals"?"goals-on":"on");
  });
  render(tab);
}
function render(tab){
  if(tab==="overview") renderOverview();
  if(tab==="workouts") renderWorkouts();
  if(tab==="cardio")   renderCardio();
  if(tab==="planner")  renderPlanner();
  if(tab==="goals")    renderGoals();
  // Show/hide FAB
  const fab=document.getElementById("wk-fab");
  if(fab) fab.classList.toggle("hidden", tab!=="workouts");
}

function calDayTap(ds, dow){
  const daySessions=sessions.filter(s=>s.date===ds);
  const dayCardio=cardioData.filter(c=>c.date===ds);
  const plan=patternForDate(ds)[dow]||null;
  const plannedTpl=plan?.tplId?templates.find(t=>t.id===plan.tplId):null;
  const plannedCardio=plan?.cardio;
  const plannedRest=plan?.rest;

  const dateObj=new Date(ds+"T12:00:00");
  const dateLabel=dateObj.toLocaleDateString("es-ES",{weekday:"long",day:"numeric",month:"long"});

  // Build content
  let html=`<div style="font-size:10px;font-weight:700;color:var(--text3);text-transform:uppercase;letter-spacing:.8px;margin-bottom:12px;">${dateLabel}</div>`;

  if(daySessions.length===0&&dayCardio.length===0){
    // Only planned
    html+=`<div style="display:flex;align-items:center;gap:10px;padding:12px;background:var(--bg);border-radius:12px;border:1px solid var(--border);">`;
    if(plannedTpl){
      html+=`<div style="background:${ha(plannedTpl.color,.1)};border:1px solid ${ha(plannedTpl.color,.2)};border-radius:10px;padding:4px;flex-shrink:0;">${bodyFigure([...new Set(plannedTpl.exIds.map(id=>exercises.find(e=>e.id===id)?.muscle).filter(Boolean))],38)}</div>`;
      html+=`<div><div style="font-size:13px;font-weight:700;color:var(--text);">${plannedTpl.name}</div><div style="font-size:11px;color:var(--text3);margin-top:2px;">Planificado · No completado</div></div>`;
    } else if(plannedCardio){
      html+=`<div style="font-size:28px;">🏃</div><div><div style="font-size:13px;font-weight:700;color:var(--text);">Cardio</div><div style="font-size:11px;color:var(--text3);margin-top:2px;">Planificado · No completado</div></div>`;
    } else if(plannedRest){
      html+=`<div style="font-size:28px;">🛌</div><div style="font-size:13px;font-weight:700;color:var(--text);">Día de descanso</div>`;
    }
    html+=`</div>`;
    html+=`<button onclick="closeDayPopup();goTab('planner');" style="width:100%;margin-top:10px;background:var(--accentL);border:1px solid var(--accent);color:var(--accent);border-radius:10px;padding:10px;font-size:12px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;">Ir al Planner →</button>`;
  } else {
    // Gym sessions
    daySessions.forEach(s=>{
      const tpl=templates.find(t=>t.id===s.tplId);
      const c=tpl?.color||"var(--accent)";
      const vol=Math.round(volSess(s)/1000*10)/10;
      const muscles=[...new Set((tpl?.exIds||[]).map(id=>exercises.find(e=>e.id===id)?.muscle).filter(Boolean))];
      html+=`<div style="background:var(--bg);border:1px solid var(--border);border-left:3px solid ${c};border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;">
        <div style="background:${ha(c,.08)};border-radius:9px;padding:3px;flex-shrink:0;">${bodyFigure(muscles,34)}</div>
        <div style="flex:1;">
          <div style="font-size:13px;font-weight:700;color:var(--text);">${tpl?.name||"Sesión"}</div>
          <div style="font-size:11px;color:var(--text2);margin-top:2px;">${s.duration}min · ${s.exercises.length} ejerc. · ${vol}k kg</div>
        </div>
        <button onclick="closeDayPopup();goTab('workouts');wkSub='history';setTimeout(()=>{expandSess=${s.id};renderHistory();},80);" style="background:var(--card2);border:1px solid var(--border);color:var(--text2);border-radius:8px;padding:5px 10px;font-size:10px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap;">Ver →</button>
      </div>`;
    });
    // Cardio sessions
    dayCardio.forEach(c=>{
      const icon=c.type?.toLowerCase().includes("cicl")?"🚴":c.type?.toLowerCase().includes("march")?"🚶":"🏃";
      html+=`<div style="background:var(--bg);border:1px solid var(--border);border-left:3px solid var(--green);border-radius:12px;padding:12px 14px;margin-bottom:8px;display:flex;align-items:center;gap:10px;">
        <div style="font-size:26px;flex-shrink:0;">${icon}</div>
        <div style="flex:1;">
          <div style="font-size:13px;font-weight:700;color:var(--text);">${c.type||"Cardio"}</div>
          <div style="font-size:11px;color:var(--text2);margin-top:2px;">${c.km?c.km+"km":""}${c.time?" · "+c.time+"min":""}${c.bpm?" · "+c.bpm+"bpm":""}</div>
          ${c.notes?`<div style="font-size:10px;color:var(--text3);margin-top:2px;font-style:italic;">${c.notes}</div>`:""}
        </div>
        <button onclick="closeDayPopup();goTab('cardio');" style="background:var(--card2);border:1px solid var(--border);color:var(--text2);border-radius:8px;padding:5px 10px;font-size:10px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;white-space:nowrap;">Ver →</button>
      </div>`;
    });
  }

  // Show popup
  const overlay=document.getElementById("day-popup-overlay");
  const box=document.getElementById("day-popup-box");
  document.getElementById("day-popup-content").innerHTML=html;
  overlay.classList.remove("hidden");
  box.style.transform="translateY(100%)";
  requestAnimationFrame(()=>{ box.style.transition="transform .28s cubic-bezier(.32,1,.68,1)"; box.style.transform="translateY(0)"; });
}
function closeDayPopup(){
  const overlay=document.getElementById("day-popup-overlay");
  const box=document.getElementById("day-popup-box");
  box.style.transform="translateY(100%)";
  setTimeout(()=>overlay.classList.add("hidden"),280);
}

function calNav(dir){
  _calOffset+=dir;
  const card=document.getElementById("cal-card");
  if(card) card.innerHTML=renderCalCard();
}

function renderCalCard(){
  const now=new Date();
  const y=now.getFullYear();
  const m=now.getMonth(); // 0-based

  // Apply offset
  const tgt=new Date(y, m+_calOffset, 1);
  const ty=tgt.getFullYear();
  const tm=tgt.getMonth();

  const isCurrentMonth=(_calOffset===0);
  const todayStr=isoDate(now);

  // Days in month
  const daysInMonth=new Date(ty,tm+1,0).getDate();

  // First weekday (Mon=0)
  const firstDow=(new Date(ty,tm,1).getDay()+6)%7;

  // Month name
  const monthName=MONTHS[tm]+" "+ty;

  // Stats for this month
  const monthSess=sessions.filter(s=>{const d=new Date(s.date+"T12:00:00");return d.getFullYear()===ty&&d.getMonth()===tm;});
  const monthCardio=cardioData.filter(c=>{const d=new Date(c.date+"T12:00:00");return d.getFullYear()===ty&&d.getMonth()===tm;});
  const monthVol=monthSess.reduce((a,s)=>a+volSess(s),0);
  const activeDays=new Set([...monthSess.map(s=>s.date),...monthCardio.map(c=>c.date)]).size;

  // Cardio type icons
  const cardioIcon = type => {
    if(!type) return "🏃";
    const t=type.toLowerCase();
    if(t.includes("cicl")||t.includes("bici")) return "🚴";
    if(t.includes("march")||t.includes("and")) return "🚶";
    return "🏃";
  };

  // Build day cells
  const cells=[];
  for(let i=0;i<firstDow;i++) cells.push(null);
  for(let d=1;d<=daysInMonth;d++){
    const ds=`${ty}-${String(tm+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;
    const dayOfWeek=EN_DAYS[(new Date(ty,tm,d).getDay()+6)%7];
    const monStr=isoDate(mondayOf());
    const inPlanRange = ds >= monStr && ds < isoDate(new Date(new Date(monStr+"T12:00:00").setDate(new Date(monStr+"T12:00:00").getDate()+28)));
    // Resolve plan using same logic as planForDay: exceptions → active block → base pattern
    let plan = null;
    if(inPlanRange){
      if(window._planExceptions && window._planExceptions[ds]){
        const exc = window._planExceptions[ds];
        if(exc.tplId) plan = {tplId: exc.tplId};
        else if(exc.cardio || exc.type==="cardio") plan = {cardio: true};
      } else {
        const activeBlock = (window._planBlocks||[]).find(b=>b.active&&!b.completed);
        if(activeBlock){
          const blockMon = activeBlock.startDate ? new Date(activeBlock.startDate+"T12:00:00") : new Date(monStr+"T12:00:00");
          const blockEnd = new Date(blockMon); blockEnd.setDate(blockMon.getDate()+activeBlock.weeks*7-1);
          if(new Date(ds+"T12:00:00") <= blockEnd){
            const slot = (activeBlock.pattern[dayOfWeek]||[])[0];
            if(slot && slot.type==="gym" && slot.tplId) plan = {tplId: slot.tplId};
            else if(slot && slot.type==="cardio") plan = {cardio: true};
          }
        } else {
          plan = patternForDate(ds)[dayOfWeek] || null;
        }
      }
    }
    // Actual activity
    const sessDone=sessions.filter(s=>s.date===ds);
    const cardioDone=cardioData.filter(c=>c.date===ds);
    const hasSess=sessDone.length>0;
    const hasCard=cardioDone.length>0;
    const isToday=ds===todayStr;
    const isFuture=ds>todayStr;

    // Past: only real sessions. Future+today: only planned.
    const showReal   = !isFuture; // past + today shows real activity
    const showPlan   = isFuture;  // only future shows planned dots

    const plannedGym    = (showPlan || isToday) && !hasSess && plan?.tplId ? templates.find(t=>t.id===plan.tplId) : null;
    const plannedCardio = (showPlan || isToday) && !hasCard && plan?.cardio && !plan?.tplId;

    const tplColor=(sessDone[0]?.tplId?templates.find(t=>t.id===sessDone[0].tplId)?.color:null)||"var(--accent)";
    const cardioKm=cardioDone.length?cardioDone.reduce((a,c)=>a+(c.km||0),0):null;
    const cardioType=cardioDone.length?cardioDone[0].type:null;
    const lastSessId=sessDone.length?sessDone[sessDone.length-1].id:null;
    cells.push({d,ds,hasSess:showReal&&hasSess,hasCard:showReal&&hasCard,plannedGym,plannedCardio,isToday,isFuture,tplColor,cardioKm,cardioType,lastSessId,dayOfWeek});
  }

  const dayLabels=["L","M","X","J","V","S","D"].map(l=>
    `<div style="font-size:8px;font-weight:700;color:var(--text3);text-align:center;padding-bottom:4px;">${l}</div>`
  ).join("");

  const cardioIconEmoji = type => {
    if(!type) return "🏃";
    const t=type.toLowerCase();
    if(t.includes("cicl")||t.includes("bici")) return "🚴";
    if(t.includes("march")||t.includes("and")) return "🚶";
    return "🏃";
  };

  const dayCells=cells.map(c=>{
    if(!c) return `<div></div>`;
    const opacity=c.isFuture&&!c.plannedGym&&!c.plannedCardio?".25":"1";

    let cellBg="transparent", cellExtra="", numColor=c.isToday?"var(--accent)":"var(--text2)", numWeight="600";
    let showDot=false, dotColor="", dotShadow="";
    let showKm=false, kmColor="", kmVal="";
    let showIco=false, icoEmoji="";

    if(c.hasSess&&c.hasCard){
      // Gym + Cardio real — purple bg
      cellBg="rgba(179,157,219,.12)"; numColor="var(--purple)"; numWeight="700";
      if(c.cardioKm){showKm=true; kmColor="var(--purple)"; kmVal=c.cardioKm%1===0?c.cardioKm+"km":c.cardioKm.toFixed(1)+"km";}
      showIco=true; icoEmoji=cardioIconEmoji(c.cardioType);
    } else if(c.hasSess){
      // Gym — use template color
      const _tc=c.tplColor&&c.tplColor.startsWith("#")?c.tplColor:"#00d4ff";
      const _r=parseInt(_tc.slice(1,3),16),_g=parseInt(_tc.slice(3,5),16),_b=parseInt(_tc.slice(5,7),16);
      cellBg=`rgba(${_r},${_g},${_b},.1)`; numColor=_tc; numWeight="700";
      showDot=true; dotColor=_tc; dotShadow=`0 0 6px rgba(${_r},${_g},${_b},.55)`;
    } else if(c.hasCard){
      // Cardio — green bg, no dot, cardio info in green
      cellBg="rgba(0,229,160,.1)"; numColor="var(--green)"; numWeight="700";
      if(c.cardioKm){showKm=true; kmColor="var(--green)"; kmVal=c.cardioKm%1===0?c.cardioKm+"km":c.cardioKm.toFixed(1)+"km";}
      showIco=true; icoEmoji=cardioIconEmoji(c.cardioType);
    } else if(c.plannedGym&&c.isFuture){
      // Planned gym future — dashed template color border
      const _tc2=c.tplColor&&c.tplColor.startsWith("#")?c.tplColor:"#00d4ff";
      const _r2=parseInt(_tc2.slice(1,3),16),_g2=parseInt(_tc2.slice(3,5),16),_b2=parseInt(_tc2.slice(5,7),16);
      cellExtra=`border:1.5px dashed rgba(${_r2},${_g2},${_b2},.45);`; numColor=`rgba(${_r2},${_g2},${_b2},.7)`; numWeight="600";
    } else if(c.plannedGym&&!c.isFuture&&!c.isToday){
      // Planned gym past missed — solid template color border
      const _tc2=c.tplColor&&c.tplColor.startsWith("#")?c.tplColor:"#00d4ff";
      const _r2=parseInt(_tc2.slice(1,3),16),_g2=parseInt(_tc2.slice(3,5),16),_b2=parseInt(_tc2.slice(5,7),16);
      cellExtra=`border:1.5px solid rgba(${_r2},${_g2},${_b2},.45);`; numColor=`rgba(${_r2},${_g2},${_b2},.55)`; numWeight="600";
    } else if(c.plannedCardio&&c.isFuture){
      // Planned cardio future — dashed green border
      cellExtra=`border:1.5px dashed rgba(0,229,160,.4);`; numColor="rgba(0,229,160,.7)"; numWeight="600";
    } else if(c.plannedCardio&&!c.isFuture&&!c.isToday){
      // Planned cardio past missed — solid green border
      cellExtra=`border:1.5px solid rgba(0,229,160,.4);`; numColor="rgba(0,229,160,.55)"; numWeight="600";
    }

    if(c.isToday){
      if(c.hasSess&&c.hasCard){

  const journalNote="";

  const weekVol=weekSess.reduce((a,s)=>a+volSess(s),0);
  const prevVol=prevSess.reduce((a,s)=>a+volSess(s),0);
  const volDiff=prevVol>0?Math.round((weekVol-prevVol)/prevVol*100):null;

  const lastSess=sessions[0];

  // Closest goal to completion
  const closestGoal=(()=>{

    const lifts=goals.lifts.map(g=>{const pr=prs[g.exId]?.w||0;return{name:g.name+" "+g.target+"kg",val:pr,target:g.target,unit:"kg",color:"var(--accent)"};});
    return [...lifts,running].filter(g=>g.target>0&&g.val<g.target).sort((a,b)=>(b.val/b.target)-(a.val/a.target))[0]||null;
  })();

  // Heatmap: last 28 days
  const actSet=new Set([...sessions.map(x=>x.date),...cardioData.map(x=>x.date)]);
  const heatDays=Array.from({length:28},(_,i)=>{const d=new Date();d.setDate(d.getDate()-(27-i));const ds=isoDate(d);const hasSess=sessions.some(s=>s.date===ds);const hasCard=cardioData.some(c=>c.date===ds);return{ds,hasSess,hasCard,active:actSet.has(ds),dow:(d.getDay()+6)%7};});

      <div style="position:absolute;top:-40px;right:-40px;width:150px;height:150px;border-radius:50%;background:${heroHex}0a;pointer-events:none;"></div>

      <div style="position:relative;max-width:72%;">

    <!-- ── SPARKLINE STATS ── -->
    ${(()=>{
      // Últimas 4 semanas de datos
      const N = 4;
      const weeks = Array.from({length: N}, (_, i) => {
        const mon = new Date(mondayOf());
        mon.setDate(mon.getDate() - (N - 1 - i) * 7);
        const sun = new Date(mon); sun.setDate(mon.getDate() + 6);
        return { mon: isoDate(mon), sun: isoDate(sun) };
      });
      const inWeek = (date, w) => date >= w.mon && date <= w.sun;

      // Volumen por semana (k kg)
      const volByWeek = weeks.map(w =>
        Math.round(sessions.filter(s => inWeek(s.date, w)).reduce((a, s) => a + volSess(s), 0) / 100) / 10
      );
      // Km cardio por semana
      const kmByWeek = weeks.map(w =>
        Math.round(cardioData.filter(c => inWeek(c.date, w)).reduce((a, c) => a + (c.km || 0), 0) * 10) / 10
      );
      // Tiempo activo por semana (minutos)
      const minsByWeek = weeks.map(w => {
        const gym  = sessions.filter(s => inWeek(s.date, w)).reduce((a, s) => a + (s.duration || 0), 0);
        const card = cardioData.filter(c => inWeek(c.date, w)).reduce((a, c) => a + (c.duration || Math.round((c.km || 0) * 5)), 0);
        return gym + card;

        const max = Math.max(...data, 1);
        return data.map((v, i) => {
          const h = Math.max(Math.round(v / max * 100), 4);
          const op = i === data.length - 1 ? 1 : 0.3 + (i / data.length) * 0.45;

      return `<div class="fade-up" style="display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px;">

      const vol=Math.round(volSess(lastSess)/1000*10)/10;
      const prevTplSess=sessions.filter(s=>s.tplId===lastSess.tplId)[1];
      const prevVol2=prevTplSess?Math.round(volSess(prevTplSess)/1000*10)/10:null;
      const delta=prevVol2?Math.round((vol-prevVol2)/prevVol2*100):null;
      const exRows=lastSess.exercises.slice(0,3).map(e=>{

            <span style="font-size:10px;color:var(--text2);">${bestSet?bestSet.w+"kg × "+bestSet.r:"—"}</span>

        </div>`;
      }).filter(Boolean).join(`<div style="height:1px;background:var(--border);margin:0 14px;"></div>`);
      const moreCount=lastSess.exercises.length-3;
      return `<div class="fade-up" style="background:var(--card);border-radius:18px;overflow:hidden;margin-bottom:10px;cursor:pointer;box-shadow:var(--shadow-sm);" onclick="goTab('workouts')">

              <div style="font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${tpl?.name||"Sesión"}</div>
              <div style="font-size:10px;color:var(--text2);margin-top:2px;">${lastSess.duration}min · ${lastSess.exercises.length} ejerc. · ${vol}k kg</div>
            </div>
            ${delta!==null?`<div style="font-size:11px;font-weight:700;color:${delta>=0?"var(--green)":"var(--red)"};flex-shrink:0;">${delta>=0?"↑":"↓"}${Math.abs(delta)}%</div>`:""}
          </div>

        ${exRows?`<div style="border-top:1px solid var(--border);padding:4px 0;">${exRows}${moreCount>0?`<div style="padding:5px 14px;"><span style="font-size:10px;color:var(--text3);">+${moreCount} ejercicio${moreCount!==1?"s":""} más</span></div>`:""}</div>`:""}
      </div>`;

      ${renderCalCard()}

//  START ACTIVE WORKOUT
// ══════════════════════════════════════════════════════════════
function startActiveWorkout(tplId){
  const tpl=templates.find(t=>t.id===tplId);
  if(!tpl) return;
  const prevPRs=allPRs();
  // Build exercise list with last used weight pre-filled
  const exList=tpl.exIds.map(id=>{
    const ex=exercises.find(e=>e.id===id);
    if(!ex) return null;
    const lu=lastUsed(id);
    const suggestW=lu?.suggest||lu?.lastW||0;
    return {
      exId:id,
      name:ex.name,
      sets:[{w:suggestW,r:10,done:false}]
    };
  }).filter(Boolean);
  _awState={
    tplId,
    tplName:tpl.name,
    tplColor:tpl.color,
    exercises:exList,
    elapsed:0,
    expandedEx:0,
    pickerOpen:false,
    pickerFilter:"Todos",
    prevPRs
  };
  if(_awTimer) clearInterval(_awTimer);
  _awTimer=setInterval(()=>{_awState.elapsed++;renderAWScreen();},1000);
  renderAWScreen();
}

function awSaveRpeScroll(ei,si,left){

}
function awRestoreRpeScrolls(){
  // Scroll each reps selector to show selected value
  if(!_awState) return;
  _awState.exercises.forEach((ex,ei)=>{
    ex.sets.forEach((s,si)=>{
      const el=document.getElementById("rpe-"+ei+"-"+si);
      if(!el) return;
      // If user manually scrolled, restore that position
      if(_awState._rpeScroll&&_awState._rpeScroll[ei+"-"+si]!==undefined){
        el.scrollLeft=_awState._rpeScroll[ei+"-"+si];
      } else {
        // Auto-scroll to show selected rep (each button ~34px)
        const targetScroll=Math.max(0,(s.r-1)*34-60);
        el.scrollLeft=targetScroll;
      }
    });
  });
}
function awRemoveEx(i){_awState.exercises.splice(i,1);if(_awState.expandedEx===i)_awState.expandedEx=null;renderAWScreen();}
function awMoveEx(i,dir){
  const arr=_awState.exercises;const ni=i+dir;
  if(ni<0||ni>=arr.length)return;
  [arr[i],arr[ni]]=[arr[ni],arr[i]];
  if(_awState.expandedEx===i)_awState.expandedEx=ni;
  else if(_awState.expandedEx===ni)_awState.expandedEx=i;
  renderAWScreen();
}

function awAdjW(ei, si, delta){
  const s = _awState.exercises[ei].sets[si];

function awTogglePause(){

}
function awFinish(){
  const aw=_awState;
  // Filter to only done sets
  const finishedExercises=aw.exercises.map(ex=>({...ex,sets:ex.sets.filter(s=>s.done)})).filter(ex=>ex.sets.length>0);
  if(finishedExercises.length===0){
    clearInterval(_awTimer);_awTimer=null;_awPaused=false;_awDiscardArmed=false;_awState=null;
    document.getElementById("aw-screen").classList.add("hidden");goTab("overview");return;
  }
  clearInterval(_awTimer);_awTimer=null;
  // Check PRs
  const prevPRs=aw.prevPRs;
  const newPRs=[];
  finishedExercises.forEach(ex=>{const m=maxWset(ex.sets);if(m>0&&(!prevPRs[ex.exId]||m>prevPRs[ex.exId].w))newPRs.push({name:ex.name,w:m});});
  const elapsed=aw.elapsed;
  renderSummaryScreen(aw.tplId,aw.tplName,aw.tplColor,elapsed,finishedExercises,newPRs);
}

  const bestVol=tplSessions.length?Math.max(...tplSessions.map(s=>volSess(s))):null;
  const volDiff=prevVol?((totalVol-prevVol)/prevVol*100).toFixed(0):null;
  const vsBest=bestVol?((totalVol-bestVol)/bestVol*100).toFixed(0):null;

        ${[{l:"Volumen",v:`${totalVol.toLocaleString()}kg`,sub:isNewBest?"🏆 Nuevo récord":(volDiff?`${Number(volDiff)>0?"+":""}${volDiff}% vs anterior`:null),sc:isNewBest?"var(--gold)":(Number(volDiff)>0?"var(--green)":"var(--text3)")},
           {l:"Series",v:totalSets,sub:`${exList.length} ej.`,sc:"var(--text3)"},
           {l:"Tiempo",v:fmtTime(elapsed),sub:null,sc:"var(--text3)"}].map(s=>`
          <div class="card" style="padding:14px 10px;text-align:center;">
            <div style="font-family:'Instrument Serif',serif;font-size:20px;line-height:1;">${s.v}</div>
            <div style="font-size:10px;color:var(--text3);margin-top:4px;">${s.l}</div>
            ${s.sub?`<div style="font-size:9px;color:${s.sc};margin-top:2px;font-weight:600;">${s.sub}</div>`:""}
          </div>`).join("")}
      </div>
      ${newPRs.length>0?`<div style="background:rgba(234,179,8,.08);border:1.5px solid #fde68a;border-radius:14px;padding:14px 16px;margin-bottom:14px;">
        <div style="font-size:11px;font-weight:700;color:#eab308;letter-spacing:.4px;margin-bottom:8px;">🏆 RÉCORDS PERSONALES</div>
        ${newPRs.map(pr=>`<div style="font-size:13px;font-weight:600;color:#ca8a04;margin-bottom:3px;">${pr.name} — <span style="color:#d97706;">${pr.w}kg</span></div>`).join("")}

            ${ex.sets.map((s,i)=>`<span class="pill">${s.w>0?`${s.w}kg×`:"PC×"}${s.r}</span>`).join("")}

function sumSave(){
  const notes=document.getElementById("sum-notes")?.value||"";
  const {tplId,elapsed,exList}=window._sumData;
  const newSess={id:Date.now(),date:today(),tplId,notes,duration:Math.round(elapsed/60),exercises:exList};
  sessions.unshift(newSess);
  save();
  _awState=null;
  document.getElementById("sum-screen").classList.add("hidden");
  goTab("overview");
  showToast(`✅ Sesión guardada · ${Math.round(elapsed/60)}min`);
  // Auto-progression suggestions
  setTimeout(()=>{
    const suggestions=exList.map(ex=>{
      if(!ex.sets.length)return null;
      const workSets=ex.sets.filter(s=>!s.warmup&&s.done!==false&&s.w>0);
      if(!workSets.length)return null;
      const avgRpe=workSets.reduce((a,s)=>a+(s.rpe||8),0)/workSets.length;
      const maxW=Math.max(...workSets.map(s=>s.w));
      if(avgRpe<=7){const e=exercises.find(x=>x.id===ex.exId);return{name:e?.name||"?",maxW,suggest:maxW+2.5,avgRpe};}
      return null;
    }).filter(Boolean);
    if(suggestions.length>0){
      const msg=suggestions.map(s=>`${s.name}: ${s.maxW}→${s.suggest}kg (RPE ${s.avgRpe.toFixed(1)})`).join("\n");
      setTimeout(()=>showToast(`📈 Subir peso sugerido:\n${suggestions.map(s=>s.name+": +2.5kg").join(", ")}`),400);
    }
  },600);
}

      <div style="width:1px;background:var(--border);"></div>
      <div style="flex:1;text-align:center;"><div style="font-family:'Instrument Serif',serif;font-size:18px;color:var(--accent);">${totalVolF>=1000?Math.round(totalVolF/1000)+"k":totalVolF}</div><div style="font-size:9px;color:var(--text3);margin-top:1px;">kg totales</div></div>
      <div style="width:1px;background:var(--border);"></div>
      <div style="flex:1;text-align:center;"><div style="font-family:'Instrument Serif',serif;font-size:18px;color:var(--accent);">${avgDurF}min</div><div style="font-size:9px;color:var(--text3);margin-top:1px;">media</div></div>
      <div style="width:1px;background:var(--border);"></div>
      <div style="flex:1;text-align:center;"><div style="font-family:'Instrument Serif',serif;font-size:18px;color:var(--gold);">${prsInFilter}</div><div style="font-size:9px;color:var(--text3);margin-top:1px;">PRs</div></div>
    </div>
    <div id="hist-results"></div>
  `;
  renderHistResults();

  // Restore search focus only if user was actively typing
  if(window._histSearchActive){
    window._histSearchActive=false;
    requestAnimationFrame(()=>{const el=document.getElementById('hist-search');if(el){el.focus();try{el.setSelectionRange(_savedCursor,_savedCursor);}catch(e){}}});
  }
}

function renderHistResults(){
  const prs=allPRs();
  const _hf=window._histFilter||"Todos";
  const _hd=window._histDateFilter||"all";
  const _hq=(document.getElementById('hist-search')?.value||window._histSearch||"").toLowerCase();
  window._histSearch=_hq;

  const now=new Date();
  const dateThresh={"7d":new Date(now.getFullYear(),now.getMonth(),now.getDate()-7),"30d":new Date(now.getFullYear(),now.getMonth()-1,now.getDate()),"90d":new Date(now.getFullYear(),now.getMonth()-3,now.getDate())};
  let filtered=_hf==="Todos"?[...sessions]:sessions.filter(s=>s.tplId===parseInt(_hf));
  if(_hd!=="all"&&dateThresh[_hd]) filtered=filtered.filter(s=>new Date(s.date+"T12:00:00")>=dateThresh[_hd]);
  if(_hq) filtered=filtered.filter(s=>{
    const t=templates.find(x=>x.id===s.tplId);
    if(t?.name.toLowerCase().includes(_hq)) return true;
    return (s.exercises||[]).some(e=>exercises.find(x=>x.id===e.exId)?.name.toLowerCase().includes(_hq));
  });

  const byMonth={};
  filtered.forEach(s=>{
    const d=new Date(s.date+"T12:00:00");
    const key=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    if(!byMonth[key]) byMonth[key]=[];
    byMonth[key].push(s);
  });
  const monthKeys=Object.keys(byMonth).sort().reverse();
  const MN=["Enero","Febrero","Marzo","Abril","Mayo","Junio","Julio","Agosto","Septiembre","Octubre","Noviembre","Diciembre"];

  const container=document.getElementById('hist-results');
  if(!container) return;
  container.innerHTML=`
    ${filtered.length===0?`<div class="empty-state"><div class="empty-state-icon">🔍</div><div class="empty-state-title">Sin resultados</div><div class="empty-state-sub">No hay sesiones con ese filtro.</div></div>`:""}

    ${monthKeys.map(mk=>{
      const [yr,mo]=mk.split('-');
      const monthSessions=byMonth[mk];
      return `
      <div style="display:flex;align-items:center;gap:8px;margin:16px 0 8px;">
        <span style="font-family:'Instrument Serif',serif;font-size:16px;color:var(--text2);letter-spacing:-.2px;">${MN[parseInt(mo)-1]} ${yr}</span>
        <span style="font-size:10px;color:var(--text3);font-weight:600;">${monthSessions.length} ses.</span>
        <div style="flex:1;height:1px;background:var(--border);"></div>
      </div>
      ${monthSessions.map(s=>{
        const tpl=templates.find(t=>t.id===s.tplId);
        const c=tpl?.color||"var(--accent)";
        const open=expandSess===s.id;
        const sameTplSess=filtered.filter(x=>x.tplId===s.tplId);
        const sIdx=sameTplSess.indexOf(s);
        const prevS=sameTplSess[sIdx+1]||null;
        const vol=volSess(s);
        const prevVol=prevS?volSess(prevS):null;
        const volDiff=prevVol?Math.round((vol-prevVol)/prevVol*100):null;
        const hasPR=(s.exercises||[]).some(e=>{const p=prs[e.exId];return p&&p.date===s.date&&maxWset(e.sets)===p.w&&p.w>0;});
        return `<div style="background:var(--card);border-radius:14px;margin-bottom:6px;overflow:hidden;cursor:pointer;box-shadow:var(--shadow-sm);" onclick="toggleSess(${s.id})">
          <div style="display:flex;align-items:center;">
            <div style="width:4px;background:${c};align-self:stretch;flex-shrink:0;"></div>
            <div style="flex:1;padding:11px 12px;display:flex;align-items:center;gap:10px;">
              <div style="flex:1;min-width:0;">
                <div style="font-size:13px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${tpl?.name||"Sesión"}${hasPR?` <span style="background:var(--goldL);color:var(--gold);border:1px solid rgba(255,213,79,.2);border-radius:5px;padding:1px 5px;font-size:9px;font-weight:700;">🏆 PR</span>`:""}</div>
                <div style="font-size:10px;color:var(--text3);margin-top:2px;">${fdFull(s.date)} · ${s.duration}min · ${s.exercises.length} ejerc.</div>
              </div>
              <div style="text-align:right;flex-shrink:0;">
                <div style="font-family:'Instrument Serif',serif;font-size:17px;color:${c};">${vol>=1000?Math.round(vol/1000)+"k":vol}</div>
                <div style="font-size:8px;color:var(--text3);">kg vol.</div>
                ${volDiff!==null?`<div style="font-size:9px;font-weight:700;color:${volDiff>0?"var(--green)":volDiff<0?"var(--red)":"var(--text3)"};">${volDiff>0?"↑":volDiff<0?"↓":"="} ${Math.abs(volDiff)}%</div>`:""}
              </div>
            </div>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--text3)" stroke-width="2" stroke-linecap="round" style="margin-right:10px;flex-shrink:0;transition:transform .2s;transform:rotate(${open?180:0}deg);"><polyline points="18 15 12 9 6 15"/></svg>
          </div>
          ${open?`<div style="border-top:1px solid var(--border);padding:12px 14px 14px 18px;">
            ${s.notes?`<p style="font-size:11px;color:var(--text2);font-style:italic;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--border);">"${s.notes}"</p>`:""}
            ${(s.exercises||[]).map(ex=>{
              const e=exercises.find(x=>x.id===ex.exId);
              const isPR=prs[ex.exId]?.date===s.date&&maxWset(ex.sets)===prs[ex.exId]?.w&&prs[ex.exId]?.w>0;
              return `<div style="margin-bottom:10px;">
                <div style="display:flex;align-items:center;gap:7px;margin-bottom:5px;">
                  <span style="font-size:12px;font-weight:700;color:var(--text);">${e?.name||"?"}</span>
                  ${isPR?`<span class="badge-pr">🏆 PR</span>`:""}
                </div>
                <div style="display:flex;flex-wrap:wrap;gap:4px;">
                  ${ex.sets.map(x=>`<span class="pill" style="${x.rpe>=9?"background:var(--redL);color:var(--red);border-color:rgba(201,58,58,.15);":""}">${x.w>0?x.w+"kg×":"PC×"}${x.r}${x.rpe?` <span style="opacity:.5">r${x.rpe}</span>`:""}</span>`).join("")}
                </div>
              </div>`;
            }).join("")}
            <div style="display:flex;gap:8px;margin-top:12px;">
              <button onclick="event.stopPropagation();openEditSessSheet(${s.id})" style="flex:2;background:var(--accentL);border:1px solid rgba(0,212,255,.2);color:var(--accent);border-radius:10px;padding:8px;font-size:11px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;display:flex;align-items:center;justify-content:center;gap:5px;">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
                Editar sesión
              </button>
              <button class="btn btn-red" onclick="delSess(${s.id},event)" style="flex:1;">Eliminar</button>
            </div>
          </div>`:""}
        </div>`;
      }).join("")}`;
    }).join("")}
  `;
}

function toggleSess(id){expandSess=expandSess===id?null:id;renderHistResults();}
function delSess(id,e){e.stopPropagation();if(!confirm("¿Eliminar esta sesión?"))return;sessions=sessions.filter(x=>x.id!==id);save();expandSess=null;renderHistory();}

function openEditSessSheet(id){
  const s=sessions.find(x=>x.id===id); if(!s) return;
  const tpl=templates.find(t=>t.id===s.tplId);

  function renderEditSets(ex, ei){
    return ex.sets.map((set,si)=>`
      <div id="edit-set-${ei}-${si}" style="display:grid;grid-template-columns:24px 1fr 1fr 28px;gap:6px;align-items:center;margin-bottom:6px;">
        <div style="font-size:11px;font-weight:700;color:var(--text3);text-align:center;">${si+1}</div>
        <input type="number" style="background:var(--bg);border:1.5px solid var(--border2);border-radius:8px;padding:7px 6px;font-size:14px;font-weight:700;font-family:'DM Sans',sans-serif;color:var(--text);text-align:center;width:100%;outline:none;" value="${set.w||''}" placeholder="—" oninput="_editSess.exercises[${ei}].sets[${si}].w=parseFloat(this.value)||0" onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='var(--border2)'">
        <input type="number" style="background:var(--bg);border:1.5px solid var(--border2);border-radius:8px;padding:7px 6px;font-size:14px;font-weight:700;font-family:'DM Sans',sans-serif;color:var(--text);text-align:center;width:100%;outline:none;" value="${set.r||''}" placeholder="—" oninput="_editSess.exercises[${ei}].sets[${si}].r=parseInt(this.value)||0" onfocus="this.style.borderColor='var(--accent)'" onblur="this.style.borderColor='var(--border2)'">
        <button onclick="editSessDelSet(${ei},${si})" style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:16px;padding:0;line-height:1;">×</button>
      </div>`).join("");
  }

  function renderEditExercises(){
    return (_editSess.exercises||[]).map((ex,ei)=>{
      const e=exercises.find(x=>x.id===ex.exId);
      return `<div style="background:var(--card2);border-radius:12px;padding:12px;margin-bottom:8px;border:1px solid var(--border);">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;">
          <span style="font-size:13px;font-weight:700;color:var(--text);">${e?.name||"Ejercicio"}</span>
          <button onclick="editSessDelEx(${ei})" style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:11px;font-weight:700;font-family:'DM Sans',sans-serif;">× Quitar</button>
        </div>
        <div style="display:grid;grid-template-columns:24px 1fr 1fr 28px;gap:6px;margin-bottom:6px;padding:0 2px;">
          <div></div>
          <div style="font-size:9px;font-weight:700;color:var(--text3);text-align:center;text-transform:uppercase;letter-spacing:.4px;">kg</div>
          <div style="font-size:9px;font-weight:700;color:var(--text3);text-align:center;text-transform:uppercase;letter-spacing:.4px;">reps</div>
          <div></div>
        </div>
        <div id="edit-sets-${ei}">${renderEditSets(ex,ei)}</div>
        <button onclick="editSessAddSet(${ei})" style="width:100%;background:transparent;border:1.5px dashed var(--border2);color:var(--text3);border-radius:8px;padding:6px;font-size:11px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;margin-top:4px;">+ Añadir serie</button>
      </div>`;
    }).join("");
  }

  // Deep copy session for editing
  window._editSess={...s, exercises:s.exercises.map(ex=>({...ex,sets:ex.sets.map(st=>({...st}))}))};

  openSheet(`
    <div class="stitle">Editar sesión</div>
    <div class="ssub">Modifica cualquier dato de esta sesión</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;">
      <div><label class="flabel">Fecha</label><input type="date" id="edit-date" class="inp" value="${s.date}"></div>
      <div><label class="flabel">Duración (min)</label><input type="number" id="edit-dur" class="inp" value="${s.duration}"></div>
    </div>
    <div class="fgroup"><label class="flabel">Plantilla</label>
      <select id="edit-tpl" class="inp">
        ${templates.map(t=>`<option value="${t.id}" ${t.id===s.tplId?"selected":""}>${t.name}</option>`).join("")}
      </select>
    </div>
    <div class="fgroup"><label class="flabel">Notas</label><textarea id="edit-notes" class="inp" style="min-height:64px;resize:none;line-height:1.5;">${s.notes||""}</textarea></div>
    <hr style="border:none;border-top:1px solid var(--border);margin:14px 0;">
    <span class="slabel">Ejercicios</span>
    <div id="edit-exercises">${renderEditExercises()}</div>
    <button onclick="openEditAddExPicker()" style="width:100%;background:var(--accentL);border:1px solid rgba(0,212,255,.2);color:var(--accent);border-radius:10px;padding:10px;font-size:12px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;margin-bottom:14px;display:flex;align-items:center;justify-content:center;gap:6px;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      Añadir ejercicio
    </button>
    <div style="display:flex;gap:8px;">
      <button class="btn btn-ghost" style="flex:1;justify-content:center;" onclick="closeSheet()">Cancelar</button>
      <button class="btn btn-p" style="flex:2;justify-content:center;" onclick="saveEditSess(${id})">Guardar cambios</button>
    </div>
  `);

  // Store render functions for re-render
  window._reRenderEditEx=()=>{document.getElementById('edit-exercises').innerHTML=renderEditExercises();};
}

function editSessDelSet(ei,si){
  window._editSess.exercises[ei].sets.splice(si,1);
  window._reRenderEditEx&&window._reRenderEditEx();
}
function editSessAddSet(ei){
  const sets=window._editSess.exercises[ei].sets;
  const last=sets[sets.length-1]||{w:0,r:10};
  sets.push({w:last.w,r:last.r,done:true});
  window._reRenderEditEx&&window._reRenderEditEx();
}
function editSessDelEx(ei){
  window._editSess.exercises.splice(ei,1);
  window._reRenderEditEx&&window._reRenderEditEx();
}
function openEditAddExPicker(){
  const filter=window._editExFilter||"Todos";
  const q=(window._editExQ||"").toLowerCase();
  const lib=(filter==="Todos"?exercises:exercises.filter(e=>e.muscle===filter)).filter(e=>!q||e.name.toLowerCase().includes(q));
  document.getElementById('edit-exercises').insertAdjacentHTML('afterend',`
    <div id="edit-ex-picker" style="background:var(--card2);border:1px solid var(--border2);border-radius:14px;padding:12px;margin-bottom:12px;">
      <input id="edit-ex-q" class="inp" placeholder="Buscar ejercicio…" value="${window._editExQ||''}" oninput="window._editExQ=this.value;openEditAddExPicker()" style="margin-bottom:8px;">
      <div class="chips" style="margin-bottom:8px;">${["Todos",...MUSCLES].map(m=>`<button class="chip ${filter===m?"on":""}" onclick="window._editExFilter='${m}';openEditAddExPicker()">${m}</button>`).join("")}</div>
      <div style="max-height:180px;overflow-y:auto;display:flex;flex-direction:column;gap:4px;">
        ${lib.map(ex=>`<div onclick="editSessAddEx(${ex.id})" style="padding:8px 10px;background:var(--card);border-radius:8px;cursor:pointer;font-size:12px;font-weight:600;">${ex.name} <span style="color:var(--text3);font-weight:400;">${ex.muscle}</span></div>`).join("")}
      </div>
      <button onclick="document.getElementById('edit-ex-picker').remove()" style="width:100%;background:none;border:none;color:var(--text3);cursor:pointer;font-size:12px;margin-top:8px;font-family:'DM Sans',sans-serif;">Cerrar</button>
    </div>
  `);
  const existing=document.getElementById('edit-ex-picker');
  if(existing.previousElementSibling?.id==='edit-ex-picker') existing.previousElementSibling.remove();
}
function editSessAddEx(exId){
  window._editSess.exercises.push({exId,sets:[{w:0,r:10,done:true}]});
  document.getElementById('edit-ex-picker')?.remove();
  window._reRenderEditEx&&window._reRenderEditEx();
}
function saveEditSess(id){
  const i=sessions.findIndex(x=>x.id===id); if(i<0) return;
  const es=window._editSess;
  sessions[i]={
    ...sessions[i],
    date:document.getElementById('edit-date')?.value||sessions[i].date,
    duration:parseInt(document.getElementById('edit-dur')?.value)||sessions[i].duration,
    tplId:parseInt(document.getElementById('edit-tpl')?.value)||sessions[i].tplId,
    notes:document.getElementById('edit-notes')?.value||"",
    exercises:es.exercises,
  };
  save();closeSheet();renderHistory();showToast("✅ Sesión actualizada");
}


function renderTemplates(){
  document.getElementById("wk-action").innerHTML=`<button class="btn btn-p" onclick="openNewTplOrVariantSheet()">Nueva plantilla</button>`;

  const _mf = window._tplMuscleFilter||"Todas";
  const allTplMuscles = [...new Set(templates.flatMap(t=>t.exIds.map(id=>exercises.find(e=>e.id===id)?.muscle).filter(Boolean)))];
  const filteredTpls = _mf==="Todas" ? templates : templates.filter(t=>
    t.exIds.some(id=>exercises.find(e=>e.id===id)?.muscle===_mf)
  );
  const groupedIds = new Set(filteredTpls.filter(t=>t.groupId).map(t=>t.groupId));
  const standalones = filteredTpls.filter(t=>!t.groupId);

  // Helper: is this template planned for today?
  const todayDow = EN_DAYS[new Date().getDay()===0?6:new Date().getDay()-1];
  const isTodayTpl = (tplId) => planData[todayDow]?.tplId===tplId;
  const isGroupToday = (gid) => {
    const variants = templates.filter(t=>t.groupId===gid);
    return variants.some(t=>isTodayTpl(t.id));
  };

  // Helper: context badge
  const contextBadge = (daysAgo, color, isToday) => {
    if(isToday) return `<div style="position:absolute;top:10px;right:12px;background:rgba(0,229,160,.15);border:1px solid rgba(0,229,160,.3);color:var(--green);border-radius:20px;padding:2px 8px;font-size:8px;font-weight:800;letter-spacing:.3px;">HOY</div>`;
    if(daysAgo!==null && daysAgo>9) return `<div style="position:absolute;top:10px;right:12px;background:rgba(255,166,60,.12);border:1px solid rgba(255,166,60,.25);color:var(--orange);border-radius:20px;padding:2px 8px;font-size:8px;font-weight:800;display:flex;align-items:center;gap:3px;"><span style="width:4px;height:4px;border-radius:50%;background:var(--orange);display:inline-block;"></span>${daysAgo}d</div>`;
    return "";
  };

  const muscleChips = `<div class="chips" style="margin-bottom:10px;">
    <button class="chip ${_mf==="Todas"?"on":""}" onclick="window._tplMuscleFilter='Todas';renderTemplates()">Todas</button>
    ${allTplMuscles.map(m=>`<button class="chip ${_mf===m?"on":""}" onclick="window._tplMuscleFilter='${m}';renderTemplates()" style="display:inline-flex;align-items:center;gap:4px;"><span style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${MUSCLE_C[m]||"var(--accent)"};"></span>${m}</button>`).join("")}
  </div>`;

  // ── GROUP CARDS — plegadas ──
  const groupCards = [...groupedIds].map(gid=>{
    const group = tplGroups.find(g=>g.id===gid);
    const variants = filteredTpls.filter(t=>t.groupId===gid);
    const next = nextVariant(gid);
    const groupMuscles = [...new Set(variants.flatMap(t=>t.exIds.map(id=>exercises.find(e=>e.id===id)?.muscle).filter(Boolean)))];
    const groupColor = variants[0]?.color||"var(--accent)";
    const primaryMuscleColor = MUSCLE_C[groupMuscles[0]]||groupColor;
    const isToday = isGroupToday(gid);

    // Last session across all variants
    const allVariantIds = new Set(variants.map(t=>t.id));
    const lastGroupSess = sessions.find(s=>allVariantIds.has(s.tplId));
    const lastDaysAgo = lastGroupSess ? Math.round((new Date()-new Date(lastGroupSess.date+"T12:00:00"))/(1000*60*60*24)) : null;

    // Variant pills
    const varPills = variants.map(t=>{
      const isNext = t.id===next?.id;
      const lastD = sessions.find(s=>s.tplId===t.id);
      const d = lastD ? Math.round((new Date()-new Date(lastD.date+"T12:00:00"))/(1000*60*60*24)) : null;
      if(isNext) return `<div style="display:inline-flex;align-items:center;gap:3px;background:${ha(groupColor,.14)};border:1px solid ${ha(groupColor,.3)};border-radius:6px;padding:2px 7px;"><span style="font-size:9px;font-weight:800;color:${groupColor};">${t.variant||"·"}</span><span style="font-size:8px;color:${groupColor};font-weight:600;">↑ toca</span></div>`;
      return `<div style="display:inline-flex;align-items:center;gap:3px;background:rgba(255,209,102,.08);border:1px solid rgba(255,209,102,.15);border-radius:6px;padding:2px 7px;"><span style="font-size:9px;font-weight:700;color:var(--gold);opacity:.7;">${t.variant||"·"}</span><span style="font-size:8px;color:var(--text3);">${d!==null?d+"d":"—"}</span></div>`;
    }).join("");

    return `<div style="background:var(--card);border-radius:14px;margin-bottom:8px;overflow:hidden;box-shadow:0 4px 18px ${ha(groupColor,.16)},0 2px 8px rgba(0,0,0,.25);position:relative;cursor:pointer;" onclick="openGroupDetailSheet(${gid})">
      <div style="position:absolute;left:0;top:0;bottom:0;width:3px;background:${groupColor};border-radius:14px 0 0 14px;"></div>
      ${contextBadge(lastDaysAgo, groupColor, isToday)}

          ${bodyFigure(groupMuscles,42)}
        </div>
        <div style="flex:1;min-width:0;${isToday||lastDaysAgo>9?"margin-right:52px;":""}">
          <div style="font-size:13px;font-weight:700;color:var(--text);">${group?.name||variants[0]?.name||"Grupo"}</div>

        </div>

  // ── STANDALONE CARDS — plegadas ──
  const standaloneCards = standalones.map(t=>{
    const tplMuscles=[...new Set(t.exIds.map(id=>exercises.find(e=>e.id===id)?.muscle).filter(Boolean))];
    const lastTplSess=sessions.filter(s=>s.tplId===t.id)[0];
    const daysAgo = lastTplSess ? Math.round((new Date()-new Date(lastTplSess.date+"T12:00:00"))/(1000*60*60*24)) : null;
    const primaryColor = MUSCLE_C[tplMuscles[0]]||t.color;
    const isToday = isTodayTpl(t.id);

    return `<div style="background:var(--card);border-radius:14px;margin-bottom:8px;overflow:hidden;box-shadow:0 4px 18px ${ha(t.color,.14)},0 2px 8px rgba(0,0,0,.25);position:relative;cursor:pointer;" onclick="openEditTplSheet(${t.id})">

          <div style="font-size:13px;font-weight:700;color:var(--text);">${t.name}</div>
          <div style="display:flex;gap:3px;margin-top:4px;flex-wrap:wrap;">
            ${tplMuscles.slice(0,3).map(m=>`<span style="font-size:8px;font-weight:700;padding:1px 6px;border-radius:8px;background:${ha(MUSCLE_C[m]||t.color,.1)};color:${MUSCLE_C[m]||t.color};">${m}</span>`).join("")}
          </div>
          <div style="display:flex;align-items:center;gap:4px;margin-top:5px;">
            ${daysAgo!==null?`<span style="width:5px;height:5px;border-radius:50%;background:${primaryColor};display:inline-block;flex-shrink:0;"></span><span style="font-size:10px;color:${primaryColor};font-weight:600;">Hace ${daysAgo}d</span>`:`<span style="font-size:10px;color:var(--text3);">Primera vez</span>`}
          </div>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;flex-shrink:0;align-items:flex-end;">
          <button onclick="event.stopPropagation();startActiveWorkout(${t.id})" style="background:${t.color};border:none;color:#0a1a26;border-radius:9px;padding:7px 13px;font-size:11px;font-weight:800;cursor:pointer;font-family:'DM Sans',sans-serif;display:flex;align-items:center;gap:4px;box-shadow:0 3px 12px ${ha(t.color,.4)};">
            <svg width="10" height="10" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"/></svg>
          </button>
          <button onclick="event.stopPropagation();addVariantToStandalone(${t.id})" style="background:transparent;border:1px dashed ${ha(t.color,.35)};color:${t.color};border-radius:7px;padding:3px 8px;font-size:9px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;">+ variante</button>
        </div>
      </div>
    </div>`;
  }).join("");

  const emptyState = filteredTpls.length===0
    ? `<div style="display:flex;flex-direction:column;align-items:center;justify-content:center;padding:52px 24px;text-align:center;"><div style="font-size:44px;margin-bottom:14px;">📋</div><div style="font-family:'Instrument Serif',serif;font-size:20px;color:var(--text2);margin-bottom:6px;">Sin plantillas</div><div style="font-size:12px;color:var(--text3);">Crea una plantilla para organizar tus sesiones.</div></div>`
    : "";

  document.getElementById("wk-body").innerHTML = muscleChips + groupCards + standaloneCards + emptyState;
}

function exerciseIcon(name, color, size=38){
  const key = EX_ICON_MAP[name];
  const fn  = key ? EX_ICONS[key] : null;
  const c   = color||"#4dd9e8";
  const svg = fn ? fn(c) : `<svg viewBox="0 0 48 48" fill="none"><ellipse cx="24" cy="24" rx="10" ry="12" fill="${ha(c,.15)}" stroke="${c}" stroke-width="2"/><circle cx="24" cy="18" r="3" fill="${c}"/><line x1="24" y1="21" x2="24" y2="30" stroke="${c}" stroke-width="3" stroke-linecap="round"/><line x1="24" y1="28" x2="18" y2="36" stroke="${c}" stroke-width="2.5" stroke-linecap="round"/><line x1="24" y1="28" x2="30" y2="36" stroke="${c}" stroke-width="2.5" stroke-linecap="round"/></svg>`;
  return `<div style="width:${size}px;height:${size}px;border-radius:${Math.round(size*.28)}px;background:${ha(c,.08)};border:1px solid ${ha(c,.18)};display:flex;align-items:center;justify-content:center;flex-shrink:0;">${svg}</div>`;
}

function renderExercises(){
  document.getElementById("wk-action").innerHTML=`<button class="btn btn-p" onclick="openAddExSheet()">Nuevo ejercicio</button>`;
  const _q=(document.getElementById('ex-search')?.value||window._exSearch||'').toLowerCase();
  window._exSearch=_q;
  if(!window._exCollapsed) window._exCollapsed=Object.fromEntries(MUSCLES.map(m=>[m,true]));
  const list=(exFilter==="Todos"?exercises:exercises.filter(e=>e.muscle===exFilter)).filter(e=>!_q||e.name.toLowerCase().includes(_q)||e.equip.toLowerCase().includes(_q));
  const byMuscle={};list.forEach(e=>{if(!byMuscle[e.muscle])byMuscle[e.muscle]=[];byMuscle[e.muscle].push(e);});
  const prs=allPRs();
  const forceOpen=!!(_q||exFilter!=="Todos");

  // Only rebuild wk-body if it doesn't already have the search input
  const existingInput=document.getElementById('ex-search');
  if(!existingInput){
    document.getElementById("wk-body").innerHTML=`
      <input type="text" id="ex-search" class="inp" placeholder="Buscar ejercicio…" style="margin-bottom:10px;" oninput="window._exSearch=this.value;renderExResults()" value="${typeof window._exSearch!=='undefined'?window._exSearch:''}">
      <div id="ex-chips" class="chips" style="margin-bottom:14px;"></div>
      <div id="ex-results"></div>
    `;
    document.getElementById('ex-search').addEventListener('input',function(){
      window._exSearch=this.value;
      window._exSearchActive=true;
      renderExResults();
    });
  }

  // Always update chips
  document.getElementById('ex-chips').innerHTML=[...(["Todos",...MUSCLES])].map(m=>`<button class="chip ${exFilter===m?"on":""}" onclick="exFilter='${m}';renderExResults()">${m}</button>`).join("");

  renderExResults();
}

function renderExResults(){
  const searchEl=document.getElementById('ex-search');
  const _q=(searchEl?.value||window._exSearch||'').toLowerCase();
  const cursorPos=searchEl?.selectionStart??null;
  window._exSearch=_q;
  if(!window._exCollapsed) window._exCollapsed=Object.fromEntries(MUSCLES.map(m=>[m,true]));
  const list=(exFilter==="Todos"?exercises:exercises.filter(e=>e.muscle===exFilter)).filter(e=>!_q||e.name.toLowerCase().includes(_q)||e.equip.toLowerCase().includes(_q));
  const byMuscle={};list.forEach(e=>{if(!byMuscle[e.muscle])byMuscle[e.muscle]=[];byMuscle[e.muscle].push(e);});
  const prs=allPRs();
  const forceOpen=!!(_q||exFilter!=="Todos");
  const container=document.getElementById('ex-results');
  if(!container) return;
  container.innerHTML=`
    ${Object.entries(byMuscle).map(([m,exs])=>{
      const mc=MUSCLE_C[m]||"#4dd9e8";
      const isOpen=forceOpen||!window._exCollapsed[m];
      return `
      <div style="margin-bottom:8px;">
        <div onclick="if(!${forceOpen}){window._exCollapsed['${m}']=!window._exCollapsed['${m}'];renderExResults();}" style="display:flex;align-items:center;gap:8px;padding:10px 13px;background:var(--card);border-radius:${isOpen?"14px 14px 0 0":"14px"};cursor:pointer;${isOpen?"border-bottom:1px solid var(--border);":""}box-shadow:var(--shadow-sm);">
          ${muscleIcon(m,mc,34)}
