function addVariantToGroup(gid){
  const group = tplGroups.find(g=>g.id===gid); if(!group) return;
  const existing = templates.filter(t=>t.groupId===gid);
  const nextLetter = String.fromCharCode(65+existing.length);
  const baseColor = existing[0]?.color || TPL_CLR[0];
  _newTpl = {id:null, name:group.name, color:baseColor, exIds:[], groupId:gid, variant:nextLetter};
  window._tplMF="Todos";
  renderTplSheet();
}

function addVariantToStandalone(tplId){
  const base = templates.find(t=>t.id===tplId); if(!base) return;
  // Create a new group from this template, mark existing as variant A
  const newGrp = {id:Date.now(), name:base.name};
  tplGroups.push(newGrp);
  const idx = templates.findIndex(t=>t.id===tplId);
  templates[idx] = {...templates[idx], groupId:newGrp.id, variant:"A"};
  save();
  // Open editor pre-filled for variant B
  _newTpl = {id:null, name:base.name, color:base.color, exIds:[], groupId:newGrp.id, variant:"B"};
  window._tplMF="Todos";
  renderTplSheet();
}

function saveTpl(){
  if(!_newTpl.name.trim()&&!document.getElementById("tpl-name")?.value.trim()) return;
  _newTpl.name=document.getElementById("tpl-name")?.value||_newTpl.name;
  _newTpl.variant=document.getElementById("tpl-variant")?.value||"";
  const grpVal=document.getElementById("tpl-group")?.value;
  if(grpVal==="__new__"){
    const newGrp={id:Date.now(),name:_newTpl.name};
    tplGroups.push(newGrp);
    _newTpl.groupId=newGrp.id;
  } else {
    _newTpl.groupId=grpVal?parseInt(grpVal):null;
  }
  if(_newTpl.id){const i=templates.findIndex(t=>t.id===_newTpl.id);templates[i]={..._newTpl};}
  else{templates.push({..._newTpl,id:Date.now()});}
  save();closeSheet();renderTemplates();
}
function delTpl(id){if(!confirm("¿Eliminar esta plantilla?"))return;templates=templates.filter(t=>t.id!==id);save();closeSheet();renderTemplates();}

function renderStats(){
  document.getElementById("wk-action").innerHTML="";

  // ── raw data ──────────────────────────────────────────────────
  // Weekly volume — all weeks
  const wkVolAll=(()=>{const w={};sessions.forEach(s=>{const k=isoDate(mondayOf(new Date(s.date+"T12:00:00")));w[k]=(w[k]||0)+volSess(s);});return Object.entries(w).sort((a,b)=>a[0]>b[0]?1:-1);})();
  const prs=allPRs();
  const recentPRs=Object.values(prs).filter(p=>p.w>0&&p.date>=ago(14)).length;
  const lastWeekVol=(()=>{const k=isoDate(mondayOf());return wkVolAll.find(([w])=>w===k)?.[1]||0;})();
  const prevWeekVol=(()=>{const d=new Date(mondayOf());d.setDate(d.getDate()-7);const k=isoDate(d);return wkVolAll.find(([w])=>w===k)?.[1]||0;})();
  const progressPct=prevWeekVol>0?Math.round((lastWeekVol-prevWeekVol)/prevWeekVol*100):null;
  const totalSessions=sessions.length;
  const totalVol=Math.round(sessions.reduce((a,s)=>a+volSess(s),0)/1000);
  const avgDur=sessions.length?Math.round(sessions.reduce((a,s)=>a+s.duration,0)/sessions.length):0;

  // Streak
  const streak=(()=>{
    const dates=[...new Set([...sessions.map(s=>s.date),...cardioData.map(c=>c.date)])].sort().reverse();
    if(!dates.length) return{cur:0,best:0,bestEnd:''};
    let cur=0,best=0,bestEnd='',prev=null;
    let tmpLen=0,tmpEnd='';
    dates.forEach(d=>{
      if(!prev){tmpLen=1;tmpEnd=d;}
      else{
        const diff=Math.round((new Date(prev+"T12:00:00")-new Date(d+"T12:00:00"))/(1000*60*60*24));
        if(diff<=1) tmpLen++;
        else{if(tmpLen>best){best=tmpLen;bestEnd=tmpEnd;}tmpLen=1;tmpEnd=d;}
      }
      prev=d;
    });
    if(tmpLen>best){best=tmpLen;bestEnd=tmpEnd;}
    // current streak: from today backwards
    let curLen=0; const today2=isoDate(new Date());
    for(let i=0;i<dates.length;i++){
      const d=dates[i];
      if(i===0){const diff=Math.round((new Date(today2+"T12:00:00")-new Date(d+"T12:00:00"))/(1000*60*60*24));if(diff>1)break;}
      else{const diff=Math.round((new Date(dates[i-1]+"T12:00:00")-new Date(d+"T12:00:00"))/(1000*60*60*24));if(diff>1)break;}
      curLen++;
    }
    return{cur:curLen,best,bestEnd};
  })();

  // Heatmap data
  const actDates=new Set([...sessions.map(s=>s.date),...cardioData.map(c=>c.date)]);
  const heatData={};sessions.forEach(s=>{heatData[s.date]=(heatData[s.date]||0)+volSess(s);});cardioData.forEach(c=>{if(!heatData[c.date])heatData[c.date]=0;else if(heatData[c.date]===0)heatData[c.date]=1;});
  const heatMax=Math.max(...Object.values(heatData),1);

  // Comparative
  const cmpData=templates.map(t=>{const recent=sessions.filter(s=>s.tplId===t.id).slice(0,2);if(recent.length<2)return null;const v1=volSess(recent[0]),v2=volSess(recent[1]);const diff=((v1-v2)/v2*100).toFixed(0);return{name:t.name,color:t.color,v1,v2,diff};}).filter(Boolean);

  // Muscle card data helpers
  const LAST_N_WEEKS=8;
  function weeksBack(n){const d=new Date(mondayOf());d.setDate(d.getDate()-n*7);return d;}
  // For each muscle: times trained this week, last 8w avg, total avg
  function muscleFreqData(period){
    const isMuscleSess=(s,m)=>s.exercises?.some(e=>exercises.find(x=>x.id===e.exId)?.muscle===m);
    if(period==='sem'){
      const wStart=mondayOf();
      return MUSCLES.map(m=>sessions.filter(s=>new Date(s.date+"T12:00:00")>=wStart&&isMuscleSess(s,m)).length);
    }
    if(period==='8sem'){
      const wStart=weeksBack(LAST_N_WEEKS);
      return MUSCLES.map(m=>{
        const cnt=sessions.filter(s=>new Date(s.date+"T12:00:00")>=wStart&&isMuscleSess(s,m)).length;
        return Math.round((cnt/LAST_N_WEEKS)*10)/10;
      });
    }
    // total
    if(!sessions.length) return MUSCLES.map(()=>0);
    const firstDate=new Date(sessions[sessions.length-1].date+"T12:00:00");
    const totalWeeks=Math.max(1,Math.ceil((new Date()-firstDate)/(1000*60*60*24*7)));
    return MUSCLES.map(m=>{
      const cnt=sessions.filter(s=>isMuscleSess(s,m)).length;
      return Math.round((cnt/totalWeeks)*10)/10;
    });
  }
  function muscleSetsData(period){
    function setsForMuscle(sessList,m){
      return sessList.reduce((a,s)=>a+(s.exercises||[]).filter(e=>exercises.find(x=>x.id===e.exId)?.muscle===m).reduce((b,e)=>b+e.sets.length,0),0);
    }
    if(period==='sem'){
      const wStart=mondayOf();
      const sess=sessions.filter(s=>new Date(s.date+"T12:00:00")>=wStart);
      return MUSCLES.map(m=>setsForMuscle(sess,m));
    }
    if(period==='8sem'){
      const wStart=weeksBack(LAST_N_WEEKS);
      const sess=sessions.filter(s=>new Date(s.date+"T12:00:00")>=wStart);
      return MUSCLES.map(m=>Math.round((setsForMuscle(sess,m)/LAST_N_WEEKS)*10)/10);
    }
    if(!sessions.length) return MUSCLES.map(()=>0);
    const firstDate=new Date(sessions[sessions.length-1].date+"T12:00:00");
    const totalWeeks=Math.max(1,Math.ceil((new Date()-firstDate)/(1000*60*60*24*7)));
    return MUSCLES.map(m=>Math.round((setsForMuscle(sessions,m)/totalWeeks)*10)/10);
  }
  function muscleVolData(period){
    function volForMuscle(sessList,m){
      return sessList.reduce((a,s)=>a+(s.exercises||[]).filter(e=>exercises.find(x=>x.id===e.exId)?.muscle===m).reduce((b,e)=>b+e.sets.reduce((c,st)=>c+(st.w||0)*st.r,0),0),0);
    }
    if(period==='sem'){const wStart=mondayOf();const sess=sessions.filter(s=>new Date(s.date+"T12:00:00")>=wStart);return MUSCLES.slice(0,7).map(m=>volForMuscle(sess,m));}
    if(period==='8sem'){const wStart=weeksBack(LAST_N_WEEKS);const sess=sessions.filter(s=>new Date(s.date+"T12:00:00")>=wStart);return MUSCLES.slice(0,7).map(m=>Math.round(volForMuscle(sess,m)/LAST_N_WEEKS));}
    return MUSCLES.slice(0,7).map(m=>volForMuscle(sessions,m));
  }
  function splitVolData(period){
    function volForTpl(sessList,tplId){return sessList.filter(s=>s.tplId===tplId).reduce((a,s)=>a+volSess(s),0);}
    const tpls=templates.filter(t=>sessions.some(s=>s.tplId===t.id));
    if(period==='sem'){const wStart=mondayOf();const sess=sessions.filter(s=>new Date(s.date+"T12:00:00")>=wStart);return tpls.map(t=>({name:t.name,color:t.color,v:volForTpl(sess,t.id)}));}
    if(period==='8sem'){const wStart=weeksBack(LAST_N_WEEKS);const sess=sessions.filter(s=>new Date(s.date+"T12:00:00")>=wStart);return tpls.map(t=>({name:t.name,color:t.color,v:Math.round(volForTpl(sess,t.id)/LAST_N_WEEKS)}));}
    return tpls.map(t=>({name:t.name,color:t.color,v:volForTpl(sessions,t.id)}));
  }

  // Balance
  const balAct=muscleActivity();
  const pushSets=(balAct['Pecho']||0)+(balAct['Hombros']||0)+(balAct['Tríceps']||0);
  const pullSets=(balAct['Espalda']||0)+(balAct['Bíceps']||0);
  const legFront=(balAct['Piernas']||0);
  const legBack=(balAct['Glúteos']||0);
  const pushPullRatio=pullSets>0?Math.round((pushSets/pullSets)*10)/10:null;
  const legRatio=legBack>0?Math.round((legFront/legBack)*10)/10:null;

  // Exercise history for sparkline
  const exWithHistory=exercises.filter(ex=>exHistory(ex.id).length>0).sort((a,b)=>exHistory(b.id).length-exHistory(a.id).length);

  // ── Este mes ──────────────────────────────────────────────────
  const now=new Date();
  const monthStart=new Date(now.getFullYear(),now.getMonth(),1);
  const monthSess=sessions.filter(s=>new Date(s.date+"T12:00:00")>=monthStart);

  const monthAvgDur=monthSess.length?Math.round(monthSess.reduce((a,s)=>a+s.duration,0)/monthSess.length):0;

  // Store computed fns in window for MC card interactivity
  window._stats={muscleFreqData,muscleSetsData,muscleVolData,splitVolData};
  window._statsState={metric:'freq',freqSub:'times',group:'muscle',period:'8sem'};

    <div style="display:flex;align-items:center;gap:8px;padding:9px 12px;border-radius:10px;margin-bottom:12px;background:${legRatio>1.8?"var(--orangeL)":"var(--greenL)"};border:1px solid ${legRatio>1.8?"rgba(255,166,60,.2)":"rgba(0,229,160,.15)"};">
      <span style="font-size:16px;">${legRatio>1.8?"⚠️":"✅"}</span>
      <div>
        <div style="font-size:12px;font-weight:700;color:${legRatio>1.8?"var(--orange)":"var(--green)"};">${legRatio>1.8?"Posterior infraentrenado":"Piernas equilibradas"}</div>
        <div style="font-size:10px;color:var(--text2);">Ratio cuád/glúteos esta semana: ${legRatio}× (ideal ~1×)</div>
      </div>
    </div>`:""}
    ${pushPullRatio===null&&legRatio===null?`<div style="text-align:center;padding:16px;color:var(--text3);font-size:12px;">Entrena esta semana para ver el balance</div>`:""}
    <div style="padding:10px 12px;background:var(--bg2);border-radius:10px;border:1px solid var(--border);">
      <div style="font-size:10px;color:var(--text3);font-weight:700;letter-spacing:.4px;text-transform:uppercase;margin-bottom:8px;">Ratios clave (sets esta semana)</div>
      <div style="display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--border);">
        <span style="font-size:11px;color:var(--text2);">Empuje / Tirón</span>
        <span style="font-size:11px;font-weight:700;color:${pushPullRatio===null?"var(--text3)":pushPullRatio>1.5?"var(--orange)":"var(--green)"};">${pushPullRatio!==null?pushPullRatio+"×":"—"} <span style="font-weight:400;color:var(--text3);">(ideal ~1×)</span></span>
      </div>
      <div style="display:flex;justify-content:space-between;padding:5px 0;">
        <span style="font-size:11px;color:var(--text2);">Cuádriceps / Glúteos</span>
        <span style="font-size:11px;font-weight:700;color:${legRatio===null?"var(--text3)":legRatio>1.8?"var(--orange)":"var(--green)"};">${legRatio!==null?legRatio+"×":"—"} <span style="font-weight:400;color:var(--text3);">(ideal ~1×)</span></span>
      </div>
    </div>
  </div>

  <!-- 6. FRECUENCIA / VOLUMEN UNIFICADO -->
  <div style="font-size:9px;font-weight:700;color:var(--text3);letter-spacing:.8px;text-transform:uppercase;margin-bottom:8px;padding-left:2px;">Frecuencia</div>
  <div class="card cp" style="margin-bottom:10px;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;">
      <span class="slabel" style="margin-bottom:0;" id="mc-title">Frecuencia muscular</span>
    </div>
    <div style="margin-bottom:8px;">
      <div style="display:flex;background:var(--bg2);border-radius:8px;padding:2px;gap:2px;" id="mc-tog-metric">
        <button style="flex:1;border:none;background:var(--card2);color:var(--text);font-size:10px;font-weight:700;font-family:'DM Sans',sans-serif;padding:5px 8px;border-radius:6px;cursor:pointer;" onclick="statsSetMetric('freq',this)">Frecuencia</button>
        <button style="flex:1;border:none;background:transparent;color:var(--text3);font-size:10px;font-weight:700;font-family:'DM Sans',sans-serif;padding:5px 8px;border-radius:6px;cursor:pointer;" onclick="statsSetMetric('vol',this)">Volumen</button>
      </div>
    </div>
    <div style="margin-bottom:8px;" id="mc-tog-freqsub-wrap">
      <div style="display:flex;background:var(--bg2);border-radius:8px;padding:2px;gap:2px;" id="mc-tog-freqsub">
        <button style="flex:1;border:none;background:var(--card2);color:var(--text);font-size:10px;font-weight:700;font-family:'DM Sans',sans-serif;padding:5px 8px;border-radius:6px;cursor:pointer;" onclick="statsSetFreqSub('times',this)">Veces entrenado</button>
        <button style="flex:1;border:none;background:transparent;color:var(--text3);font-size:10px;font-weight:700;font-family:'DM Sans',sans-serif;padding:5px 8px;border-radius:6px;cursor:pointer;" onclick="statsSetFreqSub('sets',this)">Series</button>
      </div>
    </div>
    <div style="margin-bottom:8px;display:none;" id="mc-tog-group-wrap">
      <div style="display:flex;background:var(--bg2);border-radius:8px;padding:2px;gap:2px;" id="mc-tog-group">
        <button style="flex:1;border:none;background:var(--card2);color:var(--text);font-size:10px;font-weight:700;font-family:'DM Sans',sans-serif;padding:5px 8px;border-radius:6px;cursor:pointer;" onclick="statsSetGroup('muscle',this)">Músculo</button>
        <button style="flex:1;border:none;background:transparent;color:var(--text3);font-size:10px;font-weight:700;font-family:'DM Sans',sans-serif;padding:5px 8px;border-radius:6px;cursor:pointer;" onclick="statsSetGroup('split',this)">Split</button>
      </div>
    </div>
    <div style="margin-bottom:12px;">
      <div style="display:flex;background:var(--bg2);border-radius:8px;padding:2px;gap:2px;" id="mc-tog-period">
        <button style="flex:1;border:none;background:transparent;color:var(--text3);font-size:10px;font-weight:700;font-family:'DM Sans',sans-serif;padding:5px 8px;border-radius:6px;cursor:pointer;" onclick="statsSetPeriod('sem',this)">Sem.</button>
        <button style="flex:1;border:none;background:var(--card2);color:var(--text);font-size:10px;font-weight:700;font-family:'DM Sans',sans-serif;padding:5px 8px;border-radius:6px;cursor:pointer;" onclick="statsSetPeriod('8sem',this)">8 sem.</button>
        <button style="flex:1;border:none;background:transparent;color:var(--text3);font-size:10px;font-weight:700;font-family:'DM Sans',sans-serif;padding:5px 8px;border-radius:6px;cursor:pointer;" onclick="statsSetPeriod('total',this)">Total</button>
      </div>
    </div>
    <div id="mc-hint" style="font-size:9px;color:var(--text3);margin-bottom:10px;">veces/semana · media últimas 8 semanas</div>
    <div id="mc-bars"></div>
    <div id="mc-legend" style="padding:8px 10px;background:var(--bg2);border-radius:8px;border:1px solid var(--border);display:flex;gap:14px;margin-top:10px;">
      <span style="font-size:9px;color:var(--green);font-weight:700;">✓ ≥2×/sem</span>
      <span style="font-size:9px;color:var(--orange);font-weight:700;">↓ 1–2×/sem</span>
      <span style="font-size:9px;color:var(--red);font-weight:700;">! &lt;1×/sem</span>
    </div>
  </div>

  <!-- 7. EVOLUCIÓN DE EJERCICIO -->
  <div class="card cp" style="margin-bottom:10px;">
    <span class="slabel">Evolución de ejercicio</span>
    <select class="inp" id="stats-ex-sel" style="margin-bottom:12px;" onchange="statsRenderExChart()">
      ${exWithHistory.map(ex=>`<option value="${ex.id}">${ex.name}</option>`).join("")}
      ${exWithHistory.length===0?`<option disabled>Sin historial todavía</option>`:""}
    </select>
    <div style="position:relative;" id="stats-ex-wrap">
      <div id="stats-ex-tip" style="position:absolute;background:var(--card2);border:1px solid var(--border2);border-radius:8px;padding:5px 10px;font-size:11px;font-weight:700;color:var(--text);pointer-events:none;z-index:20;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.5);transform:translateX(-50%);display:none;top:-34px;"></div>
      <div id="stats-ex-svg-wrap" style="width:100%;"></div>
    </div>
    <div id="stats-ex-dates" style="display:flex;justify-content:space-between;margin-top:4px;margin-bottom:10px;"></div>
    <div id="stats-ex-summary"></div>
  </div>

  <!-- 8. COMPARATIVA -->
  <div class="card cp" style="margin-bottom:10px;">
    <span class="slabel">Comparativa · última vs anterior</span>
    ${cmpData.length?`<div style="max-height:220px;overflow-y:auto;">${cmpData.map((d,i)=>`<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:${i<cmpData.length-1?"1px solid var(--border)":"none"};"><div style="flex:1;min-width:0;"><div style="font-size:12px;font-weight:700;color:${d.color};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${d.name}</div><div style="font-size:10px;color:var(--text2);margin-top:2px;">${d.v2.toLocaleString()} → ${d.v1.toLocaleString()} kg</div></div><div style="font-size:13px;font-weight:700;color:${Number(d.diff)>0?"var(--green)":Number(d.diff)<0?"var(--red)":"var(--text2)"};margin-left:10px;flex-shrink:0;">${Number(d.diff)>0?"+":""}${d.diff}%</div></div>`).join("")}</div>`:`<div style="text-align:center;padding:20px;color:var(--text3);font-size:12px;">Necesitas 2+ sesiones por plantilla</div>`}
  </div>

  <!-- 9. PRs -->
  <div class="card cp" style="margin-bottom:10px;">
    <span class="slabel">Récords personales</span>
    ${(()=>{
      const rows=Object.entries(prs).map(([exId,pr])=>{const ex=exercises.find(e=>e.id==exId);if(!ex||!pr.w)return"";return`<div style="display:flex;justify-content:space-between;align-items:center;padding:9px 0;border-bottom:1px solid var(--border);"><div style="flex:1;"><div style="font-size:12px;font-weight:700;">${ex.name}</div><div style="font-size:10px;color:var(--text2);margin-top:1px;">${fdFull(pr.date)}</div></div><span class="badge-pr">🏆 ${pr.w}kg</span></div>`;}).filter(Boolean);
      if(!rows.length) return`<div style="text-align:center;padding:20px;color:var(--text3);font-size:12px;">Sin PRs todavía</div>`;
      const maxH=5*50;
      return`<div style="overflow-y:auto;max-height:${maxH}px;-webkit-overflow-scrolling:touch;">${rows.join("")}</div>`;
    })()}
  </div>
  `;

  // ── post-render: heatmap ──
  (()=>{
    const grid=document.getElementById('stats-hm-grid');
    const mths=document.getElementById('stats-hm-months');
    if(!grid)return;
    const today=new Date();
    // Find first session date
    const allDts=[...sessions.map(s=>s.date),...cardioData.map(c=>c.date)].sort();
    const firstDt=allDts.length?new Date(allDts[0]+"T12:00:00"):new Date(today);
    // Align to Monday (getDay: 0=Sun,1=Mon,...,6=Sat → offset: Sun=6,Mon=0,Tue=1...)
    const dow1=firstDt.getDay(); // 0=Sun
    const offset1=dow1===0?6:dow1-1;
    firstDt.setDate(firstDt.getDate()-offset1);
    const totalWeeks=Math.ceil((today-firstDt)/(7*24*3600*1000))+1;
    const colors=['var(--border2)','rgba(0,212,255,.25)','rgba(0,212,255,.55)','var(--accent)'];
    const mn=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
    let lastM=-1; const cur=new Date(firstDt);
    for(let w=0;w<totalWeeks;w++){
      const col=document.createElement('div');col.style.cssText='display:flex;flex-direction:column;gap:3px;';
      const mo=cur.getMonth();
      for(let d=0;d<7;d++){
        const dayDate=new Date(firstDt);dayDate.setDate(firstDt.getDate()+w*7+d);
        const cell=document.createElement('div');cell.style.cssText='width:13px;height:13px;border-radius:3px;';
        const key=dayDate.getFullYear()+'-'+String(dayDate.getMonth()+1).padStart(2,'0')+'-'+String(dayDate.getDate()).padStart(2,'0');
        const vol=heatData[key]||0;
        const pct=vol/heatMax;
        const ci=vol===0?0:pct<0.33?1:pct<0.66?2:3;
        cell.style.background=colors[ci];
        if(dayDate>today)cell.style.opacity='.15';
        if(vol>0){cell.style.cursor='pointer';cell.addEventListener('click',((c,k,v)=>()=>showHeatTooltip(c,k,Math.round(v/1000*10)/10+'k','kg'))(cell,key,vol));}
        col.appendChild(cell);
      }
      cur.setDate(cur.getDate()+7);
      grid.appendChild(col);
      const lbl=document.createElement('div');
      if(mo!==lastM){lbl.style.cssText='font-size:8px;color:var(--text3);font-weight:600;width:52px;';lbl.textContent=mn[mo];lastM=mo;}
      else{lbl.style.width='16px';}
      mths.appendChild(lbl);
    }
    document.getElementById('stats-heatmap-wrap').scrollLeft=9999;
  })();

  // ── post-render: volume chart ──
  (()=>{
    const chart=document.getElementById('stats-vol-chart');
    if(!chart||!wkVolAll.length)return;
    const max=Math.max(...wkVolAll.map(e=>e[1]),1);
    wkVolAll.forEach(([wk,vol],i)=>{
      const isL=i===wkVolAll.length-1;
      const h=Math.max(Math.round((vol/max)*58),4);
      const op=Math.max(0.1,(i/wkVolAll.length)*0.8);
      const bg=isL?'var(--accent)':`rgba(0,212,255,${op.toFixed(2)})`;
      const d=new Date(wk+"T12:00:00");
      const col=document.createElement('div');
      col.style.cssText='display:flex;flex-direction:column;align-items:center;gap:3px;width:36px;flex-shrink:0;';
      col.innerHTML=`<div style="font-size:8px;font-weight:700;color:${isL?'var(--accent)':'var(--text3)'};">${Math.round(vol/1000)}k</div><div style="width:100%;height:${h}px;background:${bg};border-radius:4px 4px 0 0;${isL?'box-shadow:0 0 10px rgba(0,212,255,.4);':''}"></div><div style="font-size:7px;color:${isL?'var(--accent)':'var(--text3)'};font-weight:${isL?'700':'400'};white-space:nowrap;">${d.getDate()}/${d.getMonth()+1}</div>`;
      chart.appendChild(col);
    });
    document.getElementById('stats-vol-scroll').scrollLeft=9999;
  })();

  // ── post-render: MC card ──
  statsRenderMC();

  // ── post-render: exercise chart ──
  if(exWithHistory.length) statsRenderExChart();
}

// ── Stats MC helpers ─────────────────────────────────────────────
function _statsToggle(containerId, btn){
  document.getElementById(containerId).querySelectorAll('button').forEach(b=>{
    b.style.background='transparent'; b.style.color='var(--text3)';
  });
  btn.style.background='var(--card2)'; btn.style.color='var(--text)';
}
function statsSetMetric(v,btn){
  window._statsState.metric=v;
  if(v==='freq') window._statsState.group='muscle';
  _statsToggle('mc-tog-metric',btn);
  document.getElementById('mc-tog-freqsub-wrap').style.display=v==='freq'?'block':'none';
  document.getElementById('mc-tog-group-wrap').style.display=v==='vol'?'block':'none';
  statsRenderMC();
}
function statsSetFreqSub(v,btn){window._statsState.freqSub=v;_statsToggle('mc-tog-freqsub',btn);statsRenderMC();}
function statsSetGroup(v,btn){window._statsState.group=v;_statsToggle('mc-tog-group',btn);statsRenderMC();}
function statsSetPeriod(v,btn){window._statsState.period=v;_statsToggle('mc-tog-period',btn);statsRenderMC();}

function statsRenderMC(){
  const st=window._statsState;
  const fn=window._stats;
  if(!st||!fn) return;
  const{metric,freqSub,group,period}=st;
  const isFreq=metric==='freq';
  const isSets=freqSub==='sets';
  const isSplit=!isFreq&&group==='split';
  const isSem=period==='sem';

  // Title
  const titles={'freq-times':'Frecuencia muscular','freq-sets':'Series por músculo','vol-muscle':'Volumen por músculo','vol-split':'Volumen por split'};
  document.getElementById('mc-title').textContent=titles[isFreq?'freq-'+freqSub:'vol-'+group]||'';

  // Hints
  const hints={
    'freq-times-sem':'veces entrenado · esta semana',
    'freq-times-8sem':'veces/semana · media 8 semanas',
    'freq-times-total':'veces/semana · media histórica',
    'freq-sets-sem':'series totales · esta semana',
    'freq-sets-8sem':'series/semana · media 8 semanas',
    'freq-sets-total':'series/semana · media histórica',
    'vol-muscle-sem':'kg levantados por músculo · esta semana',
    'vol-muscle-8sem':'kg promedio por músculo · 8 semanas',
    'vol-muscle-total':'kg acumulados por músculo · total',
    'vol-split-sem':'kg levantados por split · esta semana',
    'vol-split-8sem':'kg promedio por split · 8 semanas',
    'vol-split-total':'kg acumulados por split · total',
  };
  document.getElementById('mc-hint').textContent=hints[metric+(isFreq?'-'+freqSub:'')+'-'+(isSplit?'split':'muscle')+'-'+period]||'';

  // Legend
  document.getElementById('mc-legend').style.display=isFreq&&!isSets&&!isSem?'flex':'none';

  // Data
  let vals,items;
  if(isFreq){
    vals=isSets?fn.muscleSetsData(period):fn.muscleFreqData(period);
    items=MUSCLES.map((n,i)=>({n,c:MUSCLE_C[n]||'var(--accent)',v:vals[i]}));
  } else if(isSplit){
    const sd=fn.splitVolData(period);
    items=sd.map(x=>({n:x.name,c:x.color,v:x.v}));
    vals=items.map(x=>x.v);
  } else {
    vals=fn.muscleVolData(period);
    items=MUSCLES.slice(0,7).map((n,i)=>({n,c:MUSCLE_C[n]||'var(--accent)',v:vals[i]}));
  }
  const max=Math.max(...items.map(x=>x.v),1);

  function fmtV(v){
    if(isFreq&&!isSets) return isSem?(v>0?'1×':'0×'):v.toFixed(1)+'×';
    if(isFreq&&isSets) return isSem?v+'s':v.toFixed(1)+'s';
    return v>=1000?Math.round(v/1000)+'k kg':v+' kg';
  }

  let html='';
  if(isFreq&&!isSets&&isSem) html='<div style="font-size:9px;color:var(--orange);margin-bottom:8px;">⚠ Dato poco representativo esta semana</div>';

  items.forEach((m,i)=>{
    const pct=Math.round((m.v/max)*100);
    let badge='';
    if(isFreq&&!isSets&&!isSem){
      if(m.v>=2)      badge=`<span style="background:rgba(0,229,160,.1);color:var(--green);border:1px solid rgba(0,229,160,.2);border-radius:6px;padding:1px 6px;font-size:9px;font-weight:700;flex-shrink:0;margin-left:2px;">✓</span>`;
      else if(m.v>=1) badge=`<span style="background:rgba(255,166,60,.1);color:var(--orange);border:1px solid rgba(255,166,60,.2);border-radius:6px;padding:1px 6px;font-size:9px;font-weight:700;flex-shrink:0;margin-left:2px;">↓</span>`;
      else            badge=`<span style="background:rgba(255,107,107,.1);color:var(--red);border:1px solid rgba(255,107,107,.2);border-radius:6px;padding:1px 6px;font-size:9px;font-weight:700;flex-shrink:0;margin-left:2px;">!</span>`;
    }
    html+=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:${i===items.length-1?'0':'8px'};">
      <div style="width:10px;height:10px;border-radius:3px;background:${m.c};flex-shrink:0;"></div>
      <span style="font-size:11px;font-weight:600;color:var(--text);${isSplit?'flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-right:8px;':'width:66px;flex-shrink:0;'}">${m.n}</span>
      <div style="flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden;${isSplit?'min-width:50px;':''}"><div style="height:100%;width:${pct}%;background:${m.c};border-radius:3px;"></div></div>
      <span style="font-size:10px;font-weight:700;color:${m.c};min-width:38px;text-align:right;flex-shrink:0;">${fmtV(m.v)}</span>
      ${badge}
    </div>`;
  });
  document.getElementById('mc-bars').innerHTML=html;
}

// ── Stats exercise sparkline ─────────────────────────────────────
function statsRenderExChart(){
  const sel=document.getElementById('stats-ex-sel');
  if(!sel)return;
  const exId=parseInt(sel.value);
  const hist=exHistory(exId);
  const wrap=document.getElementById('stats-ex-svg-wrap');
  const datesEl=document.getElementById('stats-ex-dates');
  const sumEl=document.getElementById('stats-ex-summary');
  const tip=document.getElementById('stats-ex-tip');
  if(!wrap||!hist.length){if(wrap)wrap.innerHTML='<div style="text-align:center;padding:20px;color:var(--text3);font-size:12px;">Sin historial</div>';return;}

  const ex=exercises.find(e=>e.id===exId);
  const mc=MUSCLE_C[ex?.muscle]||'var(--accent)';
  const prs=allPRs(); const pr=prs[exId];

  // Build points from history (maxW per session)
  const pts=hist.map(h=>({date:h.date,w:h.maxW})).filter(p=>p.w>0);
  if(!pts.length){wrap.innerHTML='<div style="text-align:center;padding:20px;color:var(--text3);font-size:12px;">Sin datos de peso</div>';return;}

  const W=340,H=68,PAD=10;
  const minW=Math.min(...pts.map(p=>p.w));
  const maxW=Math.max(...pts.map(p=>p.w));
  const range=maxW-minW||1;

  function px(i){return PAD+(i/(pts.length-1||1))*(W-PAD*2);}
  function py(w){return H-PAD-((w-minW)/range)*(H-PAD*2);}

  const coords=pts.map((p,i)=>({x:px(i),y:py(p.w),...p}));
  const linePts=coords.map(c=>`${c.x},${c.y}`).join(' ');
  const areaD=`M${coords[0].x},${coords[0].y} ${coords.slice(1).map(c=>`L${c.x},${c.y}`).join(' ')} L${coords[coords.length-1].x},${H} L${coords[0].x},${H} Z`;

  let circles=coords.map((c,i)=>{
    const isPR=pr&&c.w===pr.w&&c.date===pr.date;
    if(isPR) return `<circle class="stats-ex-pt" cx="${c.x}" cy="${c.y}" r="6" fill="#b8860b" stroke="#ffd166" stroke-width="2" data-date="${fd(c.date)}" data-val="${c.w}kg 🏆"/>`;
    return `<circle class="stats-ex-pt" cx="${c.x}" cy="${c.y}" r="3" fill="${mc}" data-date="${fd(c.date)}" data-val="${c.w}kg"/>`;
  }).join('');

  wrap.innerHTML=`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="width:100%;height:${H}px;display:block;overflow:visible;">
    <defs><linearGradient id="exg2" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${mc}" stop-opacity=".25"/><stop offset="100%" stop-color="${mc}" stop-opacity="0"/></linearGradient></defs>
    <path d="${areaD}" fill="url(#exg2)"/>
    <polyline points="${linePts}" fill="none" stroke="${mc}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    ${circles}
  </svg>`;

  datesEl.innerHTML=pts.length>1?`<span style="font-size:9px;color:var(--text3);">${fd(pts[0].date)}</span><span style="font-size:9px;color:var(--text3);">${fd(pts[pts.length-1].date)}</span>`:'';

    <div style="text-align:center;"><div style="font-size:11px;font-weight:700;color:${diff>=0?'var(--green)':'var(--red)'};">${diff>=0?'+':''}${diff} kg</div><div style="font-size:9px;color:var(--text3);">progreso</div></div>

  </div>`;

  // Tooltip
  const svgEl=wrap.querySelector('svg');

    function show(){
      pt.setAttribute('r',hoverR);
      tipEl.innerHTML=`<span style="color:var(--text3);font-weight:400;">${pt.getAttribute('data-date')}</span> · <span style="color:${isPR?'var(--gold)':mc};">${pt.getAttribute('data-val')}</span>`;

      tipEl.style.left=(cx/W*100)+'%';
      tipEl.style.display='block';

  });

}

function renderCardioStats(){
  const el=document.getElementById('cardio-tab-content');
  if(!el){console.log('el is null');return;}

  // ── computed data ──
  const totalKm=Math.round(cardioData.reduce((a,c)=>a+c.km,0)*10)/10;
  const totalTime=cardioData.reduce((a,c)=>a+c.time,0);
  const totalCal=cardioData.reduce((a,c)=>a+(c.cal||0),0);
  const totalSess=cardioData.length;
  const avgBpm=cardioData.filter(c=>c.bpm>0).length?Math.round(cardioData.filter(c=>c.bpm>0).reduce((a,c)=>a+c.bpm,0)/cardioData.filter(c=>c.bpm>0).length):null;

  // Streak
  const cardDates=[...new Set(cardioData.map(c=>c.date))].sort().reverse();
  let streak=0;
  const today=isoDate(new Date());
  for(let i=0;i<cardDates.length;i++){
    if(i===0){const diff=Math.round((new Date(today+"T12:00:00")-new Date(cardDates[0]+"T12:00:00"))/(86400000));if(diff>1)break;}
    else{const diff=Math.round((new Date(cardDates[i-1]+"T12:00:00")-new Date(cardDates[i]+"T12:00:00"))/(86400000));if(diff>1)break;}
    streak++;
  }
  let bestStreak=0,tmpS=0,prevD=null;
  [...cardDates].reverse().forEach(d=>{
    if(!prevD){tmpS=1;}
    else{const diff=Math.round((new Date(d+"T12:00:00")-new Date(prevD+"T12:00:00"))/(86400000));tmpS=diff<=1?tmpS+1:1;}
    if(tmpS>bestStreak)bestStreak=tmpS;
    prevD=d;
  });

  // Weekly km
  const wkKm={};cardioData.forEach(c=>{const k=isoDate(mondayOf(new Date(c.date+"T12:00:00")));wkKm[k]=(wkKm[k]||0)+c.km;});
  const wkArr=Object.entries(wkKm).sort((a,b)=>a[0]>b[0]?1:-1);
  const maxWkKm=Math.max(...wkArr.map(e=>e[1]),1);

  // Monthly by type
  const monthData={};
  cardioData.forEach(c=>{
    const d=new Date(c.date+"T12:00:00");
    const k=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`;
    if(!monthData[k]) monthData[k]={Carrera:0,Ciclismo:0,Caminata:0};
    monthData[k][c.type]=(monthData[k][c.type]||0)+c.km;
  });
  const monthArr=Object.entries(monthData).sort((a,b)=>a[0]>b[0]?1:-1);
  const maxMonthKm=Math.max(...monthArr.map(([,v])=>v.Carrera+v.Ciclismo+v.Caminata),1);

  // By type totals
  const byType={Carrera:{km:0,sess:0,time:0},Ciclismo:{km:0,sess:0,time:0},Caminata:{km:0,sess:0,time:0}};
  cardioData.forEach(c=>{if(byType[c.type]){byType[c.type].km+=c.km;byType[c.type].sess++;byType[c.type].time+=c.time;}});
  const maxTypeKm=Math.max(...Object.values(byType).map(v=>v.km),1);

  // Pace progression (carrera only, sorted by date)
  const runSess=cardioData.filter(c=>c.type==='Carrera'&&c.km>0&&c.time>0).sort((a,b)=>a.date>b.date?1:-1);
  const paceArr=runSess.map(c=>({date:c.date,pace:c.time/c.km})); // min/km
  const bestPace=paceArr.length?Math.min(...paceArr.map(p=>p.pace)):null;
  const firstPace=paceArr.length?paceArr[0].pace:null;
  function fmtPace(minkm){const m=Math.floor(minkm);const s=Math.round((minkm-m)*60);return`${m}'${String(s).padStart(2,'0')}"`;} 

  // Bike speed progression
  const bikeSess=cardioData.filter(c=>c.type==='Ciclismo'&&c.km>0&&c.time>0).sort((a,b)=>a.date>b.date?1:-1);
  const speedArr=bikeSess.map(c=>({date:c.date,speed:c.km/(c.time/60)}));
  const bestSpeed=speedArr.length?Math.max(...speedArr.map(s=>s.speed)):null;

  // Weekday distribution
  const wdCount=[0,0,0,0,0,0,0];
  cardioData.forEach(c=>{const dow=(new Date(c.date+"T12:00:00").getDay()+6)%7;wdCount[dow]++;});
  const maxWd=Math.max(...wdCount,1);

  // Consistency last 8 weeks
  const consData=[];
  for(let i=7;i>=0;i--){
    const wStart=new Date(mondayOf());wStart.setDate(wStart.getDate()-i*7);
    const wEnd=new Date(wStart);wEnd.setDate(wEnd.getDate()+7);
    consData.push(cardioData.filter(c=>{const d=new Date(c.date+"T12:00:00");return d>=wStart&&d<wEnd;}).length);
  }
  const maxCons=Math.max(...consData,1);

  // PRs
  const prDistRun=cardioData.filter(c=>c.type==='Carrera').sort((a,b)=>b.km-a.km)[0]||null;
  const prDistBike=cardioData.filter(c=>c.type==='Ciclismo').sort((a,b)=>b.km-a.km)[0]||null;
  const prPace=(()=>{if(!paceArr.length||bestPace===null)return null;const idx=paceArr.findIndex(p=>p.pace===bestPace);return idx>=0?runSess[idx]||null:null;})();

  // Zonas FC
  const bpmSess=cardioData.filter(c=>c.bpm>0);
  const hasFC=bpmSess.length>0;
  const fcMax=195; // estimated
  const fcZones=[0,0,0,0,0];
  bpmSess.forEach(c=>{
    const pct=c.bpm/fcMax;
    if(pct<0.6) fcZones[0]++;

    else if(pct<0.8) fcZones[2]++;

  const fcTotal=fcZones.reduce((a,b)=>a+b,1);

  // Goal progress

      </div>

  const monthHTML=(()=>{ return monthArr.length>0?`<div class="card cp" style="margin-bottom:10px;">

      ${[['Z1 · Rec.','#60a5fa',0],['Z2 · Base','var(--green)',1],['Z3 · Aerób.','var(--gold)',2],['Z4 · Umbral','var(--orange)',3],['Z5 · MáxVO2','var(--red)',4]].map(([lbl,col,idx])=>{const pct=Math.round(fcZones[idx]/fcTotal*100);return`<div style="display:flex;align-items:center;gap:8px;margin-bottom:${idx===4?0:8}px;"><div style="width:10px;height:10px;border-radius:3px;background:${col};flex-shrink:0;"></div><span style="font-size:11px;font-weight:600;color:var(--text);width:80px;flex-shrink:0;">${lbl}</span><div style="flex:1;height:6px;background:var(--border);border-radius:3px;overflow:hidden;"><div style="height:100%;width:${pct}%;background:${col};border-radius:3px;"></div></div><span style="font-size:10px;font-weight:700;color:${col};min-width:30px;text-align:right;">${pct}%</span></div>`;}).join('')}

function showHeatTooltip(cell, dateStr, value, unit){
  // Remove any existing tooltip
  const prev=document.getElementById('heat-tooltip');if(prev)prev.remove();
  if(!value){return;}
  const DOW=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
  const MN=['Ene','Feb','Mar','Abr','May','Jun','Jul','Ago','Sep','Oct','Nov','Dic'];
  const d=new Date(dateStr+'T12:00:00');
  const label=DOW[d.getDay()]+' '+d.getDate()+' '+MN[d.getMonth()];
  const tip=document.createElement('div');
  tip.id='heat-tooltip';
  tip.style.cssText='position:fixed;z-index:999;background:var(--card2);border:1px solid var(--border2);border-radius:8px;padding:6px 10px;font-size:11px;font-weight:700;color:var(--text);box-shadow:0 4px 16px rgba(0,0,0,.4);pointer-events:none;white-space:nowrap;';
  tip.innerHTML=`<div style="font-size:9px;color:var(--text3);margin-bottom:2px;">${label}</div>${value} ${unit}`;
  document.body.appendChild(tip);
  const r=cell.getBoundingClientRect();
  const tw=tip.offsetWidth,th=tip.offsetHeight;
  let top=r.top-th-6,left=r.left+(r.width/2)-(tw/2);
  if(top<8)top=r.bottom+6;
  if(left<8)left=8;
  if(left+tw>window.innerWidth-8)left=window.innerWidth-8-tw;
  tip.style.top=top+'px';tip.style.left=left+'px';
  setTimeout(()=>{document.addEventListener('click',()=>tip.remove(),{once:true});},0);
}

function cActTog(mode, btn){
  const tog=document.getElementById('cact-tog');if(!tog)return;
  tog.querySelectorAll('button').forEach(b=>{b.style.background='transparent';b.style.color='var(--text3)';});
  btn.style.background='var(--card2)';btn.style.color='var(--text)';
  const rows=document.querySelectorAll('.cact-row');
  const vals=Array.from(rows).map(r=>mode==='km'?parseFloat(r.dataset.run):mode==='sess'?parseInt(r.dataset.sess):parseInt(r.dataset.time));
  const maxV=Math.max(...vals,1);
  rows.forEach((r,i)=>{
    const v=vals[i];const pct=Math.round((v/maxV)*100);
    const c=r.dataset.color;
    r.querySelector('.cact-fill').style.width=pct+'%';
    const lbl=mode==='km'?Math.round(v*10)/10+' km':mode==='sess'?v+' ses.':v+' min';
    r.querySelector('.cact-count').textContent=lbl;
  });
}

function renderCPaceChart(mode){
  const wrap=document.getElementById('cpace-chart-wrap');
  const datesEl=document.getElementById('cpace-dates');
  const sumEl=document.getElementById('cpace-summary');
  if(!wrap||!datesEl||!sumEl) return;
  const isRun=mode==='run';
  const color=isRun?'var(--green)':'#38bdf8';
  const colorHex=isRun?'#00e5a0':'#38bdf8';
  const pts=isRun?
    cardioData.filter(c=>c.type==='Carrera'&&c.km>0&&c.time>0).sort((a,b)=>a.date>b.date?1:-1).map(c=>({date:c.date,v:c.time/c.km})):
    cardioData.filter(c=>c.type==='Ciclismo'&&c.km>0&&c.time>0).sort((a,b)=>a.date>b.date?1:-1).map(c=>({date:c.date,v:c.km/(c.time/60)}));
  if(pts.length<2){wrap.innerHTML=`<div style="text-align:center;padding:20px;color:var(--text3);font-size:12px;">Necesitas más sesiones de ${isRun?'carrera':'ciclismo'}</div>`;return;}
  const W=Math.max(300,pts.length*50);const H=64;const PAD=10;
  const vals=pts.map(p=>p.v);
  const minV=Math.min(...vals);const maxV=Math.max(...vals);const range=maxV-minV||1;
  function px(i){return PAD+(i/(pts.length-1))*(W-PAD*2);}
  // For running: lower is better (invert Y). For cycling: higher is better
  function py(v){return isRun?PAD+((v-minV)/range)*(H-PAD*2):H-PAD-((v-minV)/range)*(H-PAD*2);}
  const coords=pts.map((p,i)=>({x:px(i),y:py(p.v),...p}));
  const linePts=coords.map(c=>`${c.x},${c.y}`).join(' ');
  const first=coords[0];const last=coords[coords.length-1];
  const areaD=`M${first.x},${first.y} ${coords.slice(1).map(c=>`L${c.x},${c.y}`).join(' ')} L${last.x},${H} L${first.x},${H} Z`;
  const circles=coords.map((c,i)=>{
    const isBest=isRun?c.v===minV:c.v===maxV;
    return isBest?`<circle class="cpace-pt" cx="${c.x}" cy="${c.y}" r="6" fill="#b8860b" stroke="#ffd166" stroke-width="2" data-date="${fd(c.date)}" data-val="${isRun?Math.floor(c.v)+"'"+(Math.round((c.v%1)*60)+'').padStart(2,'0')+'"':Math.round(c.v*10)/10+' km/h'}"/>`:
    `<circle class="cpace-pt" cx="${c.x}" cy="${c.y}" r="3" fill="${color}" data-date="${fd(c.date)}" data-val="${isRun?Math.floor(c.v)+"'"+(Math.round((c.v%1)*60)+'').padStart(2,'0')+'"':Math.round(c.v*10)/10+' km/h'}"/>`;
  }).join('');
  wrap.style.minWidth=W+'px';
  wrap.innerHTML=`
    <div id="cpace-tip" style="position:absolute;background:var(--card2);border:1px solid var(--border2);border-radius:8px;padding:5px 10px;font-size:11px;font-weight:700;color:var(--text);pointer-events:none;z-index:20;white-space:nowrap;box-shadow:0 4px 14px rgba(0,0,0,.5);transform:translateX(-50%);display:none;top:-34px;"></div>
    <svg viewBox="0 0 ${W} ${H}" style="width:${W}px;height:${H}px;display:block;overflow:visible;">
      <defs><linearGradient id="cpg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${colorHex}" stop-opacity=".2"/><stop offset="100%" stop-color="${colorHex}" stop-opacity="0"/></linearGradient></defs>
      <path d="${areaD}" fill="url(#cpg)"/>
      <polyline points="${linePts}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      ${circles}
    </svg>`;
  if(datesEl&&pts.length) datesEl.innerHTML=`<span style="font-size:9px;color:var(--text3);">${fd(pts[0].date)}</span><span style="font-size:9px;color:var(--text3);">${fd(pts[pts.length-1].date)}</span>`;
  const startV=pts[0].v;const bestV=isRun?Math.min(...vals):Math.max(...vals);
  const diff=isRun?Math.round((startV-bestV)*60):Math.round((bestV-startV)*10)/10;
  const diffLbl=isRun?diff+'s/km':'+'+diff+' km/h';
  if(sumEl) sumEl.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;padding:10px 12px;background:var(--bg2);border-radius:10px;border:1px solid var(--border);margin-top:4px;">
    <div><div style="font-size:9px;color:var(--text3);margin-bottom:2px;">Inicio</div><div style="font-size:14px;font-weight:700;">${isRun?Math.floor(startV)+"'"+(Math.round((startV%1)*60)+'').padStart(2,'0')+"''/km":Math.round(startV*10)/10+' km/h'}</div></div>
    <div style="text-align:center;"><div style="font-size:11px;font-weight:700;color:var(--green);">${isRun?'-':'+'}${diffLbl}</div><div style="font-size:9px;color:var(--text3);">mejora</div></div>
    <div style="text-align:right;"><div style="font-size:9px;color:var(--gold);margin-bottom:2px;">🏆 Mejor</div><div style="font-size:14px;font-weight:700;color:var(--gold);">${isRun?Math.floor(bestV)+"'"+(Math.round((bestV%1)*60)+'').padStart(2,'0')+"''/km":Math.round(bestV*10)/10+' km/h'}</div></div>
  </div>`;
  // Scroll to end
  requestAnimationFrame(()=>{const s=document.getElementById('cpace-scroll');if(s)s.scrollLeft=9999;});
  // Tooltip
  wrap.querySelectorAll('.cpace-pt').forEach(pt=>{
    const isPR=pt.getAttribute('data-val').includes('🏆')||pt.r.baseVal.value>3;
    const baseR=isPR?6:3;const hoverR=isPR?8:5;
    const tip=document.getElementById('cpace-tip');
    function show(){pt.setAttribute('r',hoverR);if(tip){tip.innerHTML=`<span style="color:var(--text3);font-weight:400;">${pt.getAttribute('data-date')}</span> · <span style="color:${isPR?'var(--gold)':color};">${pt.getAttribute('data-val')}</span>`;tip.style.left=(parseFloat(pt.getAttribute('cx'))/W*100)+'%';tip.style.display='block';}}
    function hide(){pt.setAttribute('r',baseR);if(tip)tip.style.display='none';}
    pt.addEventListener('mouseenter',show);
    pt.addEventListener('mouseleave',hide);
    pt.addEventListener('touchstart',e=>{e.preventDefault();wrap.querySelectorAll('.cpace-pt').forEach(p=>p.setAttribute('r',p.r.baseVal.value>4?6:3));show();},{passive:false});
  });
}

    ...cardioData[i],
    date:document.getElementById('ec-date')?.value||cardioData[i].date,
    time:parseInt(document.getElementById('ec-time')?.value)||cardioData[i].time,
    type:document.getElementById('ec-type')?.value||cardioData[i].type,
    km:parseFloat(document.getElementById('ec-km')?.value)||cardioData[i].km,

    cal:parseInt(document.getElementById('ec-cal')?.value)||0,
    notes:document.getElementById('ec-notes')?.value||'',

  save();closeSheet();renderCardio();showToast('✅ Actividad actualizada');
}

function saveCardioEntry(){
  const km=parseFloat(document.getElementById("ca-km").value);const t=parseInt(document.getElementById("ca-t").value);if(!km||!t) return;
  cardioData.unshift({id:Date.now(),type:window._selCT,date:document.getElementById("ca-d").value,km,time:t,bpm:document.getElementById("ca-b").value?parseInt(document.getElementById("ca-b").value):null,cal:document.getElementById("ca-c").value?parseInt(document.getElementById("ca-c").value):null,notes:document.getElementById("ca-n").value});

}

function patternForDate(dateStr){
  // Returns the planData pattern that was active on dateStr
  // planHistory is sorted ascending by 'from' date
  const sorted = [...planHistory].sort((a,b)=>a.from.localeCompare(b.from));
  let pat = sorted[0]?.pattern || planData;
  for(const entry of sorted){
    if(entry.from <= dateStr) pat = entry.pattern;
    else break;
  }
  return pat;
}

function renderPlanner(){
  if(!window._planExceptions) window._planExceptions=DB.get("tf_pex")||{};
  if(!window._planBlocks) window._planBlocks=DB.get("tf_blocks")||[];

  const DOW_EN  = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const DOW_ES  = ["L","M","X","J","V","S","D"];
  const DOW_FUL = ["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
  const today   = isoDate(new Date());
  const todayMon= mondayOf();

  function getActiveBlock(){ return window._planBlocks.find(b=>b.active&&!b.completed)||null; }

  function planForDay(dateStr){
    if(window._planExceptions[dateStr]) return window._planExceptions[dateStr];
    const dow = DOW_EN[(new Date(dateStr+"T12:00:00").getDay()+6)%7];
    const block = getActiveBlock();

    if(block){
      // Block: only show up to block end date
      const blockMon = block.startDate ? new Date(block.startDate+"T12:00:00") : new Date(todayMon);
      const blockEnd = new Date(blockMon); blockEnd.setDate(blockMon.getDate() + block.weeks*7 - 1);
      const d = new Date(dateStr+"T12:00:00");
      if(d > blockEnd) return [];
      const slots = block.pattern[dow]||[];
      return slots.map(s=>{
        if(!s||s.type==="rest") return {type:"rest"};
        if(s.type==="cardio") return {type:"cardio",name:"Cardio · "+(s.ctype||"Carrera"),color:"#00e5a0",short:"Cardio"};
        const tpl=templates.find(t=>t.id===s.tplId);
        return tpl?{type:"gym",name:tpl.name,color:tpl.color,short:tpl.name.split(" / ")[0],tplId:tpl.id}:{type:"rest"};
      }).filter(s=>s.type!=="rest");
    } else {
      // No block: base pattern applies to this week + next 3 weeks only (not past)
      const d = new Date(dateStr+"T12:00:00");
      if(d < new Date(todayMon)) return []; // no pattern in past weeks
      const cutoff = new Date(todayMon); cutoff.setDate(cutoff.getDate() + 4*7);
      if(d >= cutoff) return [];
      const pat=patternForDate(dateStr);
      const slots = pat[dow] ? [pat[dow].rest?{type:"rest"}:pat[dow].cardio?{type:"cardio",ctype:"Carrera"}:{type:"gym",tplId:pat[dow].tplId}] : [];
      return slots.map(s=>{
        if(!s||s.type==="rest") return {type:"rest"};
        if(s.type==="cardio") return {type:"cardio",name:"Cardio · "+(s.ctype||"Carrera"),color:"#00e5a0",short:"Cardio"};
        const tpl=templates.find(t=>t.id===s.tplId);
        return tpl?{type:"gym",name:tpl.name,color:tpl.color,short:tpl.name.split(" / ")[0],tplId:tpl.id}:{type:"rest"};
      }).filter(s=>s.type!=="rest");
    }
  }

  function slotsForDay(dateStr){ return planForDay(dateStr); }
  function isRest(dateStr){ return slotsForDay(dateStr).length===0; }

  // Weekly summary — respects planWeekOffset
  const wStart = new Date(todayMon); wStart.setDate(wStart.getDate() + planWeekOffset*7);
  const wDays  = Array.from({length:7},(_,i)=>{ const d=new Date(wStart);d.setDate(d.getDate()+i);return isoDate(d); });
  const wDone  = wDays.filter(d=>sessions.some(s=>s.date===d)||cardioData.some(c=>c.date===d)).length;
  const wRest  = wDays.filter(d=>isRest(d)).length;
  const wPend  = Math.max(0, wDays.length - wDone - wRest);

  // Next session (only for current week)
  const upcoming = planWeekOffset===0 ? wDays.find(d=>d>=today&&!isRest(d)&&!sessions.some(s=>s.date===d)&&!cardioData.some(c=>c.date===d)) : null;
  const nextSlots = upcoming?slotsForDay(upcoming):[];
  const nextMain  = nextSlots[0]||null;

  // Week label
  const wLabelMap = {'-2':'Hace 2 semanas','-1':'Semana anterior','0':'Esta semana','1':'Próxima semana','2':'En 2 semanas','3':'En 3 semanas'};

        Esta semana
      </button>
      <button class="tab ${planView==="blocks"?"on":""}" onclick="planView='blocks';renderPlanner()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="6" height="6" rx="1"/><rect x="9" y="3" width="6" height="6" rx="1"/><rect x="16" y="3" width="6" height="6" rx="1"/><rect x="2" y="11" width="6" height="6" rx="1"/><rect x="9" y="11" width="6" height="6" rx="1"/></svg>
        Bloques
      </button>

    ${planView==="blocks"?`

    <!-- BLOQUES -->
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;">
      <span class="slabel" style="margin-bottom:0;">Bloques de entrenamiento</span>
      <button onclick="openNewBlockSheet()" class="btn btn-p" style="padding:6px 12px;font-size:11px;">+ Nuevo</button>
    </div>

    ${window._planBlocks.map((b,bi)=>{
      const days=Object.entries(b.pattern).filter(([,slots])=>slots.length>0);
      const chips=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map((key,i)=>{

            <div style="font-size:11px;color:var(--text2);margin-top:2px;">${b.weeks} semanas${b.active?" · Semana "+b.currentWeek:b.completed?" · Completado":""}</div>
          </div>
          <div style="display:flex;gap:6px;">
            ${!b.completed&&!b.active?`<button onclick="activatePlanBlock(${bi})" style="background:var(--greenL);border:1px solid rgba(0,229,160,.2);color:var(--green);border-radius:8px;padding:4px 10px;font-size:10px;font-weight:700;cursor:pointer;">Activar</button>`:""}
            ${!b.completed?`<button onclick="openBlockDetail(${bi})" style="background:var(--card2);border:1px solid var(--border);color:var(--text2);border-radius:8px;padding:4px 10px;font-size:10px;font-weight:700;cursor:pointer;">Editar</button>`:""}
          </div>
        </div>
        <div style="display:flex;gap:4px;flex-wrap:wrap;margin-bottom:${b.active?'10':'0'}px;">${chips}</div>
        ${b.active?`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;"><span style="font-size:10px;color:var(--text2);">Progreso</span><span style="font-size:10px;font-weight:700;color:var(--accent);">Semana ${b.currentWeek} / ${b.weeks}</span></div><div style="height:4px;border-radius:2px;background:var(--border2);overflow:hidden;"><div style="height:100%;width:${Math.round(b.currentWeek/b.weeks*100)}%;background:var(--accent);border-radius:2px;"></div></div>`:""}
      </div>`;
    }).join("")}

    `:`

    <!-- VIEW TOGGLE SEMANA/MES -->
    <div style="display:flex;justify-content:flex-end;margin-bottom:10px;">
      <div style="display:flex;background:var(--bg2);border-radius:8px;padding:2px;gap:2px;">

        <button style="border:none;background:${planView==="calendar"?"var(--card2)":"transparent"};color:${planView==="calendar"?"var(--text)":"var(--text3)"};font-size:10px;font-weight:700;font-family:'DM Sans',sans-serif;padding:4px 10px;border-radius:6px;cursor:pointer;" onclick="planView='calendar';renderPlanner()">Mes</button>
      </div>

      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#a78bfa" stroke-width="2"><rect x="2" y="3" width="6" height="6" rx="1"/><rect x="9" y="3" width="6" height="6" rx="1"/><rect x="16" y="3" width="6" height="6" rx="1"/></svg>
      <div style="flex:1;font-size:11px;"><span style="color:#a78bfa;font-weight:700;">Bloque activo · </span><span style="color:var(--text2);">${activeBlock.name} · Semana ${activeBlock.currentWeek}/${activeBlock.weeks}</span></div>
      <button onclick="planView='blocks';renderPlanner()" style="background:none;border:none;color:#a78bfa;font-size:10px;font-weight:700;cursor:pointer;">Ver →</button>
    </div>`:""}

    ${planView==="calendar"?`

    <div class="card cp" style="margin-bottom:10px;">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;">
        <button class="btn btn-ghost" style="padding:6px 12px;" onclick="planCalM=${planCalM===0?11:planCalM-1};planCalY=${planCalM===0?planCalY-1:planCalY};renderPlanner()">‹</button>
        <span style="font-family:'Instrument Serif',serif;font-size:16px;">${MONTHS[planCalM]} ${planCalY}</span>
        <button class="btn btn-ghost" style="padding:6px 12px;" onclick="planCalM=${planCalM===11?0:planCalM+1};planCalY=${planCalM===11?planCalY+1:planCalY};renderPlanner()">›</button>
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;margin-bottom:6px;">
        ${DOW_ES.map(d=>`<div style="text-align:center;font-size:9px;font-weight:700;color:var(--text3);padding:3px 0;">${d}</div>`).join("")}
      </div>
      <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:3px;">
        ${Array(((new Date(planCalY,planCalM,1).getDay()+6)%7)).fill('<div></div>').join("")}
        ${Array.from({length:new Date(planCalY,planCalM+1,0).getDate()},(_,i)=>{
          const d=`${planCalY}-${String(planCalM+1).padStart(2,"0")}-${String(i+1).padStart(2,"0")}`;
          const slots=slotsForDay(d);
          const done=sessions.some(s=>s.date===d)||cardioData.some(c=>c.date===d);
          const isT=d===today;
          const isPast=d<today;
          const exc=window._planExceptions[d];
          function resolveColor(rawC){
            if(!rawC) return "#00e5a0";
            if(rawC.startsWith("#")) return rawC;
            if(rawC==="var(--green)"||rawC==="var(--accent-green)") return "#00e5a0";
            if(rawC==="var(--accent)") return "#00d4ff";
            if(rawC==="var(--orange)") return "#ffa63c";
            if(rawC==="var(--red)") return "#ff6b6b";
            if(rawC==="var(--purple)") return "#b39ddb";
            if(rawC==="var(--gold)") return "#ffd166";
            return "#00e5a0";
          }
          // Effective slots: exception overrides pattern
          const effSlots=exc?(exc.type==="rest"?[]:[exc]):slots;
          const firstC=effSlots[0]?.color;
          // Pick color from real logged session if done, else from effective slot
          const daySess=sessions.find(s=>s.date===d);
          const dayCardio=cardioData.find(cc=>cc.date===d);
          let activityColor;
          if(done){
            if(daySess){ const tpl=templates.find(t=>t.id===daySess.tplId); activityColor=tpl?resolveColor(tpl.color):"#00d4ff"; }
            else if(dayCardio){ activityColor="#00e5a0"; }
            else activityColor=resolveColor(firstC);
          } else {
            activityColor=resolveColor(firstC);
          }
          const c=activityColor;
          let bg="var(--card2)",bc="var(--border)",bs="solid";
          if(isT){bg="var(--accentL)";bc="var(--accent)";}
          else if(done){bg=c+"18";bc=c+"44";}
          else if(effSlots.length){bc=c+"44";bs=isPast?"solid":"dashed";}
          const numColor=(done||effSlots.length)?c:"var(--text3)";
          return `<div onclick="openPlanDayPicker('${d}',${i+1})" style="min-height:42px;border-radius:9px;padding:4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;background:${bg};border:1.5px ${bs} ${bc};">
            <div style="font-size:11px;font-weight:700;color:${numColor};">${i+1}</div>
            ${effSlots.length===1?`<div style="width:5px;height:5px;border-radius:50%;background:${c};${isPast&&!done?"opacity:.4;":""}"></div>`:""}
            ${effSlots.length>1?`<div style="display:flex;gap:2px;">${effSlots.map(s=>`<div style="width:4px;height:4px;border-radius:50%;background:${resolveColor(s.color)};"></div>`).join("")}</div>`:""}
            ${exc&&exc.type!=="rest"?`<div style="position:absolute;top:2px;right:3px;font-size:7px;color:var(--gold);">★</div>`:""}
          </div>`;
        }).join("")}
      </div>
      ${(()=>{
        const daysInMonth=new Date(planCalY,planCalM+1,0).getDate();
        const legendMap={};
        for(let i=1;i<=daysInMonth;i++){
          const d=planCalY+"-"+String(planCalM+1).padStart(2,"0")+"-"+String(i).padStart(2,"0");
          const _sl=slotsForDay(d); (Array.isArray(_sl)?_sl:[_sl]).filter(Boolean).forEach(s=>{
            if(s.type==="cardio"&&!legendMap["__cardio__"]) legendMap["__cardio__"]={label:"Cardio",color:"#00e5a0"};
            else if(s.type==="gym"&&s.tplId&&!legendMap[s.tplId]){

        return '<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);">'
          +(chips.length?'<div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;">'+chipsHtml+'</div>':"")
          +'<div style="display:flex;gap:10px;flex-wrap:wrap;">'
          +'<div style="display:flex;align-items:center;gap:4px;"><div style="width:9px;height:9px;border-radius:2px;background:rgba(255,255,255,.06);border:1.5px solid rgba(255,255,255,.2);"></div><span style="font-size:10px;color:var(--text3);">Completado</span></div>'
          +'<div style="display:flex;align-items:center;gap:4px;"><div style="width:9px;height:9px;border-radius:2px;border:1.5px dashed rgba(255,255,255,.15);"></div><span style="font-size:10px;color:var(--text3);">Planificado</span></div>'
          +'<div style="display:flex;align-items:center;gap:4px;"><span style="font-size:10px;color:var(--gold);">★</span><span style="font-size:10px;color:var(--text3);">Excepción</span></div>'
          +'</div></div>';
      })()}
    </div>

    `:`

        if (!_vacWeeks.includes(wMon)) return "";
        return `<div style="background:rgba(255,209,102,.08);border:1px solid rgba(255,209,102,.2);border-radius:10px;padding:10px 12px;margin-bottom:10px;display:flex;align-items:center;gap:8px;">
          <span style="font-size:16px;">🌴</span>

        const isLast=i===6;

            <div style="width:3px;height:30px;border-radius:2px;background:rgba(255,209,102,.3);flex-shrink:0;"></div>
            <div style="flex:1;"><div style="font-size:10px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.4px;">${dayLbl}</div><div style="font-size:12px;color:rgba(255,209,102,.5);margin-top:1px;">🌴 Vacaciones</div></div>
            ${done?`<span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--greenL);color:var(--green);">✓ Entrenado</span>`:""}
          </div>`;
        }
        if(!slots.length){
          return `<div style="display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:${isLast?"none":"1px solid var(--border)"};">
            <div style="width:3px;height:30px;border-radius:2px;background:var(--border);flex-shrink:0;"></div>
            <div style="flex:1;"><div style="font-size:10px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.4px;">${dayLbl}</div><div style="font-size:12px;color:var(--text3);margin-top:1px;">💤 Descanso</div></div>
          </div>`;
        }
        const firstC=slots[0].color;
        const todayC=firstC&&firstC.startsWith("#")?firstC:"#00d4ff";
        return `<div style="padding:9px 0;border-bottom:${isLast?"none":"1px solid var(--border)"};${isT?`background:${todayC}0a;border-radius:8px;padding:9px 8px;margin:0 -8px;`:""}">
          <div style="font-size:10px;color:${isT?todayC:"var(--text3)"};font-weight:700;text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px;">${dayLbl}${isT?" · Hoy":""}</div>
          ${slots.map((s,si)=>{
            const c=s.color||"var(--accent)";
            const isMainDone=done&&si===0;
            return `<div style="display:flex;align-items:center;gap:8px;${si>0?"margin-top:4px;padding:5px 8px;background:"+c+"18;border-radius:8px;border:1px solid "+c+"33;":""}">
              <div style="width:3px;height:${si>0?"24":"30"}px;border-radius:2px;background:${c};flex-shrink:0;${si>0?"display:none;":""}"></div>
              ${si>0?`<span style="font-size:12px;">${s.type==="cardio"?"🏃":"🏋️"}</span>`:""}
              <div style="flex:1;min-width:0;"><div style="font-size:${si>0?11:13}px;font-weight:700;color:${c};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${s.name}${exc&&si===0?` <span style="color:var(--gold);font-size:10px;">★</span>`:""}</div></div>
              ${si===0?`<span style="font-size:10px;font-weight:700;padding:2px 8px;border-radius:6px;background:${done?"var(--greenL)":isT?todayC+"22":"var(--card2)"};color:${done?"var(--green)":isT?todayC:"var(--text3)"};border:${done?"none":isT?`1px solid ${todayC}44`:"1px solid var(--border)"};">${done?"✓ Hecho":isT?"Ahora":"Pendiente"}</span>`:""}
            </div>`;

  // Build week strip
  if(planView!=="blocks") _buildPlanWeekStrip2();

  if(planView!=="blocks"){
    const card = document.getElementById("plan-week-card");

      card.addEventListener("touchstart",e=>{_sx=e.touches[0].clientX;_sy=e.touches[0].clientY;},{passive:true});
      card.addEventListener("touchend",e=>{
        if(_sx===null) return;
        const dx=e.changedTouches[0].clientX-_sx;
        const dy=e.changedTouches[0].clientY-_sy;
        if(Math.abs(dx)>Math.abs(dy)*1.5&&Math.abs(dx)>40){
          if(dx<0){if(planWeekOffset<3){planWeekOffset++;renderPlanner();}}else{if(planWeekOffset>0){planWeekOffset--;renderPlanner();}}

        }

      },{passive:true});

function _buildPlanWeekStrip2(){
  const wrap=document.getElementById("plan-week-inner");
  if(!wrap) return;
  wrap.innerHTML="";
  const DOW_ES=["L","M","X","J","V","S","D"];
  const DOW_EN=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const today=isoDate(new Date());
  const todayMon=mondayOf();

  function slotsForDay(dateStr){
    if(window._planExceptions[dateStr]) return [window._planExceptions[dateStr]];
    const dow=DOW_EN[(new Date(dateStr+"T12:00:00").getDay()+6)%7];
    const block=window._planBlocks.find(b=>b.active&&!b.completed);
    const d=new Date(dateStr+"T12:00:00");
    const isPast=d<new Date(isoDate(todayMon)+"T12:00:00");
    const cutoff=new Date(todayMon);cutoff.setDate(cutoff.getDate()+4*7);
    const pat2=patternForDate(dateStr);
    const rawSlots=block
      ?(block.pattern[dow]||[])
      :(isPast||d>=cutoff)?[]:(pat2[dow]?[pat2[dow].rest?{type:"rest"}:pat2[dow].cardio?{type:"cardio"}:{type:"gym",tplId:pat2[dow].tplId}]:[]);
    return rawSlots.map(s=>{
      if(!s||s.type==="rest") return null;
      if(s.type==="cardio") return {type:"cardio",color:"#00e5a0"};
      const t=templates.find(x=>x.id===s.tplId);
      return t?{type:"gym",color:t.color}:null;
    }).filter(Boolean);
  }

  for(let w=-2;w<=3;w++){
    const wStart=new Date(todayMon); wStart.setDate(wStart.getDate()+w*7);
    const isCur=w===0;
    const col=document.createElement("div");
    col.style.cssText="display:flex;flex-direction:column;gap:4px;";
    const lbl=document.createElement("div");
    lbl.style.cssText="font-size:9px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;padding:0 2px;color:"+(isCur?"var(--accent)":"var(--text3)");
    lbl.textContent=w===-2?"Hace 2":w===-1?"Ant.":w===0?"▸ Esta semana":w===1?"Próx.":"+"+(w)+"sem.";
    col.appendChild(lbl);
    const row=document.createElement("div");
    row.style.cssText="display:flex;gap:4px;";
    for(let d=0;d<7;d++){
      const dd=new Date(wStart); dd.setDate(dd.getDate()+d);
      const dateStr=isoDate(dd);
      const slots=slotsForDay(dateStr);
      const isToday=dateStr===today;
      const done=sessions.some(s=>s.date===dateStr)||cardioData.some(c=>c.date===dateStr);
      const isPast=dateStr<today;
      const cell=document.createElement("div");
      cell.style.cssText="width:44px;border-radius:11px;padding:6px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:68px;cursor:pointer;border:1.5px solid transparent;background:var(--card2);";
      function resolveC(rawC){if(!rawC)return"#00d4ff";if(rawC.startsWith("#"))return rawC;if(rawC==="var(--green)")return"#00e5a0";if(rawC==="var(--accent)")return"#00d4ff";if(rawC==="var(--orange)")return"#ffa63c";if(rawC==="var(--red)")return"#ff6b6b";if(rawC==="var(--purple)")return"#b39ddb";if(rawC==="var(--gold)")return"#ffd166";return"#00d4ff";}
      const firstC=slots[0]?.color;
      // Always use the planned slot color; fall back to session color only if no plan exists
      let actC;
      if(slots.length){
        actC=resolveC(firstC);
      } else if(done){
        const daySess2=sessions.find(s=>s.date===dateStr);
        const dayCard2=cardioData.find(cc=>cc.date===dateStr);
        if(daySess2){const tpl=templates.find(t=>t.id===daySess2.tplId);actC=tpl?resolveC(tpl.color):"#00d4ff";}
        else if(dayCard2){actC="#00e5a0";}
        else actC="#00d4ff";
      } else { actC="#00d4ff"; }
      const c=actC;
      const wMonStr = isoDate(wStart);
      const isVacW  = _vacWeeks.includes(wMonStr);
      if(!slots.length){
        // Descanso: siempre neutro, independientemente de done
        cell.style.borderColor= isVacW ? "rgba(255,209,102,.3)" : "var(--border)";
      } else if(isVacW){cell.style.background="rgba(255,209,102,.06)";cell.style.borderColor="rgba(255,209,102,.25)";}
      else if(isToday&&(done||slots.length)){cell.style.background=c+"18";cell.style.borderColor=c+"88";}
      else if(isToday){cell.style.background="var(--accentL)";cell.style.borderColor="var(--accent)";}
      else if(done){cell.style.background=c+"18";cell.style.borderColor=c+"55";}
      else if(slots.length&&isPast){cell.style.borderColor="rgba(255,107,107,.3)";cell.style.borderStyle="dashed";}
      else if(slots.length){cell.style.borderColor=c+"44";cell.style.borderStyle="dashed";}
      else{cell.style.borderColor="var(--border)";}
      const numColor=isVacW?"rgba(255,209,102,.5)":slots.length?((done||slots.length)?c:"var(--text)"):"var(--text)";
      const dl=document.createElement("div");dl.style.cssText="font-size:8px;font-weight:700;color:"+(isToday&&!(done||slots.length)?"var(--accent)":"var(--text3)");dl.textContent=DOW_ES[d];cell.appendChild(dl);
      const dn=document.createElement("div");dn.style.cssText="font-size:13px;font-weight:700;color:"+numColor;dn.textContent=dd.getDate();cell.appendChild(dn);
      if(isVacW){const ico=document.createElement("div");ico.style.cssText="font-size:10px;";ico.textContent="🌴";cell.appendChild(ico);}
      else if(!slots.length){const ico=document.createElement("div");ico.style.cssText="font-size:10px;";ico.textContent="💤";cell.appendChild(ico);}
      else if(slots.length===1){const dot=document.createElement("div");dot.style.cssText="width:6px;height:6px;border-radius:50%;background:"+c+";";cell.appendChild(dot);}
      else{const dots=document.createElement("div");dots.style.cssText="display:flex;gap:2px;";slots.forEach(s=>{const dc=resolveC(s.color);const dot=document.createElement("div");dot.style.cssText="width:4px;height:4px;border-radius:50%;background:"+dc+";";dots.appendChild(dot);});cell.appendChild(dots);const t=document.createElement("div");t.style.cssText="font-size:7px;font-weight:700;color:var(--text3);";t.textContent="×"+slots.length;cell.appendChild(t);}
      row.appendChild(cell);
    }
    col.appendChild(row);
    wrap.appendChild(col);
    if(w<3){const sep=document.createElement("div");sep.style.cssText="width:1px;background:var(--border);align-self:stretch;margin-top:16px;";wrap.appendChild(sep);}
  }
  requestAnimationFrame(()=>{const s=document.getElementById("plan-week-scroll");if(s)s.scrollLeft=2*(7*48+30);});
}

function activatePlanBlock(idx){
  window._planBlocks.forEach((b,i)=>{
    b.active=i===idx;
    if(i===idx && !b.startDate) b.startDate=mondayOf().toISOString().slice(0,10);
  });
  DB.set("tf_blocks",window._planBlocks);
  renderPlanner();
  showToast("✅ Bloque activado");
}

function openBlockDetail(idx){
  const b=window._planBlocks[idx];
  if(!b) return;
  const DOW_EN=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const DOW_FUL=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];

  function renderBlockDays(){
    return DOW_EN.map((key,i)=>{
      const slots=b.pattern[key]||[];
      const daySlots=slots.map((s,si)=>{
        let c="var(--text3)",name="?";
        if(s.type==="cardio"){c="#00e5a0";name="Cardio · "+(s.ctype||"Carrera");}
        else if(s.tplId){const t=templates.find(x=>x.id===s.tplId);if(t){c=t.color;name=t.name;}}
        return `<div style="display:flex;align-items:center;gap:8px;padding:5px 0;border-top:1px solid var(--border);">
          <div style="width:6px;height:6px;border-radius:50%;background:${c};flex-shrink:0;"></div>
          <span style="font-size:11px;font-weight:600;flex:1;color:var(--text);">${name}</span>
          <button onclick="removeBlockSlot(${idx},'${key}',${si})" style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:16px;line-height:1;padding:0;">×</button>
        </div>`;
      }).join("");
      return `<div style="background:var(--card2);border-radius:10px;padding:10px 12px;border:1px solid var(--border);margin-bottom:6px;">
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:${slots.length?"6":"0"}px;">
          <span style="font-size:12px;font-weight:700;">${DOW_FUL[i]}</span>
          <button onclick="addBlockSlot(${idx},'${key}')" style="background:var(--accentL);border:1px solid rgba(0,212,255,.15);color:var(--accent);border-radius:6px;padding:2px 8px;font-size:10px;font-weight:700;cursor:pointer;">+ Sesión</button>
        </div>
        ${daySlots}
        ${!slots.length?`<div style="font-size:11px;color:var(--text3);">💤 Descanso</div>`:""}
      </div>`;
    }).join("");
  }

  window._editingBlockIdx=idx;
  openSheet(`
    <div class="stitle">${b.name}</div>
    <div class="ssub">${b.weeks} semanas · ${b.active?"Semana "+b.currentWeek+" activa":"Inactivo"}</div>
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;">
      <div><label class="flabel">Nombre</label><input id="block-name" class="inp" value="${b.name}"></div>
      <div><label class="flabel">Duración (sem.)</label><input id="block-weeks" type="number" class="inp" value="${b.weeks}" min="1"></div>
    </div>
    <span class="slabel">Sesiones por día</span>
    <div id="block-day-rows">${renderBlockDays()}</div>
    <div style="display:flex;gap:8px;margin-top:8px;">
      <button class="btn btn-ghost" style="flex:1;justify-content:center;" onclick="closeSheet()">Cancelar</button>
      <button class="btn btn-p" style="flex:2;justify-content:center;" onclick="saveBlockDetail(${idx})">Guardar</button>
    </div>
  `);
}

function removeBlockSlot(blockIdx,key,slotIdx){
  window._planBlocks[blockIdx].pattern[key].splice(slotIdx,1);
  openBlockDetail(blockIdx);
}

function addBlockSlot(blockIdx,key){
  window._editingBlockSlotKey=key;
  _showPickerSheet("Añadir sesión",
    [{icon:"🏋️",label:"Gimnasio",color:"var(--accent)",sub:"Elige plantilla →",fn:()=>_addBlockGym(blockIdx,key)},
     {icon:"🏃",label:"Cardio",color:"var(--green)",sub:"Elige actividad →",fn:()=>_addBlockCardio(blockIdx,key)}
    ]
  );
}

function _addBlockGym(blockIdx,key){
  _showPickerSheet("🏋️ Elige plantilla",
    templates.map(t=>({icon:"",label:t.name,color:t.color,sub:"",fn:()=>{
      if(!window._planBlocks[blockIdx].pattern[key]) window._planBlocks[blockIdx].pattern[key]=[];
      window._planBlocks[blockIdx].pattern[key].push({type:"gym",tplId:t.id});
      openBlockDetail(blockIdx);
    }})),
    ()=>addBlockSlot(blockIdx,key)
  );
}

function _addBlockCardio(blockIdx,key){
  _showPickerSheet("🏃 Elige actividad",
    [{icon:"🏃",label:"Correr",color:"#00e5a0",sub:"",fn:()=>{
      if(!window._planBlocks[blockIdx].pattern[key]) window._planBlocks[blockIdx].pattern[key]=[];
      window._planBlocks[blockIdx].pattern[key].push({type:"cardio",ctype:"Carrera"});
      openBlockDetail(blockIdx);
    }},
    {icon:"🚴",label:"Ciclismo",color:"#00e5a0",sub:"",fn:()=>{
      if(!window._planBlocks[blockIdx].pattern[key]) window._planBlocks[blockIdx].pattern[key]=[];
      window._planBlocks[blockIdx].pattern[key].push({type:"cardio",ctype:"Ciclismo"});
      openBlockDetail(blockIdx);
    }}],
    ()=>addBlockSlot(blockIdx,key)
  );
}

function saveBlockDetail(idx){
  const b=window._planBlocks[idx];
  const nameEl=document.getElementById("block-name");
  const weeksEl=document.getElementById("block-weeks");
  if(nameEl) b.name=nameEl.value||b.name;
  if(weeksEl) b.weeks=parseInt(weeksEl.value)||b.weeks;
  closeSheet(); renderPlanner();
  showToast("✅ Bloque guardado");
}

  const newIdx=window._planBlocks.length;
