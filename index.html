function openWeekExceptionsSheet(){
  const DOW_EN=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const DOW_FUL=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
  if(!window._planExceptions) window._planExceptions={};
  const wMon=new Date(mondayOf()); wMon.setDate(wMon.getDate()+planWeekOffset*7);
  const wDates=Array.from({length:7},(_,i)=>{const d=new Date(wMon);d.setDate(d.getDate()+i);return isoDate(d);});
  const wLabelMap={'0':'Esta semana','1':'Próxima semana','2':'En 2 semanas','3':'En 3 semanas'};
  const wLabel=wLabelMap[String(planWeekOffset)]||'Esta semana';
  openSheet('<div class="stitle">'+wLabel+'</div><div class="ssub">Los cambios solo afectan a esta semana.</div>'+
    wDates.map((dateStr,i)=>{
      const exc=window._planExceptions[dateStr];
      const dow=DOW_EN[i];
      const base=planData[dow];
      const name=exc?'★ '+(exc.name||'Excepción'):(base?.rest?'Descanso':base?.cardio?'Cardio':(templates.find(t=>t.id===base?.tplId)?.name||'Descanso'));
      const c=exc?(exc.color||'var(--gold)'):(base?.cardio?'#00e5a0':base?.tplId?(templates.find(t=>t.id===base.tplId)?.color||'var(--text3)'):'var(--border)');
      const dd=new Date(dateStr+'T12:00:00');
      const dayLbl=DOW_FUL[i]+' '+dd.getDate()+'/'+(dd.getMonth()+1);
      return `<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);"><div style="width:3px;height:32px;border-radius:2px;background:${c};flex-shrink:0;"></div><div style="flex:1;"><div style="font-size:12px;font-weight:700;">${dayLbl}</div><div style="font-size:10px;color:var(--text3);margin-top:1px;">${name}</div></div><button onclick="openPlanDayPicker('${dateStr}',${dd.getDate()})" style="background:var(--card2);border:1px solid var(--border);color:var(--text3);border-radius:8px;padding:4px 10px;font-size:10px;font-weight:700;cursor:pointer;">Cambiar</button></div>`;
    }).join('')+
    '<button class="btn btn-p" style="width:100%;justify-content:center;margin-top:12px;" onclick="save();closeSheet();renderPlanner()">Guardar</button>'
  );
}

function openBasePatternSheet(){
  const DOW_EN=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const DOW_FUL=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
  // Show which week this pattern will apply from
  const fromMon=new Date(mondayOf()); fromMon.setDate(fromMon.getDate()+planWeekOffset*7);
  const fromDate=fromMon.toISOString().slice(0,10);
  const fromLbl=planWeekOffset===0?"desde esta semana":"desde la semana del "+fromMon.getDate()+"/"+(fromMon.getMonth()+1);
  // Load the pattern currently active for that date as starting point
  const basePat=patternForDate(fromDate);
  // Temporarily copy into planData so _openWeekDayPicker edits it live
  DOW_EN.forEach(k=>{ planData[k]=basePat[k]||{rest:true}; });
  openSheet(`
    <div class="stitle">Patrón base</div>
    <div class="ssub">Aplicará ${fromLbl}. Las semanas anteriores no se modifican.</div>
    ${DOW_EN.map((key,i)=>{
      const p=planData[key];
      const name=p?.rest?"Descanso":p?.cardio?"Cardio":(templates.find(t=>t.id===p?.tplId)?.name||"Descanso");
      const c=p?.cardio?"#00e5a0":p?.tplId?(templates.find(t=>t.id===p.tplId)?.color||"var(--text3)"):"var(--border)";
      return `<div style="display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);">
        <div style="width:3px;height:32px;border-radius:2px;background:${c};flex-shrink:0;"></div>
        <div style="flex:1;"><div style="font-size:12px;font-weight:700;">${DOW_FUL[i]}</div><div id="plbl-${key}" style="font-size:10px;color:var(--text3);margin-top:1px;">${name}</div></div>
        <button onclick="_openWeekDayPicker('${key}','${DOW_FUL[i]}',null,null,document.getElementById('plbl-${key}'))" style="background:var(--card2);border:1px solid var(--border);color:var(--text3);border-radius:8px;padding:4px 10px;font-size:10px;font-weight:700;cursor:pointer;">Cambiar</button>
      </div>`;
    }).join("")}
    <button class="btn btn-p" style="width:100%;justify-content:center;margin-top:12px;" onclick="saveBasePattern()">Guardar</button>
  `);
}

function saveBasePattern(){
  const DOW_EN=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const newPattern={};
  DOW_EN.forEach(k=>{ newPattern[k]=planData[k]||{rest:true}; });
  const fromMon=new Date(mondayOf()); fromMon.setDate(fromMon.getDate()+planWeekOffset*7);
  const fromDate=fromMon.toISOString().slice(0,10);
  // Remove existing entry for same date and add new one
  planHistory=planHistory.filter(e=>e.from!==fromDate);
  planHistory.push({from:fromDate, pattern:{...newPattern}});
  planHistory.sort((a,b)=>a.from.localeCompare(b.from));
  // Keep planData in sync with the earliest/most-recent entry for compat
  planData={...newPattern};
  save();
  closeSheet();
  renderPlanner();
  const d=fromMon.getDate()+"/"+(fromMon.getMonth()+1);
  showToast("✅ Patrón guardado desde "+d);
}


function renderGoals(){
  // ── State ──
  if(!window._goalTab)    window._goalTab='week';
  if(!window._goalSub)    window._goalSub='run';

  // ── Ensure goals structure ──
  if(!goals.week)  goals.week  = {run:{km:20,long:10,pace:'4:30',time:90}, bike:{km:60,long:40,speed:30}, gym:{vol:goals.weeklyVol||50000}};
  if(!goals.year)  goals.year  = {
    run: {km:goals.cardioKmYear||400, long:goals.running?.target||25, pace:'4:30'},
    bike:{km:200, long:50, speed:24},
    gym: {lifts: goals.lifts||[]}
  };

  // ── Data helpers ──
  const today = isoDate(new Date());
  const wStart = mondayOf();
  const wDays  = Array.from({length:7},(_,i)=>{ const d=new Date(wStart);d.setDate(d.getDate()+i);return isoDate(d); });

  // Week cardio
  const wRunSess  = cardioData.filter(c=>wDays.includes(c.date)&&c.type==='Carrera');
  const wBikeSess = cardioData.filter(c=>wDays.includes(c.date)&&c.type==='Ciclismo');
  const wRunKm    = Math.round(wRunSess.reduce((a,c)=>a+c.km,0)*10)/10;
  const wBikeKm   = Math.round(wBikeSess.reduce((a,c)=>a+c.km,0)*10)/10;
  const wRunLong  = wRunSess.length  ? Math.max(...wRunSess.map(c=>c.km))  : 0;
  const wBikeLong = wBikeSess.length ? Math.max(...wBikeSess.map(c=>c.km)) : 0;
  const wBikeSpeed= wBikeSess.length ? Math.round(Math.max(...wBikeSess.filter(c=>c.time>0).map(c=>c.km/(c.time/60)))*10)/10 : 0;
  const wRunPace  = wRunSess.filter(c=>c.km>0&&c.time>0).length ? Math.min(...wRunSess.filter(c=>c.km>0&&c.time>0).map(c=>c.time/c.km)) : null;

  // Week gym
  const wSess     = sessions.filter(s=>wDays.includes(s.date));
  const wVol      = Math.round(wSess.reduce((a,s)=>a+s.exercises.reduce((b,e)=>b+e.sets.reduce((c2,st)=>c2+(st.kg||0)*(st.reps||0),0),0),0));

  // Planner sessions this week
  function planSlotsDay(d){
    // Normalise any slot to always have a .type field
    function normalise(s){
      if(!s) return null;
      if(s.type) return s; // already normalised (block pattern)
      if(s.rest) return {type:'rest'};
      if(s.cardio) return {type:'cardio',ctype:s.ctype||'Carrera'};
      if(s.tplId)  return {type:'gym',tplId:s.tplId};
      return null;
    }
    if(window._planExceptions&&window._planExceptions[d]){
      const exc=normalise(window._planExceptions[d]);
      return exc&&exc.type!=='rest'?[exc]:[];
    }
    const DOW=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'];
    const dow=DOW[(new Date(d+'T12:00:00').getDay()+6)%7];
    const block=(window._planBlocks||[]).find(b=>b.active&&!b.completed);
    const raw=block?(block.pattern[dow]||[]):(planData[dow]?[planData[dow]]:[]);
    return raw.map(normalise).filter(s=>s&&s.type!=='rest');
  }
  const planRunDays  = wDays.filter(d=>planSlotsDay(d).some(s=>s.type==='cardio'&&(!s.ctype||s.ctype==='Carrera'))).length;
  const planBikeDays = wDays.filter(d=>planSlotsDay(d).some(s=>s.type==='cardio'&&s.ctype==='Ciclismo')).length;
  const planGymDays  = wDays.filter(d=>planSlotsDay(d).some(s=>s.type==='gym')).length;
  const doneGymDays  = wDays.filter(d=>sessions.some(s=>s.date===d)).length;
  const doneRunDays  = new Set(wRunSess.map(c=>c.date)).size;
  const doneBikeDays = new Set(wBikeSess.map(c=>c.date)).size;

  // Year cardio
  const yr = new Date().getFullYear();
  const yrRunSess  = cardioData.filter(c=>c.date.startsWith(yr)&&c.type==='Carrera');
  const yrBikeSess = cardioData.filter(c=>c.date.startsWith(yr)&&c.type==='Ciclismo');
  const yrRunKm    = Math.round(yrRunSess.reduce((a,c)=>a+c.km,0)*10)/10;
  const yrBikeKm   = Math.round(yrBikeSess.reduce((a,c)=>a+c.km,0)*10)/10;
  const yrRunLong  = yrRunSess.length  ? Math.max(...yrRunSess.map(c=>c.km))  : 0;
  const yrBikeLong = yrBikeSess.length ? Math.max(...yrBikeSess.map(c=>c.km)) : 0;
  const yrBikeSpeedSess = yrBikeSess.filter(c=>c.km>0&&c.time>0);
  const yrBikeSpeed= yrBikeSpeedSess.length ? Math.round(yrBikeSpeedSess.reduce((a,c)=>a+c.km/(c.time/60),0)/yrBikeSpeedSess.length*10)/10 : 0;
  const yrRunPaceSess = yrRunSess.filter(c=>c.km>0&&c.time>0);
  const yrRunBestPace = yrRunPaceSess.length ? Math.min(...yrRunPaceSess.map(c=>c.time/c.km)) : null;

  // Pace format
  function fmtPace(minkm){ if(!minkm) return '—'; const m=Math.floor(minkm); const s=Math.round((minkm-m)*60); return m+"'"+(s<10?'0':'')+s+'"'; }

  // Sparkline data
  const runLongHistory = [...cardioData].filter(c=>c.type==='Carrera').sort((a,b)=>a.date>b.date?1:-1).slice(-8).map(c=>c.km);
  const bikeLongHistory= [...cardioData].filter(c=>c.type==='Ciclismo').sort((a,b)=>a.date>b.date?1:-1).slice(-8).map(c=>c.km);
  const runPaceHistory = [...cardioData].filter(c=>c.type==='Carrera'&&c.km>0&&c.time>0).sort((a,b)=>a.date>b.date?1:-1).slice(-8).map(c=>c.time/c.km);
  const volHistory     = [];
  for(let w=7;w>=0;w--){
    const ws=new Date(wStart); ws.setDate(ws.getDate()-w*7);
    const we=new Date(ws); we.setDate(we.getDate()+7);
    const wSessions=sessions.filter(s=>{const d=new Date(s.date+'T12:00:00');return d>=ws&&d<we;});
    volHistory.push(wSessions.reduce((a,s)=>a+s.exercises.reduce((b,e)=>b+e.sets.reduce((c2,st)=>c2+(st.kg||0)*(st.reps||0),0),0),0));
  }
  // PRs for lifts
  const prs = allPRs();

  // Pct helper
  const pct = (val,target) => target>0 ? Math.min(100, Math.round(val/target*100)) : 0;

  // Day dots for sessions
  function sessDots(done, target, color){
    return Array.from({length:Math.max(target,done)},(_,i)=>`<div style="width:${32}px;height:${32}px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;${i<done?'background:'+color+'22;border:1.5px solid '+color+'55;color:'+color+';':'background:var(--card2);border:1.5px dashed var(--border2);color:var(--text3);'}">
      ${i<done?'✓':''}</div>`).join('');
  }

  // Week day dots
  function weekDayDots(doneDays, planDays, color, type){
    const DOW_LABELS=['L','M','X','J','V','S','D'];
    const colorHex={'var(--green)':'#00e5a0','var(--accent)':'#00d4ff','var(--purple)':'#a78bfa','var(--orange)':'#ffa63c','#38bdf8':'#38bdf8'};
    const hex=colorHex[color]||'#00e5a0';
    return `<div style="display:flex;gap:4px;margin-top:10px;">`+wDays.map((d,i)=>{
      const slots=planSlotsDay(d);
      const hasPlan=type==='gym'?slots.some(s=>s.type==='gym')
                   :type==='Carrera'?slots.some(s=>s.type==='cardio'&&(!s.ctype||s.ctype==='Carrera'))
                   :type==='Ciclismo'?slots.some(s=>s.type==='cardio'&&s.ctype==='Ciclismo')
                   :slots.length>0;
      const done=type==='gym'?sessions.some(s=>s.date===d)
                :type==='Carrera'?cardioData.some(c=>c.date===d&&c.type==='Carrera')
                :type==='Ciclismo'?cardioData.some(c=>c.date===d&&c.type==='Ciclismo')
                :cardioData.some(c=>c.date===d)||sessions.some(s=>s.date===d);
      const rest=!hasPlan;
      const boxStyle=done
        ?`background:${hex}22;border:1.5px solid ${hex}66;color:${hex};`
        :rest
          ?'background:rgba(255,255,255,.04);border:1.5px solid rgba(255,255,255,.12);color:rgba(255,255,255,.3);'
          :'background:rgba(255,255,255,.04);border:1.5px dashed rgba(255,255,255,.2);color:rgba(255,255,255,.3);';
      return `<div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;">
        <div style="width:100%;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;${boxStyle}">${done?'✓':''}</div>
        <span style="font-size:7px;color:${done?hex:'rgba(255,255,255,.3)'};">${DOW_LABELS[i]}</span>
      </div>`;
    }).join('')+'</div>';
  }

  // Gradient bar
  function gbar(val, target, color){
    const p=pct(val,target);
    const colorHexG={'var(--green)':'#00e5a0','var(--accent)':'#00d4ff','var(--purple)':'#a78bfa','var(--orange)':'#ffa63c','#38bdf8':'#38bdf8','var(--red)':'#ff6b6b'};
    const h=colorHexG[color]||color;
    return `<div style="height:10px;background:var(--border2);border-radius:5px;overflow:hidden;margin-bottom:5px;">
      <div style="height:100%;width:${p}%;background:linear-gradient(90deg,${h}44,${h});border-radius:5px;"></div>
    </div>`;
  }

  // Sparkline HTML
  function sparkHtml(id){ return `<div style="display:flex;align-items:flex-end;gap:3px;height:32px;" id="gsp-${id}"></div>`; }

  // Area chart placeholder
  function areaHtml(id){ return `<div style="height:52px;width:100%;" id="gar-${id}"></div>`; }

  // Ring SVG
  function ring(id, p, color, grad){
    const C=2*Math.PI*37;
    const dash=(Math.min(p,100)/100)*C;
    const colorHexR={'var(--green)':'#00e5a0','var(--accent)':'#00d4ff','var(--purple)':'#a78bfa','var(--orange)':'#ffa63c','#38bdf8':'#38bdf8','var(--red)':'#ff6b6b'};
    const g=colorHexR[grad||color]||(grad||color);
    const hc=colorHexR[color]||color;
    return `<div style="position:relative;width:88px;height:88px;flex-shrink:0;">
      <svg width="88" height="88" viewBox="0 0 88 88" style="transform:rotate(-90deg)">
        <defs><linearGradient id="rg-${id}" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="${g}" stop-opacity=".2"/><stop offset="100%" stop-color="${color}"/>
        </linearGradient></defs>
        <circle cx="44" cy="44" r="37" fill="none" stroke="rgba(255,255,255,.07)" stroke-width="9"/>
        <circle cx="44" cy="44" r="37" fill="none" stroke="${p>=100?'#00e5a0':`url(#rg-${id})`}" stroke-width="9"
          stroke-dasharray="${p>=100?C:dash.toFixed(1)} ${C.toFixed(1)}" stroke-linecap="round"/>
      </svg>
      <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;">
        ${p>=100?'<div style="font-size:20px;">🏆</div>':`<div style="font-family:'Instrument Serif',serif;font-size:17px;color:${hc};">${p}%</div>`}
      </div>
    </div>`;
  }

  // Ring card
  function ringCard(id, title, val, target, unit, color, grad, sub, spark, done, warn, proyeccion, compare){
    const p=done?100:pct(val,target);
    const bc=done?'rgba(0,229,160,.25)':warn?'rgba(255,166,60,.2)':'var(--border)';
    const bg=done?'rgba(0,229,160,.03)':'var(--card)';
    const _cHex={'var(--green)':'#00e5a0','var(--accent)':'#00d4ff','var(--purple)':'#a78bfa','var(--orange)':'#ffa63c','#38bdf8':'#38bdf8'};
    const hc=_cHex[color]||color;
    return `<div style="background:${bg};border-radius:14px;padding:13px 14px;margin-bottom:8px;border:1px solid ${bc};box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:14px;">
      ${ring(id, p, done?'var(--green)':color, grad)}
      <div style="flex:1;min-width:0;">
        <div style="font-size:13px;font-weight:700;margin-bottom:3px;">${title}</div>
        <div style="display:flex;align-items:baseline;gap:6px;margin-bottom:4px;flex-wrap:wrap;">
          <span style="font-family:'Instrument Serif',serif;font-size:24px;color:${done?'#00e5a0':hc};">${val}</span>
          <span style="font-size:13px;color:var(--text3);">/ ${target} ${unit}</span>
          ${compare?`<span style="display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:6px;font-size:10px;font-weight:700;background:${compare.dir==='up'?'var(--greenL)':'var(--orangeL)'};color:${compare.dir==='up'?'var(--green)':'var(--orange)'};">${compare.dir==='up'?'↑':'↓'} ${compare.val}</span>`:''}
        </div>
        <div style="font-size:10px;color:${done?'var(--green)':'var(--text3)'};">${sub}</div>
        ${proyeccion?`<div style="font-size:10px;margin-top:3px;font-weight:700;color:${proyeccion.ok?'var(--green)':'var(--orange)'};">Proyección: ${proyeccion.val} ${proyeccion.ok?'✓':'↓'}</div>`:''}
        ${spark?`<span style="font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.6px;text-transform:uppercase;margin-top:8px;margin-bottom:4px;display:block;">Historial</span>${sparkHtml(id)}`:''}
        <button onclick="openEditGoals()" style="background:var(--card2);border:1px solid var(--border);color:var(--text2);border-radius:9px;padding:3px 10px;font-size:10px;font-weight:700;cursor:pointer;margin-top:8px;">${done?'Ver':'Editar'}</button>
      </div>
    </div>`;
  }

  // Bar card
  function barCard(id, title, val, valUnit, target, targetUnit, color, sub, note, spark, area, warn, compare){
    const p=pct(parseFloat(val)||0,target);
    const bc=warn?'rgba(255,166,60,.2)':'var(--border)';
    return `<div style="background:var(--card);border-radius:14px;padding:13px 14px;margin-bottom:8px;border:1px solid ${bc};box-shadow:var(--shadow-sm);">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;">
        <div><div style="font-size:13px;font-weight:700;">${title}</div><div style="font-size:10px;color:var(--text3);margin-top:2px;">Objetivo: ${target}${targetUnit}</div></div>
        <button onclick="openEditGoals()" style="background:var(--card2);border:1px solid var(--border);color:var(--text2);border-radius:9px;padding:3px 10px;font-size:10px;font-weight:700;cursor:pointer;">Editar</button>
      </div>
      <div style="display:flex;align-items:baseline;gap:6px;margin-bottom:10px;flex-wrap:wrap;">
        <span style="font-family:'Instrument Serif',serif;font-size:26px;color:${color};">${val}</span>
        <span style="font-size:13px;color:var(--text3);">${valUnit}</span>
        ${compare?`<span style="display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:6px;font-size:10px;font-weight:700;background:${compare.dir==='up'?'var(--greenL)':'var(--orangeL)'};color:${compare.dir==='up'?'var(--green)':'var(--orange)'};">${compare.dir==='up'?'↑':'↓'} ${compare.val}</span>`:''}
      </div>
      ${gbar(parseFloat(val)||0, target, color)}
      <div style="display:flex;justify-content:space-between;margin-bottom:${spark||area?'10':'0'}px;">
        <span style="font-size:10px;color:var(--text3);">${sub}</span>
        ${note?`<span style="font-size:10px;color:var(--text3);">${note}</span>`:''}
      </div>
      ${spark?`<span style="font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.6px;text-transform:uppercase;margin-bottom:4px;display:block;">Historial</span>${sparkHtml(id)}`:''}
      ${area?`<span style="font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.6px;text-transform:uppercase;margin-bottom:4px;display:block;">Progresión</span>${areaHtml(id)}`:''}
    </div>`;
  }

  // Sessions card
  function sessCard(id, title, done, target, color, showDays, compare, type){
    // Resolve CSS var to real hex for inline style concatenation
    const colorHex={'var(--green)':'#00e5a0','var(--accent)':'#00d4ff','var(--purple)':'#a78bfa','var(--orange)':'#ffa63c','#38bdf8':'#38bdf8'};
    const hex=colorHex[color]||'#00e5a0';
    const dotsHtml=Array.from({length:Math.max(target,done)},(_,i)=>`<div style="width:28px;height:28px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;${i<done?`background:${hex}22;border:1.5px solid ${hex}66;color:${hex};`:'background:rgba(255,255,255,.07);border:1.5px dashed rgba(255,255,255,.28);'}">${i<done?'✓':''}</div>`).join('');
    const compareHtml=compare?`<span style="display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:6px;font-size:10px;font-weight:700;background:${compare.dir==='up'?'var(--greenL)':compare.dir==='down'?'var(--orangeL)':'var(--card2)'};color:${compare.dir==='up'?'var(--green)':compare.dir==='down'?'var(--orange)':'var(--text3)'};">${compare.dir==='up'?'↑':compare.dir==='down'?'↓':'='} ${compare.val}</span>`:'';
    return `<div style="background:var(--card);border-radius:14px;padding:13px 14px;margin-bottom:8px;border:1px solid var(--border);box-shadow:var(--shadow-sm);">
      <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;">
        <div><div style="font-size:13px;font-weight:700;">${title}</div><div style="font-size:10px;color:var(--text3);margin-top:2px;">Calculado desde el Planner</div></div>
        <span style="font-size:10px;color:var(--text3);">automático</span>
      </div>
      <div style="display:flex;align-items:baseline;gap:8px;margin-bottom:10px;">
        <span style="font-family:'Instrument Serif',serif;font-size:26px;color:${color};">${done}</span>
        <span style="font-size:13px;color:var(--text3);">/ ${target} sesiones</span>
        ${compareHtml}
      </div>
      <div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:${showDays?'10':'0'}px;">${dotsHtml}</div>
      ${showDays?weekDayDots(done,target,color,type):''}
    </div>`;
  }

      </button>

    function buildSpark(id, data, color){
      const el=document.getElementById('gsp-'+id); if(!el||!data.length) return;
      const max=Math.max(...data,1);
      el.innerHTML=data.map((v,i)=>{
        const isL=i===data.length-1;
        const h=Math.max(Math.round((v/max)*100),4);
        return`<div style="flex:1;border-radius:2px 2px 0 0;min-height:2px;height:${h}%;background:${isL?color:'rgba(255,255,255,.1)'};"></div>`;
      }).join('');
    }
    function buildArea(id, data, color, reverse){
      const el=document.getElementById('gar-'+id); if(!el||data.length<2) return;
      const vals=reverse?data.map(v=>Math.max(...data)-v+Math.min(...data)):data;
      const W=el.offsetWidth||280, H=52, PAD=8;
      const mn=Math.min(...vals),mx=Math.max(...vals),rng=mx-mn||1;

          <stop offset="0%" stop-color="${hex}" stop-opacity=".25"/><stop offset="100%" stop-color="${hex}" stop-opacity="0"/>
        </linearGradient></defs>
        <path d="${area}" fill="url(#ag${id})"/>
        <path d="${line}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        ${pts.map((p,i)=>i===pts.length-1?`<circle cx="${p.x}" cy="${p.y}" r="4" fill="#b8860b" stroke="#ffd166" stroke-width="1.5"/>`:i===0?`<circle cx="${p.x}" cy="${p.y}" r="3" fill="${color}"/>`:''  ).join('')}
      </svg>`;
    }

    const sub=window._goalSub;
    if(window._goalTab==='week'){
      if(sub==='gym') buildSpark('wgvol', volHistory, 'var(--purple)');
      if(sub==='run') buildArea('wrpace', runPaceHistory, '#00d4ff', true);
    } else {
      if(sub==='run'){
        buildSpark('yrlong', runLongHistory, 'var(--accent)');
        buildArea('yrpace', runPaceHistory, '#ffa63c', true);
      }
      if(sub==='bike'){
        buildSpark('yblong', bikeLongHistory, 'var(--accent)');
        (goals.year.gym.lifts||[]).forEach((l,i)=>{
          const hist=sessions.flatMap(s=>s.exercises.filter(e=>e.exId===l.exId).map(e=>maxWset(e.sets))).filter(Boolean).slice(-8);
          if(hist.length>1) buildSpark('ygc'+i, hist, 'var(--purple)');
        });
      }
      if(sub==='gym'){
        (goals.year.gym.lifts||[]).forEach((l,i)=>{
          const hist=sessions.flatMap(s=>s.exercises.filter(e=>e.exId===l.exId).map(e=>maxWset(e.sets))).filter(Boolean).slice(-8);
          if(hist.length>1) buildSpark('ygc'+i, hist, 'var(--purple)');
        });
      }
    }
  });
}

function openEditGoals(){
  const isYear = window._goalTab === 'year';
  const sub = window._goalSub;
  const subNames = {run:'Carrera', bike:'Ciclismo', gym:'Gimnasio'};
  const g = goals[isYear?'year':'week'][sub];

  function addField(form, id, label, value, unit, type, step){
    const w=document.createElement('div'); w.style.marginBottom='12px';
    const hdr=document.createElement('div'); hdr.style.cssText='display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;';
    const lbl=document.createElement('label'); lbl.style.cssText='font-size:10px;font-weight:700;color:var(--text3);letter-spacing:.5px;text-transform:uppercase;'; lbl.textContent=label;
    const usp=document.createElement('span'); usp.style.cssText='font-size:11px;color:var(--text3);'; usp.textContent=unit;
    hdr.appendChild(lbl); hdr.appendChild(usp);
    const inp=document.createElement('input'); inp.id='gf-'+id; inp.type=type||'number'; inp.value=value||'';
    if(step) inp.step=step;
    inp.style.cssText='width:100%;background:var(--card2);border:1.5px solid var(--border);border-radius:10px;padding:12px;font-size:18px;font-weight:700;text-align:center;color:var(--text);outline:none;box-sizing:border-box;';
    inp.onfocus=()=>{inp.style.borderColor='var(--accent)';};
    inp.onblur=()=>{inp.style.borderColor='var(--border)';};
    w.appendChild(hdr); w.appendChild(inp); form.appendChild(w);
  }

  openSheet(`
    <div class="stitle">${isYear?'Anual':'Esta semana'} · ${subNames[sub]}</div>
    <div class="ssub">${isYear?'Objetivos anuales':'Objetivos semanales · sesiones desde el Planner'}</div>
    <div id="goals-form"></div>
    <div style="display:flex;gap:8px;margin-top:4px;">
      <button class="btn btn-ghost" style="flex:1;justify-content:center;" onclick="closeSheet()">Cancelar</button>
      <button class="btn btn-p" style="flex:2;justify-content:center;" onclick="saveGoalForm('${isYear?'year':'week'}','${sub}')">Guardar</button>
    </div>
  `);

  const form=document.getElementById('goals-form'); if(!form) return;
  const note=document.createElement('div');
  note.style.cssText='background:var(--accentL);border:1px solid rgba(0,212,255,.15);border-radius:10px;padding:9px 12px;font-size:11px;color:var(--text2);margin-bottom:14px;';
  note.textContent='🗓️ Las sesiones se calculan automáticamente desde el Planner';
  form.appendChild(note);

  if(sub==='run'){
    if(!isYear){ addField(form,'km','Km a correr',g.km,'km','number','0.1'); addField(form,'long','Tirada más larga',g.long,'km','number','0.1'); addField(form,'pace','Ritmo más rápido',g.pace,'min:seg'); addField(form,'time','Tiempo corriendo',g.time,'min','number','5'); }
    else { addField(form,'km','Km anuales',g.km,'km','number','10'); addField(form,'long','Mejor tirada larga',g.long,'km','number','0.5'); addField(form,'pace','Ritmo objetivo',g.pace,'min:seg'); }
  } else if(sub==='bike'){
    if(!isYear){ addField(form,'km','Km en bici',g.km,'km','number','5'); addField(form,'long','Salida más larga',g.long,'km','number','5'); addField(form,'speed','Velocidad máxima',g.speed,'km/h','number','0.5'); }
    else { addField(form,'km','Km anuales',g.km,'km','number','10'); addField(form,'long','Salida más larga',g.long,'km','number','5'); addField(form,'speed','Velocidad media objetivo',g.speed,'km/h','number','0.5'); }
  } else {
    note.textContent='🗓️ Días de entreno calculados automáticamente desde el Planner';
    if(!isYear){ addField(form,'vol','Volumen semanal',g.vol,'kg','number','1000'); }
    else {
      note.textContent='Añade ejercicios y pon tu objetivo de marca';
      (g.lifts||[]).forEach((l,i)=>{
        const row=document.createElement('div');
        row.style.cssText='display:flex;align-items:center;gap:10px;background:var(--card2);border-radius:12px;padding:10px 12px;margin-bottom:8px;border:1px solid var(--border);';
        const dot=document.createElement('div'); dot.style.cssText='width:8px;height:8px;border-radius:50%;background:var(--purple);flex-shrink:0;';
        const nm=document.createElement('div'); nm.style.cssText='flex:1;font-size:13px;font-weight:600;'; nm.textContent=l.name;
        const inp2=document.createElement('input'); inp2.type='number'; inp2.value=l.target; inp2.step='2.5';
        inp2.style.cssText='width:76px;background:var(--bg2);border:1.5px solid var(--border);border-radius:8px;padding:7px 10px;font-size:15px;font-weight:700;color:var(--text);text-align:center;outline:none;';
        inp2.onfocus=()=>{inp2.style.borderColor='var(--purple)';};
        inp2.onblur=()=>{inp2.style.borderColor='var(--border)';};
        const kgl=document.createElement('span'); kgl.style.cssText='font-size:11px;color:var(--text3);'; kgl.textContent='kg';
        const xb=document.createElement('button'); xb.style.cssText='background:none;border:none;color:var(--text3);cursor:pointer;font-size:20px;line-height:1;padding:0;';
        xb.textContent='×'; xb.onclick=()=>{ goals.year.gym.lifts.splice(i,1); row.remove(); };
        row.appendChild(dot); row.appendChild(nm); row.appendChild(inp2); row.appendChild(kgl); row.appendChild(xb);
        form.appendChild(row);
      });
      const addBtn=document.createElement('button');
      addBtn.style.cssText='width:100%;background:var(--card2);border:1px solid var(--border);color:var(--text2);border-radius:10px;padding:10px;font-size:12px;font-weight:700;cursor:pointer;margin-top:4px;';
      addBtn.textContent='+ Añadir ejercicio';
      addBtn.onclick=()=>openAddLiftGoal();
      form.appendChild(addBtn);
    }
  }
}

function saveGoalForm(period, sub){
  const g = goals[period][sub];
  const read = id => { const el=document.getElementById('gf-'+id); return el?el.value:null; };
  if(sub==='run'){
    if(read('km'))   g.km    = parseFloat(read('km'));
    if(read('long')) g.long  = parseFloat(read('long'));
    if(read('pace')) g.pace  = read('pace');
    if(read('time')) g.time  = parseInt(read('time'));
    // Sync legacy
    if(period==='year'){ goals.running={target:g.long,label:'Correr '+g.long+'km'}; goals.cardioKmYear=g.km; }
  } else if(sub==='bike'){
    if(read('km'))    g.km    = parseFloat(read('km'));
    if(read('long'))  g.long  = parseFloat(read('long'));
    if(read('speed')) g.speed = parseFloat(read('speed'));
  } else {
    if(read('vol')) { g.vol=parseInt(read('vol')); goals.weeklyVol=g.vol; }
  }
  save(); closeSheet(); renderGoals();
  showToast('✅ Objetivos guardados');
}


function renderLiftGoals(prs){
  if(!prs) prs=allPRs();

function startRest(secs){
  stopRest();
  _restTotal = secs || _restTotal;
  _restSecs = _restTotal;
  const overlay = document.getElementById('rest-overlay');
  const num = document.getElementById('rest-num');
  const ring = document.getElementById('rest-ring-fill');
  const circ = 113;
  if(overlay) overlay.classList.remove('hidden');
  function tick(){
    if(!num||!ring) return;
    num.textContent = _restSecs;
    const offset = circ - (circ * _restSecs / _restTotal);
    ring.style.strokeDashoffset = offset;
    if(_restSecs <= 0){
      stopRest();
      if('vibrate' in navigator) navigator.vibrate([200,100,200]);
      showToast('✅ ¡Descanso completado!');
      return;
    }
    _restSecs--;
  }
  tick();
  _restTimer = setInterval(tick, 1000);
}
function stopRest(){
  if(_restTimer){ clearInterval(_restTimer); _restTimer=null; }
  const overlay = document.getElementById('rest-overlay');
  if(overlay) overlay.classList.add('hidden');
}
function setRest(secs){ startRest(secs); }

function calcAdherence(){
  const last4weeks=[];
  for(let i=3;i>=0;i--){
    const wkStart=new Date(mondayOf());
    wkStart.setDate(wkStart.getDate()-i*7);
    const wkEnd=new Date(wkStart);
    wkEnd.setDate(wkEnd.getDate()+6);
    const planned=EN_DAYS.filter(k=>planData[k]&&!planData[k].rest).length;
    const done=new Set([
      ...sessions.filter(s=>{const d=new Date(s.date+"T12:00:00");return d>=wkStart&&d<=wkEnd;}).map(s=>s.date),
      ...cardioData.filter(c=>{const d=new Date(c.date+"T12:00:00");return d>=wkStart&&d<=wkEnd;}).map(c=>c.date)
    ]).size;
    last4weeks.push({planned,done,pct:planned>0?Math.min(Math.round(done/planned*100),100):0,label:wkStart.getDate()+"/"+(wkStart.getMonth()+1)});
  }
  return last4weeks;
}


function caPaceCalc(){
  const m=parseFloat(document.getElementById("ca-pace-m")?.value||0);
  const s=parseFloat(document.getElementById("ca-pace-s")?.value||0);
  const km=parseFloat(document.getElementById("ca-km")?.value||0);
  if(!m&&!s)return;
  const paceMin=m+(s/60);
  if(km>0){document.getElementById("ca-t").value=Math.round(km*paceMin);}
  else if(document.getElementById("ca-t").value){
    const t=parseFloat(document.getElementById("ca-t").value);
    document.getElementById("ca-km").value=(t/paceMin).toFixed(1);
  }
}
function caAutoCalc(){
  const km=parseFloat(document.getElementById("ca-km")?.value||0);
  const t=parseFloat(document.getElementById("ca-t")?.value||0);
  if(km>0&&t>0){
    const paceMin=t/km;
    document.getElementById("ca-pace-m").value=Math.floor(paceMin);
    document.getElementById("ca-pace-s").value=Math.round((paceMin%1)*60);
  }
}



function _getPlanForDay(dateStr){
  if(!window._planExceptions) window._planExceptions={};
  if(window._planExceptions[dateStr]) return window._planExceptions[dateStr];
  const DOW_EN=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const dow=DOW_EN[(new Date(dateStr+"T12:00:00").getDay()+6)%7];
  const block=(window._planBlocks||[]).find(b=>b.active&&!b.completed);
  if(block){
    const slots=block.pattern[dow]||[];
    if(!slots.length) return {type:"rest"};
    const first=slots[0];
    if(first.type==="cardio") return {type:"cardio",name:"Cardio",color:"#00e5a0",short:"Cardio"};
    const tpl=templates.find(t=>t.id===first.tplId);
    return tpl?{type:"gym",name:tpl.name,color:tpl.color,short:tpl.name.split(" / ")[0],tplId:tpl.id}:{type:"rest"};
  }
  const p=planData[dow];
  if(!p||p.rest) return {type:"rest"};
  if(p.cardio) return {type:"cardio",name:"Cardio",color:"#00e5a0",short:"Cardio"};
  const tpl=templates.find(t=>t.id===p.tplId);
  return tpl?{type:"gym",name:tpl.name,color:tpl.color,short:tpl.name.split(" / ")[0],tplId:tpl.id}:{type:"rest"};
}

function _showPickerSheet(title, options, onBack, extraHtml){

  const cbBase = Date.now();
  options.forEach((opt,i)=>{
    window._pickerCallbacks[cbBase+'_'+i] = opt.fn;
  });
  const backKey = onBack ? cbBase+'_back' : null;
  if(backKey) window._pickerCallbacks[backKey] = onBack;

  const backHtml = backKey
    ? `<button onclick="window._pickerCallbacks['${backKey}']()" style="background:none;border:none;color:var(--text3);cursor:pointer;font-size:20px;padding:0;line-height:1;margin-right:6px;">←</button>`

    </div>

      <div onclick="window._pickerCallbacks['${cbBase}_${i}']()" style="display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:12px;cursor:pointer;margin-bottom:6px;background:var(--card2);border:1.5px solid var(--border);" onmouseover="this.style.borderColor='${opt.color}'" onmouseout="this.style.borderColor='var(--border)'">
        ${opt.icon?`<div style="font-size:22px;width:36px;text-align:center;">${opt.icon}</div>`:`<div style="width:10px;height:10px;border-radius:50%;background:${opt.color};flex-shrink:0;"></div>`}
        <div style="flex:1;"><div style="font-size:14px;font-weight:700;color:var(--text);">${opt.label}</div>${opt.sub?`<div style="font-size:10px;color:var(--text3);margin-top:1px;">${opt.sub}</div>`:""}</div>
        ${opt.sub&&opt.sub.includes("→")?chevIcon("var(--text3)"):""}
      </div>
    `).join("")}
  `);
}


function _openWeekDayPicker(key, dayName, stripe, btn, lbl){
  _showPickerSheet("Plan · "+dayName,
    [{icon:"💤",label:"Descanso",color:"var(--text3)",sub:"Sin entreno",fn:()=>{ planData[key]={rest:true}; _updateDayRow(key,{type:"rest"},stripe,lbl); }},
     {icon:"🏋️",label:"Gimnasio",color:"var(--accent)",sub:"Elige plantilla →",fn:()=>_openWeekGymPicker(key,dayName,stripe,lbl)},
     {icon:"🏃",label:"Cardio",color:"var(--green)",sub:"Elige actividad →",fn:()=>_openWeekCardioPicker(key,dayName,stripe,lbl)}
    ]
  );
}

function _openWeekGymPicker(key,dayName,stripe,lbl){
  _showPickerSheet("🏋️ Elige plantilla",
    templates.map(t=>({icon:"",label:t.name,color:t.color,sub:"",fn:()=>{ planData[key]={tplId:t.id}; _updateDayRow(key,{type:"gym",name:t.name,color:t.color},stripe,lbl); }})),
    ()=>_openWeekDayPicker(key,dayName,stripe,null,lbl)
  );
}

function _openWeekCardioPicker(key,dayName,stripe,lbl){
  _showPickerSheet("🏃 Elige actividad",
    [{icon:"🏃",label:"Correr",color:"#00e5a0",sub:"",fn:()=>{ planData[key]={cardio:true}; _updateDayRow(key,{type:"cardio",name:"Carrera",color:"#00e5a0"},stripe,lbl); }},
     {icon:"🚴",label:"Ciclismo",color:"#00e5a0",sub:"",fn:()=>{ planData[key]={cardio:true,ctype:"Ciclismo"}; _updateDayRow(key,{type:"cardio",name:"Ciclismo",color:"#00e5a0"},stripe,lbl); }}
    ],
    ()=>_openWeekDayPicker(key,dayName,stripe,null,lbl)
  );
}

function _updateDayRow(key,plan,stripe,lbl){
  if(stripe) stripe.style.background=plan.color||"var(--border)";
  if(lbl)    lbl.textContent=plan.name||"Descanso";
  save(); renderPlanner();
}

// ── SWIPE NAVIGATION FOR SUBTABS ──
(function(){
  const SWIPE_MIN=50, SWIPE_MAX_Y=80;
  // Store handlers per element to avoid duplicate listeners
  const _handlers={};

  function addSwipe(elId, getNext, getPrev){
    const el=document.getElementById(elId);
    if(!el) return;
    // Remove old listeners if any
    if(_handlers[elId]){
      el.removeEventListener('touchstart',_handlers[elId].start);
      el.removeEventListener('touchend',  _handlers[elId].end);
    }
    let sx=0,sy=0,blocked=false;
    const onStart=e=>{
      sx=e.touches[0].clientX;
      sy=e.touches[0].clientY;
      // Block swipe if the touch started inside a horizontally scrollable element
      blocked=!!e.target.closest('[style*="overflow-x"],[style*="overflow-x: auto"],[style*="overflow-x:auto"],[style*="overflow-x: scroll"],[style*="overflow-x:scroll"],.chips');
    };
    const onEnd=e=>{
      if(blocked) return;
      const dx=e.changedTouches[0].clientX-sx;
      const dy=Math.abs(e.changedTouches[0].clientY-sy);
      if(Math.abs(dx)<SWIPE_MIN||dy>SWIPE_MAX_Y) return;
      if(dx>0) getPrev(); // swipe right → prev tab
      else     getNext(); // swipe left  → next tab
    };
    el.addEventListener('touchstart',onStart,{passive:true});
    el.addEventListener('touchend',  onEnd,  {passive:true});
    _handlers[elId]={start:onStart,end:onEnd};
  }

  function setupSwipes(){
    // ── Workouts: stats(0) | templates(1) | exercises(2) | history(3) ──
    const WK=['stats','templates','exercises','history'];
    addSwipe('pg-workouts',
      ()=>{ const i=WK.indexOf(wkSub); if(i<WK.length-1){wkSub=WK[i+1];renderWorkouts();} },
      ()=>{ const i=WK.indexOf(wkSub); if(i>0){wkSub=WK[i-1];renderWorkouts();} }
    );

    // ── Cardio: stats(0) | sessions(1) ──
    const CD=['stats','sessions'];
    addSwipe('pg-cardio',
      ()=>{ const t=window._cardioTab||'stats'; const i=CD.indexOf(t); if(i<CD.length-1){window._cardioTab=CD[i+1];renderCardio();} },
      ()=>{ const t=window._cardioTab||'stats'; const i=CD.indexOf(t); if(i>0){window._cardioTab=CD[i-1];renderCardio();} }
    );

    // ── Goals: week(0) | year(1) ──
    const GL=['week','year'];
    addSwipe('pg-goals',
      ()=>{ const t=window._goalTab||'week'; const i=GL.indexOf(t); if(i<GL.length-1){window._goalTab=GL[i+1];renderGoals();} },
      ()=>{ const t=window._goalTab||'week'; const i=GL.indexOf(t); if(i>0){window._goalTab=GL[i-1];renderGoals();} }
    );
  }

  document.addEventListener('DOMContentLoaded', setupSwipes);
  document.addEventListener('DOMContentLoaded', () => renderTopbarRing());
  const _origGoTab=window.goTab;
  window.goTab=function(tab){
    _origGoTab(tab);
    setTimeout(setupSwipes, 150);
  };
})();
</script>
